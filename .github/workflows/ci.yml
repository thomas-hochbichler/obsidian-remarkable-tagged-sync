# Runs on every branch push and on pull requests to `main`. Publishes nothing.
#
# This is the same gate list as release.yml minus the two publishing steps, so a wrong version or
# a broken bundle fails here -- on any branch, in seconds -- instead of after you have spent a tag
# on it. Version numbers are expensive: the store's checker re-reads the repo, so every round of
# reviewer fixes costs a whole new release.
#
# Pushing a branch that has an open PR starts two runs: the push run checks the branch tip, the PR
# run checks the merge result against `main`. Both are meaningful; the duplication is accepted.
#
# Actions are pinned by commit SHA. The trailing comment is the human-readable tag; update both
# together.

name: CI

on:
  push:
    # All branches. The explicit glob (rather than a bare `push:`) keeps tag pushes out -- a
    # release tag would otherwise start a redundant run next to release.yml.
    branches: ["**"]
  pull_request:
    branches: [main]

# A superseded run on the same branch has nothing to say. Releases are never cancelled -- see
# release.yml, which deliberately has no cancel-in-progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed by the git identity gate below, which reads the authors of the pushed commits.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # --- gate 0: private paths ---------------------------------------------------------------
      #
      # Numbered 0 because it runs before the rest and because it is the only failure a later
      # commit cannot undo: a published blob stays in the history whatever the next commit says.
      #
      # It exists because `.gitignore` did not hold. On 2026-08-08, 196 files under `.scratch/`
      # were found tracked on a branch, force-added past the rule, some of them transcripts of
      # real handwritten notes. `git add -f` ignores the ignore file, and a local hook -- which
      # this repo has none of -- would yield to `--no-verify` anyway. This runs on the server, and
      # `verify` is a required check, so it is the layer nothing local can talk its way past.
      - name: Private paths gate
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          # Optional. The patterns are themselves the strings being protected, so they live in a
          # secret rather than in this file; without it the two path checks still run.
          PRIVATE_CONTENT_PATTERNS: ${{ secrets.PRIVATE_CONTENT_PATTERNS }}
        run: node scripts/private-gate.mjs

      # --- gate 14: git identity ---------------------------------------------------------------
      #
      # The correct address lived only in a folder that has since been deleted; global git config
      # here is a work address, and a fresh clone has no local identity. Without this gate the next
      # public commit could carry a work address into a public repo forever.
      #
      # This DETECTS, it does not prevent -- a wrong address is already pushed by the time this
      # runs. Accepted knowingly; the repo has no hook infrastructure.
      #
      # It guards MY address, so it has to stand down where the author is not me. Two such places,
      # and every commit still passes through the gate at least once:
      #   - a pull request from a fork. An outside contributor's address is theirs to choose, and
      #     demanding mine means no outside contribution can ever go green. PR #40, the first one
      #     this repo ever got, is what found that out.
      #   - a push to `main`. `main` takes squash-merges only, so its new commit is either mine --
      #     already checked on the branch push and again on the PR -- or a merged contributor's,
      #     stood down from above. Checking again here only turns `main` red after the merge.
      - name: Git identity
        if: >-
          github.ref_name != 'main'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          EXPECTED: thomas@hochbichler.com
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            range="$BASE..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            # First push of a branch, or a force-push whose old tip is gone. Check the tip only.
            range="HEAD~0..HEAD"
          fi
          echo "checking authors in $range"
          bad=0
          while read -r email; do
            [ -z "$email" ] && continue
            if [ "$email" = "$EXPECTED" ]; then
              echo "  ok    $email"
            else
              echo "  FAIL  $email is not $EXPECTED"
              bad=1
            fi
          done < <(git log --format='%ae' "$range" 2>/dev/null || git log -1 --format='%ae')
          if [ "$bad" = "1" ]; then
            echo "::error::A commit carries the wrong author email. Set it locally: git config user.email $EXPECTED"
            exit 1
          fi

      # --- gate 2: version consistency ---------------------------------------------------------
      #
      # No `--tag` here: on `main` there is no tag to compare against. Running the rest of the gate
      # on every push is the point -- it forces the version bump and the versions.json entry into
      # one commit, or `main` goes red.
      - name: Version gate
        run: node scripts/release-checks.mjs version

      # --- gate 3: changelog (weak on purpose) -------------------------------------------------
      #
      # Only checks that the file parses and `## [Unreleased]` exists. It must NOT demand a section
      # for the current version: entries live under `## [Unreleased]` until tag time, so on `main`
      # no such section exists yet and a stricter check would make `main` permanently red.
      - name: Changelog gate
        run: node scripts/release-checks.mjs changelog --ci

      # --- gate 4: lint ratchet ----------------------------------------------------------------
      #
      # Fails only when the problem count rises above .eslint-baseline.json. It does not fail on
      # errors -- there are 86, and blocking every release until they are fixed is not affordable
      # while a store reviewer is waiting.
      - name: Lint ratchet
        run: node scripts/release-checks.mjs lint

      # --- gate 5: types and tests -------------------------------------------------------------
      - name: Typecheck
        run: npx tsc -noEmit -skipLibCheck

      # `pro/` is in this repo and in this run. It used to be excluded as a known, accepted gap;
      # leaving it out now would mean CI stopped covering the paid half on the day it went on sale.
      #
      # `--coverage` rather than a bare run, because ONE measurement feeds all three readers: the
      # ratchet below, the pull-request comment, and the two badges on `main`. A second run could
      # disagree with the first, and a badge saying 78 % next to a gate that just failed is worse
      # than no badge at all.
      - name: Tests
        run: npm run test:coverage

      # The two jobs below read THIS run's numbers instead of measuring again. Both files are
      # needed: the summary is the totals per file, the final report is what says which lines a
      # pull request left uncovered.
      #
      # `always()` and placed before the gates on purpose: the run where the ratchet just failed is
      # exactly the run whose pull-request comment says which lines are missing.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage/coverage-summary.json
            coverage/coverage-final.json
          retention-days: 7

      # --- gate 8: coverage ratchet ------------------------------------------------------------
      #
      # Absolute uncovered lines and branches, per file, against .coverage-baseline.json. No
      # percentage threshold: at 71.2 % line coverage roughly 41 of 70 deliberate mutations of this
      # code survived all 996 tests, so a percentage here would be a number that stays true while
      # the product breaks.
      - name: Coverage ratchet
        run: node scripts/release-checks.mjs coverage

      # --- gate 9: disabled tests --------------------------------------------------------------
      - name: Disabled tests
        run: node scripts/release-checks.mjs disabled

      # --- gate 10: matrix link ----------------------------------------------------------------
      #
      # The completeness gate. A row claiming a test that does not exist, or a test nobody wrote a
      # row for, is what this catches -- neither is visible to a coverage number, which is why the
      # matrix and not the percentage is the completeness truth here.
      - name: Matrix link
        run: npm run matrix

      # --- gate 6: build -----------------------------------------------------------------------
      - name: Build
        run: npm run build

      # --- gate 7: bundle scan -----------------------------------------------------------------
      #
      # Runs against the built main.js, not src/. This is the check that would have caught the
      # 1.0.5 store rejection: the offending code was inside a bundled dependency, where no lint of
      # our own source could ever see it.
      - name: Bundle scan
        run: node scripts/check-bundle.mjs

  # --- the coverage pull-request comment --------------------------------------------------------
  #
  # A separate job only because of permissions: `verify` runs on every branch push and stays
  # read-only. This one may write a comment and nothing else.
  #
  # It is the half of a coverage service people actually use -- "this change adds 40 lines, 12 of
  # them uncovered", said while the code is still being written. It reports; it never blocks.
  #
  # Skipped for pull requests from forks, where the token is read-only by design and the step would
  # fail on an outside contribution. PR #40, the first this repo ever got, is what teaches that.
  coverage-comment:
    needs: verify
    if: >-
      always()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage

      # Both paths and `file-coverage-mode: changes` are this action's defaults; the checkout is
      # here only so it can read vitest.config.ts.
      - uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2

  # --- the two badges ---------------------------------------------------------------------------
  #
  # Writes .coverage-badge-lines.json and .coverage-badge-branches.json on `main` only, and commits
  # only when a rounded number actually moved -- otherwise every push would produce a badge commit
  # saying what the last one said. `[skip ci]` keeps that commit from starting another run.
  #
  # `continue-on-error`, deliberately: the badge is a status and may not gate anything, including
  # its own failure. If branch protection ever refuses this push, `main` must not go red over a
  # cosmetic number.
  coverage-badges:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage

      - name: Write badges
        run: node scripts/release-checks.mjs badges

      - name: Commit if a number moved
        run: |
          if git diff --quiet -- .coverage-badge-lines.json .coverage-badge-branches.json; then
            echo "no badge changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .coverage-badge-lines.json .coverage-badge-branches.json
          git commit -m "Update coverage badges [skip ci]"
          git push
