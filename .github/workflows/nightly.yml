# The nightly measurement (ticket 14): what changed out there while nothing changed in here.
#
# Measuring jobs and one merge. `ocr` sends the fourteen committed reference pages through the
# live cloud backends and scores them as character error rate; `perf` times the heavy synthetic
# page on this fixed runner class (ticket 21). A `contract` half was planned and deliberately
# dropped 2026-08-24 -- measuring the live reMarkable and Polar APIs nightly needs a throwaway
# account and a test licence key as CI secrets, and that cost was ruled out.
# `verdict` merges whatever parts reported into `.nightly-verdict.json` and commits
# it to `main` -- a job that died is recorded `unknown`, never carried forward, so a stale number
# can never wear a fresh timestamp.
#
# The jobs run in parallel on purpose: cheap-first ordering would let one API's outage silently
# skip the other measurement, and this workflow publishes nothing so there is nothing to save by
# failing early. Secrets live in the `nightly` environment, limited to `main`, passed per step.
#
# Actions are pinned by commit SHA. The trailing comment is the human-readable tag; update both
# together.

name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # For the standing `[nightly] ocr` issue the verdict job keeps: opened on a bad night, commented
  # on while it stays bad, closed by the first green one -- plus the monthly drift comment.
  issues: write

jobs:
  ocr:
    # A fork must neither schedule this nor reach for the secrets.
    if: github.repository == 'thomas-hochbichler/obsidian-remarkable-tagged-sync'
    runs-on: ubuntu-latest
    environment: nightly
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # One credential: every model rides through OpenRouter (see NIGHTLY_BACKENDS), bought as
      # credits with a spend cap on OpenRouter's side. Direct-provider keys would buy live coverage
      # of the direct endpoints' envelopes; that belongs to the contract half when it lands.
      - name: Measure the reference pages
        run: npm run nightly:ocr
        env:
          # Accepts either secret name: the environment was first set up as OPENROUTER_API.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER_API }}
      - name: Write the run summary
        if: always()
        run: |
          if [ -f nightly-parts/ocr.json ]; then
            node scripts/nightly-summary.mjs >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep the part for the verdict job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: part-ocr
          path: nightly-parts/ocr.json
      - name: Keep the failing transcripts for whoever debugs a CER jump
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocr-transcripts
          path: nightly-parts/artifacts/
          retention-days: 14
          if-no-files-found: ignore

  # The perf half (ticket 21): the heavy synthetic page timed on this fixed runner class. No
  # secrets, no network -- its own job so no other step's work leaks into the timing.
  perf:
    if: github.repository == 'thomas-hochbichler/obsidian-remarkable-tagged-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Time the heavy page
        run: npm run nightly:perf
      - name: Keep the part for the verdict job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: part-perf
          path: nightly-parts/perf.json

  verdict:
    if: always() && github.repository == 'thomas-hochbichler/obsidian-remarkable-tagged-sync'
    needs: [ocr, perf]
    runs-on: ubuntu-latest
    # For NIGHTLY_DEPLOY_KEY: main's ruleset requires pull requests, and the GitHub Actions app
    # cannot be a bypass actor on a personal repo -- a deploy key can. The key is scoped to this
    # one repo, lives only in this environment, and pushing with it is the one thing it exists for.
    environment: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          ssh-key: ${{ secrets.NIGHTLY_DEPLOY_KEY }}
          # The drift curve reads the verdict file's whole git history.
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: part-ocr
          path: nightly-parts
        # A missing artifact means the job died before reporting; the merge records `unknown`.
        continue-on-error: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: part-perf
          path: nightly-parts
        continue-on-error: true
      - name: Merge the parts and commit the verdict
        run: |
          subject="$(node scripts/nightly-merge.mjs | tail -1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nightly-verdict.json
          if git diff --cached --quiet; then
            echo "verdict unchanged"
            exit 0
          fi
          git commit -m "$subject"
          # A push race with the maintainer retries, then fails loudly -- a silently dropped
          # verdict is a stale verdict.
          pushed=""
          for attempt in 1 2 3; do
            if git push; then pushed=yes; break; fi
            git pull --rebase
          done
          [ -n "$pushed" ] || exit 1
      # Layer 2 of "who is told": one standing issue per measuring part, found by its title marker.
      # Consecutive bad nights append a comment instead of piling up duplicates; the first fully
      # green night closes it and says which night recovered.
      - name: Keep the standing issues in step with the night
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for part in ocr perf; do
            status=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.nightly-verdict.json','utf8')).parts.$part.status)")
            title="[nightly] $part"
            number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title==\"$title\") | .number" | head -1)
            if [ "$status" = "pass" ]; then
              if [ -n "$number" ]; then
                gh issue comment "$number" --body "Recovered: tonight's run is green. $run_url"
                gh issue close "$number"
              fi
            else
              label=$([ "$status" = "unknown" ] && echo "needs-info" || echo "ready-for-agent")
              body="Tonight's $part part is \`$status\`. Details: $run_url"
              if [ -n "$number" ]; then
                gh issue comment "$number" --body "$body"
              else
                gh issue create --title "$title" --label "$label" --body "$body"
              fi
            fi
          done
      # Layer §7.2: the nightly of the 1st posts the 30-day table on the standing drift issue.
      # One comment a month gets read; one a night gets muted.
      - name: Post the monthly drift table
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(date -u +%d)" = "01" ] || exit 0
          title="OCR drift"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ -z "$number" ]; then
            number=$(gh issue create --title "$title" --body "Standing issue: the nightly of the 1st posts the 30-day drift table here." | grep -oE '[0-9]+$')
          fi
          { echo '```'; node scripts/ocr-curve.mjs; echo '```'; } > /tmp/curve.md
          gh issue comment "$number" --body-file /tmp/curve.md
