# The one-off macOS 27 comparison run, for the article that asks whether Apple's Vision framework
# reads handwriting better than it did on macOS 26.
#
# Deliberately not a job in `nightly.yml`. The `xcode-27` image is in public preview -- GitHub says
# its software "can be unstable" and warns about queueing -- and the nightly is a measurement that
# has to stay trustworthy every morning. A flaky runner belongs nowhere near it. This file also
# commits nothing and writes no verdict: it reads the same fifteen pages and hands back the part.
#
# `xcode-27`, not `macos-27`: since 2026-07-16 GitHub names macOS images after the major Xcode
# version rather than the OS, and the image is arm64-only.
#
# Before publishing any number this produces, read `macosBuild` in the part. `26A428` is the
# shipped macOS 27 and may be written about; `26A5406e` is Golden Gate beta 5 and may not, because
# Apple's developer agreement holds pre-release builds confidential until commercial release.
# The Darwin version cannot tell the two apart.
#
# Actions are pinned by commit SHA, same as `nightly.yml`. The trailing comment is the tag.

name: Vision on macOS 27

# The `push` trigger is temporary scaffolding and comes out before this branch merges. GitHub only
# offers the manual button for workflows that already exist on the default branch, so a file that
# has never been on `main` cannot be dispatched at all -- pushing the branch is the only way to
# make this run before it is merged.
on:
  workflow_dispatch:
  push:
    branches: [macos-27-vision]

jobs:
  vision-27:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Say which machine this is before anything measures on it
        run: sw_vers
      # Temporary, and out with the `push` trigger: the nightly harness classifies a failed backend
      # the way it classifies a cloud one, so the first macOS 27 run reported "network error" for a
      # machine that never touched the network. This asks Vision itself what went wrong.
      #
      # The control image is a 320x240 blank. On macOS 26.5.2 the shipped driver answers
      # `{lines: [], boxes: [], revision: "3"}` for it -- Vision working and finding nothing -- and
      # `performRequestsError` returns true with `defaultRevision` 3.
      - name: Ask Vision what it objects to
        continue-on-error: true
        run: |
          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAAAAAA6fptVAAAACklEQVR4nGP4DwABAQEAWk1v8QAAAABJRU5ErkJggg==' | base64 -d > /tmp/probe.png
          sips -z 240 320 /tmp/probe.png --out /tmp/probe_big.png >/dev/null
          cat > /tmp/err-probe.js <<'JXA'
          ObjC.import('Foundation');
          ObjC.import('Vision');
          function run(argv) {
            var out = {};
            var url = $.NSURL.fileURLWithPath($(argv[0]));
            var req = $.VNRecognizeTextRequest.alloc.init;
            req.recognitionLevel = 0;
            req.usesLanguageCorrection = true;
            try { out.defaultRevision = $.VNRecognizeTextRequest.defaultRevision.toString(); } catch (e) { out.defaultRevision = 'threw: ' + e; }
            try { out.reqRevision = req.revision.toString(); } catch (e) { out.reqRevision = 'threw: ' + e; }
            var handler = $.VNImageRequestHandler.alloc.initWithURLOptions(url, $({}));
            var err = $();
            out.ok = handler.performRequestsError($.NSArray.arrayWithObject(req), err);
            try { out.error = ObjC.unwrap(err.localizedDescription); } catch (e) { out.error = 'no description: ' + e; }
            try { out.errorCode = err.code; out.errorDomain = ObjC.unwrap(err.domain); } catch (e) {}
            try { out.results = req.results.isNil() ? 'nil' : req.results.count; } catch (e) { out.results = 'threw: ' + e; }
            return JSON.stringify(out);
          }
          JXA
          echo '--- 320x240 blank, the image macOS 26 accepts ---'
          osascript -l JavaScript /tmp/err-probe.js /tmp/probe_big.png || echo "osascript rc=$?"

      - name: Read the reference pages with Apple Vision
        run: npm run nightly:vision
      - name: Write the run summary
        if: always()
        run: |
          if [ -f nightly-parts/vision.json ]; then
            node scripts/nightly-summary.mjs nightly-parts/vision.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep the part to compare against the macOS 26 measurement
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vision-27-part
          path: nightly-parts/vision.json
