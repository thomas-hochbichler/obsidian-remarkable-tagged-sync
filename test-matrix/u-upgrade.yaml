# The upgrade layer -- the second half of the question this whole effort exists to answer.
#
# "A new feature must not silently break an existing one" is what every other file here is about.
# **"An update must not damage a vault that already exists"** is this one, and it cannot be answered
# by a fixture somebody wrote: an invented "old" vault only proves the current version copes with
# something we made up, and the assumption about what old looked like is the same assumption that was
# already wrong once -- issue #10 was an ancient notebook nobody had expected.
#
# So the state in `test-fixtures/legacy-state/` was produced by **a shipped release's own build**,
# replayed against the fake device beside it. `npm run freeze-state` rewrites it once per release,
# right after the tag, and the version gate fails the *next* release if that is skipped.
#
# What makes an upgrade do any work is the scenario's job, not the fixture's: an unchanged device, an
# unchanged mapping and an unchanged renderer add up to an upgrade that really does nothing, and
# `runSync` returns early on exactly that. Each row below names its own reason to run.
#
# Layer `vault`: a real temporary directory, a real filesystem, today's `runSync`.

- feature: A8
  name: An upgrade keeps what the user had -- the vault half
  code: src/sync-engine.ts
  tier: free
  scenarios:
    - id: A8.20
      scenario: The frozen state is inspected before anything runs against it
      expect: 'It names the release that produced it, its renderer is no newer than today''s, and every row agrees with `meta.json` about which renderer wrote it. It is deliberately **not** asserted to be stale: the freeze runs right after a tag, so its renderer *is* today''s until the next bump -- demanding staleness here failed the freeze in the PR that ran it, and made every scenario below depend on when that happened (ticket 23). Each one now brings its own reason to run'
      layer: vault
      file: src/legacy-upgrade.test.ts
      test: "the frozen state itself > was produced by a shipped release, and every row carries the renderer that wrote it"

    - id: A8.21
      scenario: The shape of the frozen vault
      expect: One document under two tags, one tagged by folder inheritance, and a nested target folder. That is the minimum worth freezing -- the first is where duplication bugs live
      layer: vault
      file: src/legacy-upgrade.test.ts
      test: "the frozen state itself > holds the three shapes duplication bugs live in"

    - id: A8.22
      scenario: A user paragraph below the fence, and an unrelated note of their own, in a vault whose renderer has moved on
      expect: Both survive the re-render. The renderer bump is the scenario's own -- it is what makes an upgrade re-render anything, and stating it here is what keeps the test from depending on the fixture's age. The assertion resolves the note through its index row rather than through a fixed path, because a legitimate re-mapping moves it -- the naive form crashes
      layer: vault
      file: src/legacy-upgrade.test.ts
      test: "upgrading a vault the last release wrote > keeps what the user wrote below the fence when the renderer moves under it"

    - id: A8.23
      scenario: The user edited a note **inside** the managed block
      expect: Not overwritten, and counted as skipped. The only assertion here whose failure is silent data loss rather than clutter
      layer: vault
      file: src/legacy-upgrade.test.ts
      test: "upgrading a vault the last release wrote > refuses to overwrite a managed block the user edited, and counts it"

    - id: A8.24
      scenario: A tag is re-pointed at a different folder between the two versions
      expect: The note moves, taking the user's own paragraph with it, and nothing is left at the old path
      layer: vault
      file: src/legacy-upgrade.test.ts
      test: "upgrading a vault the last release wrote > moves a re-mapped note rather than leaving a second copy behind"

    - id: A8.31
      scenario: A note the old release wrote was moved by the user into a folder of their own; the new version's renderer has moved on
      expect: The note is rewritten where the user put it, and nothing reappears at the old path. The old release wrote no `folder` on its rows, so before the load-time stamp a moved note looked re-targeted and every full scan dragged it home and re-transcribed it (#101)
      layer: vault
      file: src/legacy-upgrade.test.ts
      test: "upgrading a vault the last release wrote > rewrites a note the user moved out of its folder where it lies, instead of dragging it back (#101)"

    - id: A8.32
      scenario: A note the old release wrote was moved by the user into a folder of their own; then one more document gains the already-mapped tag on the device
      expect: Only the new document is written, and the moved note stays put -- the reporter's exact sequence at the upgrade boundary, where the old release re-imported the whole set. The index is given today's renderer first, for the mirror of the ticket-23 reason -- one bump after the freeze everything is legitimately stale, and "only the new document" would fail on rows the scenario never touched
      layer: vault
      file: src/legacy-upgrade.test.ts
      test: "upgrading a vault the last release wrote > writes only a newly tagged document, and a note the user moved stays put (#101)"

    - id: A8.25
      scenario: Every index row after the upgrade
      expect: Each points at a file that exists, under the folder its tag maps to
      layer: vault
      file: src/legacy-upgrade.test.ts
      test: "upgrading a vault the last release wrote > leaves every row pointing at a file that exists, under the folder its tag maps to"

    - id: A8.26
      scenario: The attachment after a re-render the renderer bump asked for
      expect: 'Same path, same embed, and the file really was rewritten -- proved by putting bytes there that no render produces, not by comparing two renders. `pdf-lib` stamps the wall clock into a compressed stream, so a hash assertion would fail on every run; asserting the two renders *differ* is the same mistake reversed, and it went red the first time a state was frozen and tested within one second. The bytes are compared in neither direction'
      layer: vault
      file: src/legacy-upgrade.test.ts
      test: "upgrading a vault the last release wrote > keeps the attachment at its path, and never asserts its bytes"

    - id: A8.27
      scenario: The upgrade is run a second time
      expect: Nothing left to do. A settled vault stays settled, which is what says the first run finished rather than merely stopped. The first run is given a renderer bump to do, or both runs would find nothing and the test would pass on a vault nobody touched
      layer: vault
      file: src/legacy-upgrade.test.ts
      test: "upgrading a vault the last release wrote > finds nothing left to do on a second upgrade, which is what a settled vault looks like"

- feature: G7
  name: Notes are never deleted -- and never quietly duplicated
  code: src/sync-engine.ts
  tier: free
  scenarios:
    - id: G7.1
      scenario: The user deleted a synced note before upgrading
      expect: 'Recreated, and **no second file beside it**. This is the case "no note duplicated" gets wrong when written as "no note added": the recreation is documented behaviour, and that assertion calls it damage'
      layer: vault
      file: src/legacy-upgrade.test.ts
      test: "upgrading a vault the last release wrote > recreates a note the user deleted, and does not leave a second one beside it"

    - id: G7.2
      scenario: An interrupted sync left a note on disk with no index row, and then a renderer bump makes the next sync look at that document
      expect: 'The real duplicate -- `Reading List (read).md` written beside the file the sync would not clobber. Caught by the assertion that every fence-carrying file is the `notePath` of exactly one active row, which is the only formulation that separates this from G7.1. Its other half catches two rows writing to one path'
      layer: vault
      file: src/legacy-upgrade.test.ts
      test: "a vault an interrupted sync left behind > is caught by ownership, where 'no note added' would have missed it"
