# Gap G18 -- the half of the managed local model that touches the disk and the network.
#
# 504 lines with no test file, and the gap list's summary was exact: "excellent pure planners,
# unconnected to anything that runs". Every rule here is verified in `local-model-download.test.ts`;
# that this file *consults* them was not. The stake is 5.5 GB of somebody's bandwidth and a binary
# that has to start on their machine.
#
# Layer `vault`: real `fs` in a real temporary directory, because Node's filesystem is not the thing
# under test and a faked one would let a rename that never happened pass. The network is faked by
# replacing `get` on the CommonJS `https` module -- the same singleton the code's dynamic `require`
# resolves to.

- feature: E5
  name: Downloadable local model -- the download itself
  code: src/local-model-fetch.ts
  tier: free
  scenarios:
    - id: E5.1
      scenario: A download runs from nothing to finished
      expect: Both model files in place, the archive deleted, no `.part` left, the verified marker written and the lock released
      layer: vault
      file: src/local-model-fetch.test.ts
      test: "a download that runs to the end > writes both markers' worth of state: the files in place and the verified marker"

    - id: E5.2
      scenario: The order the three artefacts are fetched in
      expect: The 12 MB engine first. A broken engine, a missing `tar` or a quarantined archive then surfaces in seconds rather than after the hours the model takes
      layer: vault
      file: src/local-model-fetch.test.ts
      test: "a download that runs to the end > fetches the 12 MB engine before the 5.5 GB model, so a broken setup surfaces in seconds"

    - id: E5.3
      scenario: A `.part` is on disk and the server honours the `Range`, answering 206
      expect: '`bytes=<offset>-` is asked for and the body is appended. The file is byte-identical to a clean download'
      layer: vault
      file: src/local-model-fetch.test.ts
      test: "resuming a part-finished download > asks for the rest and appends it when the server honours the range"

    - id: E5.4
      scenario: A `.part` is on disk and the server **ignores** the `Range`, answering 200 -- the sharpest edge in the whole downloader
      expect: The part is truncated, not appended to. Appending would splice two beginnings together, and only the final hash would find out, after 5.5 GB
      layer: vault
      file: src/local-model-fetch.test.ts
      test: "resuming a part-finished download > throws the part away when the server ignores the range and answers 200"

    - id: E5.5
      scenario: The `.part` is already the full size -- the last run died between the write and the rename
      expect: Renamed into place. Nothing is requested at all
      layer: vault
      file: src/local-model-fetch.test.ts
      test: "resuming a part-finished download > renames a part that is already complete instead of asking for it again"

    - id: E5.6
      scenario: An artefact is already installed at the right size
      expect: Skipped, and its bytes still counted toward the bar
      layer: vault
      file: src/local-model-fetch.test.ts
      test: "resuming a part-finished download > skips an artefact that is already in place at the right size"

    - id: E5.7
      scenario: The model's hash does not match, twice
      expect: One clean retry from zero -- not a resume into the same bad bytes -- then the corrupt marker on disk and a terminal failure. A third attempt is 5.5 GB spent on hope, and the marker is on disk because a restart would otherwise buy one
      layer: vault
      file: src/local-model-fetch.test.ts
      test: "bytes that are not the published ones > tries once more from zero, then records the corrupt marker and stops"

    - id: E5.8
      scenario: The **engine's** hash does not match
      expect: No corrupt marker. It is 12 MB, so a fresh attempt after a restart costs seconds, and the marker exists to protect the 5.5 GB half
      layer: vault
      file: src/local-model-fetch.test.ts
      test: "bytes that are not the published ones > leaves no corrupt marker for the engine, which costs seconds to fetch again"

    - id: E5.9
      scenario: The CDN ends the body early and cleanly -- no error, simply fewer bytes than it promised
      expect: The short file is refused by name and never renamed into place. Nothing in the stream handling sees this one; the size check is the only thing between it and a truncated model
      layer: vault
      file: src/local-model-fetch.test.ts
      test: "a body that ends early without saying so > refuses a short file rather than renaming it into place"

    - id: E5.10
      scenario: There is not enough free space for the download plus its extraction headroom
      expect: Refused before a byte is fetched and before the lock is taken, naming the shortfall
      layer: vault
      file: src/local-model-fetch.test.ts
      test: "the disk it is about to fill > refuses before writing anything, and says how much is missing"

    - id: E5.11
      scenario: The engine archive is unpacked on macOS, and then on Windows
      expect: '`--strip-components=1` on macOS and no strip on Windows. Pinned per platform rather than sniffed: the macOS tarball wraps its payload in one directory and the Windows zip does not'
      layer: vault
      file: src/local-model-fetch.test.ts
      test: "unpacking the engine > strips the wrapping directory on macOS and nothing on Windows"

    - id: E5.12
      scenario: '`tar` exits 0 having written nothing useful -- what a wrong strip depth actually does'
      expect: A visible extract failure, not a "ready" state whose first transcription dies
      layer: vault
      file: src/local-model-fetch.test.ts
      test: "unpacking the engine > calls a successful tar that unpacked nothing a failure, rather than a ready state"

    - id: E5.13
      scenario: The user cancels while the download is running
      expect: Reported as cancelled and never as a network failure, the lock released, and no verified marker
      layer: vault
      file: src/local-model-fetch.test.ts
      test: "cancelling mid-stream > stops, releases the lock, and leaves the part where a resume can find it"

    - id: E5.14
      scenario: The two tools this file is forbidden to use
      expect: 'No `shell.openPath` and no `requestUrl` call. A source-level guard on purpose: a quarantined binary is SIGKILLed on somebody else''s Mac, and `requestUrl` buffering 5.5 GB is an out-of-memory crash on a machine that is not this one. Neither has a runtime signal here'
      layer: vault
      file: src/local-model-fetch.test.ts
      test: "the tools it refuses to use > never hands a file to the OS to open, which is what would quarantine the engine"

    - id: E5.15
      scenario: What is handed to the system `tar`
      expect: The archive it just wrote and the directory it wants it in -- so a wrong path is a failure here rather than a silent no-op
      layer: vault
      file: src/local-model-fetch.test.ts
      test: "the tools it refuses to use > unpacks with the system tar, and asks for a real archive path"

- feature: E34
  name: What the background-sync switch says it does
  code: src/local-model-card.ts
  tier: free
  scenarios:
    - id: E34.1
      scenario: The description beside the switch
      expect: What being off means before what being on costs. Off is not mild -- the gate fires before a run starts (C15), so the whole scheduled sync is skipped and nothing arrives on its own while this backend is chosen. The old copy named only the price, "the model holds 8.6 GB and pushes the fans", and was reported as a setting nobody could picture. The memory figure stays; it is the reason to think before switching it on
      layer: unit
      file: src/local-model-card.test.ts
      test: "consent (§7.2) > says what the switch does before what it costs, and how much off actually costs"

- feature: E33
  name: A download this vault is not the one running
  code: src/local-model-card.ts
  tier: free
  scenarios:
    - id: E33.1
      scenario: A download is under way and this plugin instance is not the one running it
      expect: The growing file's own percentage, read off the disk -- a spinner would say "wait" about something that has a number
      layer: unit
      file: src/local-model-card.test.ts
      test: "the states that carry a decided sentence > shows the download's progress rather than a spinner"

    - id: E33.2
      scenario: What that heading is allowed to claim
      expect: Not a second vault. The lock holds a timestamp and nothing else (E32), so this cannot see one -- and a download left running by a previous plugin instance arrives looking identical, which is how a user with one vault open was told about a vault that did not exist. The paragraph offers both readings; the heading asserts neither
      layer: unit
      file: src/local-model-card.test.ts
      test: "the states that carry a decided sentence > claims no second vault in the heading, because it cannot see one"

- feature: E32
  name: Which job is holding the lock
  code: src/local-model-store.ts
  tier: free
  scenarios:
    - id: E32.1
      scenario: A transcription holds the lock -- a fresh lock with no `.part` anywhere
      expect: Busy. Two concurrent runs are 27 GB, so a second one must not start beside it
      layer: pure
      file: src/local-model-store.test.ts
      test: "isTranscriptionInProgress > blocks a second run while a transcription holds the lock"

    - id: E32.2
      scenario: The model half of a download holds it -- a `.part` beside the model
      expect: Not busy. A download lasts hours, and refusing to sync for hours costs renders, notes and highlights
      layer: pure
      file: src/local-model-store.test.ts
      test: "isTranscriptionInProgress > lets a sync run while a download holds it"

    - id: E32.3
      scenario: The **engine** half holds it -- E5.2 fetches the engine first, and its `.part` lands in the engine directory, not beside the model
      expect: Not busy. This was read as a foreign transcription for the whole first minute of every download -- Resume refused with "another vault is transcribing", and a sync in that window skipped transcription for a reason that was not true
      layer: pure
      file: src/local-model-store.test.ts
      test: "isTranscriptionInProgress > lets a sync run while the engine half of a download holds it"

    - id: E32.4
      scenario: A lock nobody renews any more
      expect: Not busy once it is older than the stale window; a crashed holder must not wedge the directory forever
      layer: pure
      file: src/local-model-store.test.ts
      test: "isTranscriptionInProgress > ignores a lock nobody is renewing any more"

    - id: E32.5
      scenario: No lock at all
      expect: Not busy
      layer: pure
      file: src/local-model-store.test.ts
      test: "isTranscriptionInProgress > is not busy when there is no lock at all"

- feature: T12
  name: The download fixture's own assumption
  code: src/local-model-fetch.test.ts
  tier: free
  scenarios:
    - id: T12.1
      scenario: The tests above fake the system `tar` rather than running it
      expect: A real `tar --version` succeeds on this machine. Without this, every test above passes on a box where the real download could never unpack -- the fake would be asserting against itself
      layer: vault
      file: src/local-model-fetch.test.ts
      test: "the fixture's own assumption > is running somewhere a system tar exists"

- feature: E29
  name: Two model generations at once, and the older one keeps working
  code: src/local-model-artefacts.ts
  tier: free
  scenarios:
    - id: E29.1
      scenario: A plugin update ships a better model to an install that already downloaded the older one
      expect: The install keeps the model it has and goes on transcribing. This is the whole ticket -- the previous rule was "the plugin version is the model version", under which an update would have declared the working model absent and stopped reading pages until 6.2 GB finished downloading
      layer: unit
      file: src/local-model-download.test.ts
      test: "chooseGeneration > keeps the model an existing install already has, rather than declaring it out of date"

    - id: E29.2
      scenario: A fresh install with no model on disk
      expect: The newest generation, without asking the user to choose between two names they cannot judge
      layer: unit
      file: src/local-model-download.test.ts
      test: "chooseGeneration > gives a fresh install the newest model"

    - id: E29.3
      scenario: Both generations are complete on disk, because the user took the offer and kept the old one
      expect: The newest of them. Keeping the old files is the rollback path, not a preference
      layer: unit
      file: src/local-model-download.test.ts
      test: "chooseGeneration > prefers the newest of the models actually on disk"

    - id: E29.4
      scenario: A directory holds files of the wrong length -- a truncated or half-deleted model
      expect: Not chosen. A truncated file is not a model, and there is nothing to preserve
      layer: unit
      file: src/local-model-download.test.ts
      test: "chooseGeneration > ignores a directory whose files are the wrong length"

    - id: E29.5
      scenario: The newer model is half-downloaded while the older one is complete and in use
      expect: The older one stays in use. A download in flight must never displace a working model -- the card shows its progress from the download itself, not from the directory
      layer: unit
      file: src/local-model-download.test.ts
      test: "chooseGeneration > ignores a directory with no files in it at all"

    - id: E29.6
      scenario: A directory holds the right file sizes under the wrong name
      expect: Not a match. The directory name carries the version, which is what lets two generations sit side by side at all
      layer: unit
      file: src/local-model-download.test.ts
      test: "chooseGeneration > matches a generation only in its own directory"

    - id: E29.7
      scenario: Asking what to offer an install on each generation
      expect: The newest to an older install, nothing to one already on the newest
      layer: unit
      file: src/local-model-download.test.ts
      test: "chooseGeneration > offers the newest to an older install and nothing to the newest one"

    - id: E29.8
      scenario: Every pinned model URL across both generations
      expect: A 40-character commit revision, never a branch. Research 01 tripped a `latest` whose assets were still uploading
      layer: unit
      file: src/local-model-download.test.ts
      test: "the pinned table > resolves every model at a commit revision rather than a branch"

    - id: E29.9
      scenario: The size on the download button a fresh install presses
      expect: The newest generation's, derived rather than written out. A hard-coded string would have gone on quoting the previous model's 5.5 GB over a 6.2 GB job
      layer: unit
      file: src/local-model-download.test.ts
      test: "the pinned table > totals what the consent copy quotes, for the generation a fresh install gets"

    - id: E29.10
      scenario: The older generation's constants after the newer one is added
      expect: Byte-identical -- the same directory, sizes and hashes that verified every existing download. Changing any of them would mean an existing install failing its own size check and being told to start over
      layer: unit
      file: src/local-model-download.test.ts
      test: "the pinned table > keeps the older generation byte-identical to what every existing install verified"

    - id: E29.11
      scenario: The generation list itself
      expect: Newest first, one directory each, and the newest is the one that measured better. The order is the preference, and it is the only thing `chooseGeneration` reads
      layer: unit
      file: src/local-model-download.test.ts
      test: "the pinned table > orders the generations newest first, and every one names a directory of its own"

    - id: E29.12
      scenario: A ready model that is not the newest one available
      expect: The card offers the newer one with both error rates and the download size, keeps the "ready" heading, and starts nothing. A card that reached for the download itself would be the plugin spending two hours and 6.2 GB of someone's disk on an update they did not ask for
      layer: unit
      file: src/local-model-card.test.ts
      test: "the states that carry a decided sentence > offers a newer model beside a ready one, with both error rates and no push"

    - id: E29.13
      scenario: A ready model that is already the newest
      expect: No offer, no update button, and no sentence about error rates
      layer: unit
      file: src/local-model-card.test.ts
      test: "the states that carry a decided sentence > says nothing about a newer model when there is not one"

    - id: E29.14
      scenario: A 16 GB Mac, against each generation's floor
      expect: Offered the newer model and refused the older one. The 8B peaks at 8.3 GB and the 7B at 15.1 GB, so a single floor would either shut a 16 GB Mac out of a model it runs comfortably or let it start one that swaps. **This opens the backend to 16 GB Macs**, which the first model's own arithmetic excluded
      layer: unit
      file: src/local-model-gate.test.ts
      test: "the floor follows the generation > offers a 16 GB Mac the newer model, which the older model's floor shut out"

    - id: E29.15
      scenario: The gate called without naming a generation, as every existing caller did
      expect: The shipped 18 / 24 floors, unchanged. Nobody already running the first model is newly excluded by a second one being added
      layer: unit
      file: src/local-model-gate.test.ts
      test: "the floor follows the generation > keeps the shipped floors when no generation is named"

    - id: E29.16
      scenario: A generation whose memory floor was measured at a pinned context
      expect: It pins that context in the invocation too, and the floor still covers peak + 4 GiB. Without `-c` llama.cpp sizes the KV cache from the model's own declared context, and Qwen3-VL-8B declares one big enough to take the peak from 7.99 GB to **42.82 GB** -- for byte-identical output on all fifteen pages. A floor derived from the pinned figure beside an invocation that does not pin it would invite a 16 GB Mac to start a 42 GB job
      layer: unit
      file: src/local-model-download.test.ts
      test: "the context every generation runs at > pins one wherever the floor was measured with it pinned"

    - id: E29.17
      scenario: The generation every existing install is already running
      expect: Its invocation is untouched. Pinning a context would change what it is asked and with it the 4.32 % it measured, which is not a side effect a second model may have
      layer: unit
      file: src/local-model-download.test.ts
      test: "the context every generation runs at > leaves the older generation's invocation exactly as it shipped"

    - id: E29.18
      scenario: The argv built for a generation that names a context
      expect: The `-c` flag is passed with it. This is where the memory floor is actually honoured -- the floor is derived from the peak at that context, and an invocation that does not pin it would let the same model allocate 42.82 GB on a machine admitted at 16 GB
      layer: unit
      file: src/local-ocr-backend.test.ts
      test: "pageArgs > pins the context when the generation names one"

    - id: E29.19
      scenario: The argv built for the generation that shipped before contexts were pinned
      expect: No `-c` at all. Every install before 2026-09-09 ran without one and its published figure was measured that way; adding one would change what the model is asked
      layer: unit
      file: src/local-ocr-backend.test.ts
      test: "pageArgs > passes no context at all when the generation names none"

    - id: E29.20
      scenario: The rest of the invocation, whichever generation is running
      expect: One image per process, `--temp 0` and a fixed seed -- the sampling every local figure this repo publishes was measured at
      layer: unit
      file: src/local-ocr-backend.test.ts
      test: "pageArgs > sends one image per process, at temperature zero and a fixed seed"

    - id: E29.21
      scenario: A ready install that is not on the newest generation
      expect: An offer carrying both error rates and the real download size, the runtime archive included -- so the card can state a trade rather than assert an improvement. stating the trade beats asserting an improvement
      layer: unit
      file: src/local-model-card.test.ts
      test: "newerModelOffer > quotes both error rates and the real download size"

    - id: E29.22
      scenario: A ready install already on the newest generation
      expect: No offer at all
      layer: unit
      file: src/local-model-card.test.ts
      test: "newerModelOffer > offers nothing to an install already on the newest model"

    - id: E29.23
      scenario: The same offer made on macOS and on Windows
      expect: Different download sizes. Each platform fetches its own runtime archive, so a single figure would promise one of them a wait it does not have
      layer: unit
      file: src/local-model-card.test.ts
      test: "newerModelOffer > sizes the download per platform"

- feature: E31
  name: The model is chosen by what the machine can run, and by the user
  code: src/local-model-artefacts.ts
  tier: free
  scenarios:
    - id: E31.1
      scenario: A machine whose memory clears one generation's floor and not another's
      expect: Never a model it cannot run, whatever is on disk and whatever was asked for. "Newest wins" only looked right while both generations had the same floor -- the moment one is offered on a smaller machine, that rule hands it a model its own memory gate then refuses, and the install shows a card for a backend that cannot start
      layer: unit
      file: src/local-model-download.test.ts
      test: "chooseGeneration against the machine > never returns a model this machine cannot run"

    - id: E31.2
      scenario: The order the choice is made in
      expect: By accuracy, not by age or size. That is what the choice is about; memory and download size are its costs, and a cost belongs beside the thing it buys rather than in the ordering
      layer: unit
      file: src/local-model-download.test.ts
      test: "chooseGeneration against the machine > sorts by accuracy rather than by age or size"

    - id: E31.3
      scenario: A user who picked the smaller model on a machine that could run the larger
      expect: Their choice stands. They had a reason -- speed, memory pressure while other things run, disk -- and a plugin update must not quietly move them back
      layer: unit
      file: src/local-model-download.test.ts
      test: "chooseGeneration against the machine > honours a choice the user made"

    - id: E31.4
      scenario: A stored choice naming a model that is no longer installed
      expect: Ignored, and the rule decides again. The name outlives the file it points at, and a preference must never be able to stop transcription -- everything else in this subsystem is derived from disk on every load for exactly that reason
      layer: unit
      file: src/local-model-download.test.ts
      test: "chooseGeneration against the machine > ignores a choice whose model is not installed"

    - id: E31.12
      scenario: Nothing is on disk and the user has picked a model
      expect: The pick, so the first download fetches it. There is no working model to protect on a fresh install, and without this arm the pick was silently the most accurate model -- a reader who wanted the small one could only get it after downloading the large one first
      layer: unit
      file: src/local-model-download.test.ts
      test: "chooseGeneration against the machine > honours a choice on a fresh install, so the first download fetches the model the user picked"

    - id: E31.5
      scenario: A stored choice naming a model this machine no longer has the memory for
      expect: Ignored the same way. A machine can shrink -- a different Mac, a different vault -- and the choice is a preference rather than a fact
      layer: unit
      file: src/local-model-download.test.ts
      test: "chooseGeneration against the machine > ignores a choice this machine has outgrown"

    - id: E31.6
      scenario: What to offer beside the model in use
      expect: Only a model that is both more accurate and runnable here. On a machine too small for the best one there may still be a better one than the reader has; on one already running the best there is nothing to say, and offering a model its own gate would refuse is worse than offering nothing
      layer: unit
      file: src/local-model-download.test.ts
      test: "chooseGeneration against the machine > offers only a model that is both better and runnable"

    - id: E31.7
      scenario: The user picks a model, then picks the default entry again
      expect: The name is written, and then the key is removed rather than set to an empty string -- `data.json` keeps no key that means nothing
      layer: unit
      file: src/local-model-settings.test.ts
      test: "setPreferredModelDir > clears the choice rather than storing an empty one"

    - id: E31.8
      scenario: The user picks a model
      expect: Recorded in the backend's own settings blob, beside the background-sync consent, which is where a user preference already lives
      layer: unit
      file: src/local-model-settings.test.ts
      test: "setPreferredModelDir > records the model the user picked"

    - id: E31.9
      scenario: A machine with too little memory for any model at all
      expect: The least demanding one is still named. `localModelBlock` refuses the backend long before this arm is reached in the product, but a chooser that could return nothing would hand every caller an undefined generation to dereference
      layer: unit
      file: src/local-model-download.test.ts
      test: "chooseGeneration against the machine > still names a model on a machine that can run none of them"

    - id: E31.10
      scenario: The consent card, for whichever model this machine would actually fetch
      expect: Every figure is that model's own -- its name, its licence, its download size, the memory it holds while a page is read, and the memory it needs. Three generations ship and they differ by a factor of four in both, so a constant here would describe somebody else's Mac
      layer: unit
      file: src/local-model-card.test.ts
      test: "consent (§7.2) > states privacy, licence and this model's own memory"

    - id: E31.11
      scenario: A machine small enough that the smallest model is the one a fresh install gets
      expect: The card quotes that model throughout and never names a larger one. The download button used to promise 6.2 GB to a machine that fetches 1.6 GB
      layer: unit
      file: src/local-model-card.test.ts
      test: "consent (§7.2) > quotes the smallest model's own figures when that is the one this machine would fetch"

- feature: E35
  name: A stray part beside a verified model
  code: src/local-model-store.ts
  tier: free
  scenarios:
