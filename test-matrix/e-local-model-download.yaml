      scenario: The pair is verified and full-size, and a `.part` from an attempt that lost the race is still beside it
      expect: Ready, not partial. Nothing fetches a file that is already complete, so the part is a leftover -- and "partial" put a Resume button and a *Discard 6.5 GB* button under a model that had just been verified, the second of which would have deleted it
