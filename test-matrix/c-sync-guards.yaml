# Group C -- what has to be true before a long job starts. Also I7, whose promise ("a free user never
# phones home") is kept or broken on exactly this path.
#
# Both long jobs write the one sync index, so the interesting failure here is not a confusing screen:
# it is two writers interleaving rows while the loser's notes strand in the vault with nothing
# describing them. That is why the lock gets rows of its own rather than being folded into C1.
#
# The `vault` rows drive the shipped `syncNow()` and `reTranscribeAll()` with the engine replaced by a
# counter and a gate, which is the only way to hold a run open long enough to start a second one.

- feature: C1
  name: "Sync now"
  code: src/main.ts
  tier: free
  scenarios:
    - id: C1.1
      scenario: Sync now is pressed with no device token stored
      expect: A notice naming the missing connection, and no run -- the session cannot be opened without one
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a sync starts > refuses to sync without a device token, and says which thing is missing"

    - id: C1.2
      scenario: Sync now is pressed with nothing in the way
      expect: The run starts, and the lock is free again when it ends
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a sync starts > lets the sync through once nothing is in the way"

    - id: C1.3
      scenario: The pre-flight is asked with a token stored and no run in flight
      expect: It says start, and asks for no licence re-read it was not told to want
      layer: unit
      file: src/sync-guards.test.ts
      test: "preflightRun > lets a run start when nothing is in the way"

    - id: C1.4
      scenario: The pre-flight is asked with no device token
      expect: Refused, with the sentence that names the connection
      layer: unit
      file: src/sync-guards.test.ts
      test: "preflightRun > refuses a run with no device token, naming the connection"

- feature: C2
  name: One sync at a time
  code: src/sync-guards.ts
  tier: free
  scenarios:
    - id: C2.1
      scenario: A second Sync now is pressed while the first run is still going
      expect: Refused with a notice. Two runs would interleave rows in the one sync index
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a sync starts > refuses a second sync while one is running"

    - id: C2.2
      scenario: Re-transcribe is started while a sync is running
      expect: Refused the same way -- the lock is one lock, not one per command
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a sync starts > refuses a re-transcribe while a sync is running"

    - id: C2.3
      scenario: The connection is dropped in settings while a run is in flight, then Sync now is pressed
      expect: The connection is named, not the running job. "A sync is already running" would send the user looking for a run they cannot see
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a sync starts > checks the connection before the running job -- an unplugged user is told the more useful thing"

    - id: C2.4
      scenario: Two presses of Sync now land in the same tick
      expect: One run. The check and the claim have to be the same step -- an await between them lets both through
      layer: vault
      file: src/sync-preflight.test.ts
      test: "two runs at once > does not let two presses of Sync now become two runs"

    - id: C2.5
      scenario: The re-transcribe confirmation is left open, a sync is started, then the dialog is confirmed
      expect: Refused. Everything the pre-flight established went stale while the dialog sat there
      layer: vault
      file: src/sync-preflight.test.ts
      test: "two runs at once > re-checks the lock after the confirmation dialog, not only before it"

    - id: C2.6
      scenario: The pre-flight is asked while a run holds the lock
      expect: Refused, with the sentence naming the running job
      layer: unit
      file: src/sync-guards.test.ts
      test: "preflightRun > refuses a run while another one holds the lock"

    - id: C2.7
      scenario: The same conditions are judged twice
      expect: The same answer. The pre-flight keeps no state, so the lock it reads is never a lock it holds
      layer: unit
      file: src/sync-guards.test.ts
      test: "preflightRun > refuses on the state it was handed and nothing else"

    - id: C2.8
      scenario: Neither the connection nor the lock is available
      expect: The connection is the one named. The order is a decision, not the order the checks happen to be written in
      layer: unit
      file: src/sync-guards.test.ts
      test: "preflightRun > names the connection first when both are wrong"

- feature: C19
  name: Re-transcribe all synced notes
  code: src/sync-guards.ts
  tier: free
  scenarios:
    - id: C19.1
      scenario: Re-transcribe is started with no device token stored
      expect: The same notice a sync gives. Every long job needs the same connection
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a re-transcribe starts > refuses without a device token"

    - id: C19.2
      scenario: Re-transcribe is started before anything has ever been synced
      expect: A sentence saying so, instead of a confirmation dialog offering to spend money on nothing
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a re-transcribe starts > says there is nothing to re-transcribe when no note has been synced"

    - id: C19.3
      scenario: The sync index holds only orphaned rows -- every note behind them was deleted from the vault
      expect: Counted as nothing to do. Re-transcribing an orphaned row would write its deleted note straight back
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a re-transcribe starts > counts only the rows a note still stands behind"

    - id: C19.4
      scenario: Re-transcribe is started with synced notes present
      expect: Nothing runs until the dialog is answered -- the count alone never starts a job that re-sends every page
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a re-transcribe starts > starts nothing until the dialog is answered"

    - id: C19.5
      scenario: Active and orphaned rows sit side by side in the index
      expect: The count is the active ones. It is the same number the confirmation dialog quotes, so the two cannot disagree
      layer: unit
      file: src/sync-guards.test.ts
      test: "reTranscribableUnits > counts the rows a note still stands behind"

    - id: C19.6
      scenario: One notebook is split into three synced pages
      expect: Three, not one. The unit of a re-transcribe is the row, which is what the dialog has to quote
      layer: unit
      file: src/sync-guards.test.ts
      test: "reTranscribableUnits > counts rows, not documents -- a notebook split into pages is several"

    - id: C19.7
      scenario: A re-transcribe is asked about an empty sync index
      expect: Zero. Nothing has ever been synced, so there is nothing to re-run OCR over
      layer: unit
      file: src/sync-guards.test.ts
      test: "reTranscribableUnits > counts nothing before anything has been synced"

    - id: C19.8
      scenario: Every row in the index is orphaned
      expect: "Zero -- the same answer as an empty index, and for the same reason: no note is standing behind any of them"
      layer: unit
      file: src/sync-guards.test.ts
      test: "reTranscribableUnits > counts an index of nothing but orphaned rows as nothing to do"

- feature: I7
  name: A free user never phones home
  code: src/sync-guards.ts
  tier: free
  scenarios:
    - id: I7.1
      scenario: A sync is started on a backend only a licence unlocks
      expect: The licence is re-read first, and out loud -- the user is at the keyboard and a lapsed licence is worth a sentence
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a sync starts > re-reads the licence before a sync on a backend that needs one"

    - id: I7.2
      scenario: A sync is started on a backend that needs no licence
      expect: "No licence call at all. This is the whole promise: a free user's sync never talks to Polar"
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a sync starts > causes no licence call at all on a backend that needs none"

    - id: I7.3
      scenario: A re-transcribe is started on a gated backend
      expect: The same re-read. Re-transcribe spends more than a sync does, so it cannot be the cheaper path to a gated backend
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a sync starts > re-reads the licence before a re-transcribe too"

    - id: I7.4
      scenario: The pre-flight is asked about an ungated backend
      expect: It answers that no re-read is wanted. The decision is one predicate, not one per caller
      layer: unit
      file: src/sync-guards.test.ts
      test: "preflightRun > asks for no licence re-read on a backend that needs none"

    - id: I7.5
      scenario: A licence would come back lapsed on a gated backend
      expect: The pre-flight still starts the run. Refusing would strand a buyer mid-notebook; the fallback to a free backend, with a message, is what happens instead
      layer: unit
      file: src/sync-guards.test.ts
      test: "preflightRun > never turns a licence into a refusal"

    - id: I7.6
      scenario: The pre-flight is asked about a gated backend
      expect: It asks for the re-read. A licence that lapsed since the last run is worth knowing before a job that spends money
      layer: unit
      file: src/sync-guards.test.ts
      test: "preflightRun > asks for a licence re-read on a backend that needs one"

    - id: I7.7
      scenario: The pre-flight is asked about an ungated backend while an ended trial has not been announced
      expect: It asks for the re-read anyway. The one sentence about the ended trial rides on it, and before this it only ever rode on a cloud backend -- a trial that lapsed on Apple Vision ended in silence
      layer: unit
      file: src/sync-guards.test.ts
      test: "preflightRun > asks for the re-read that carries an ended licence's notice, whatever the backend"

    - id: I7.8
      scenario: A sync is started on `off` in a vault whose trial ran out weeks ago and was never announced
      expect: Exactly one loud re-read. It makes no call -- there is no key -- so the promise in I7.2 still holds; what it does is say the sentence
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a sync starts > re-reads once for a trial that ended unannounced, even on a backend that needs none"

    - id: I7.9
      scenario: The trial is a day from its end, and then at it
      expect: Nothing is owed a day before; the sentence is owed the moment the trial ends
      layer: unit
      file: src/licence-state.test.ts
      test: "endedUnannounced > is owed once the trial has run out, and only then"

    - id: I7.10
      scenario: A licence was revoked
      expect: The sentence is owed for a revocation too -- same notice, same one-time rule
      layer: unit
      file: src/licence-state.test.ts
      test: "endedUnannounced > is owed after a revocation too"

    - id: I7.11
      scenario: The ended trial's sentence has already been said
      expect: Nothing is owed. A reminder on every sync was rejected; the flag that settles it is the same one `checkLicence` sets
      layer: unit
      file: src/licence-state.test.ts
      test: "endedUnannounced > is settled once the sentence has been said"

    - id: I7.12
      scenario: A vault that never started a trial, and a vault with a live licence
      expect: Nothing is owed to either. The pre-flight's new predicate must not make a never-bought user's sync ask for a re-read
      layer: unit
      file: src/licence-state.test.ts
      test: "endedUnannounced > owes nothing to someone who never had Pro, or still has it"

    - id: I7.13
      scenario: The ended-trial notice is rendered, and the refund notice beside it
      expect: The trial's says the tag cap, the price and the way to Buy -- the user has just had all of Pro and is losing it. The refund's says none of that
      layer: unit
      file: src/licence-messages.test.ts
      test: "the messages that appear once > names the price and the way to it when a trial ends, and not after a refund"

- feature: C24
  name: A refusal names the source the vault actually syncs from
  code: src/sync-guards.ts
  tier: pro
  scenarios:
    - id: C24.1
      scenario: A vault whose source is the tablet, not yet paired, presses Sync now
      expect: 'The tablet''s own sentence. "Connect to reMarkable first." would send its owner hunting for a one-time code they will never need -- and the pre-flight is the only place that sentence is ever read'
      layer: unit
      file: src/sync-guards.test.ts
      test: "preflightRun > refuses in the words of whichever source the vault syncs from"


- feature: C25
  name: Deleting on the device stops the sync
  code: src/sync-engine.ts
  tier: free
  scenarios:
    - id: C25.1
      scenario: A page-tagged document sits in the device's trash -- deleted in the UI, tombstone not yet written
      expect: No note is written and no row is created. The trash move only re-parents; the page tags are still in the `.content`, and honouring them keeps re-creating notes the user just deleted
      layer: engine
      file: src/sync-engine.test.ts
      test: "runSync > documents in the trash > writes nothing for a page-tagged document sitting in the trash"

    - id: C25.2
      scenario: A synced document is moved to the trash after its note was hand-deleted from the vault
      expect: The row orphans and the note stays deleted -- self-heal must not resurrect a note whose document the user just threw away
      layer: engine
      file: src/sync-engine.test.ts
      test: "runSync > documents in the trash > orphans the rows of a document moved to the trash, instead of resurrecting its hand-deleted note"

    - id: C25.3
      scenario: A tagged document inside a folder that was trashed as a whole
      expect: Treated as deleted too -- trashing a folder re-parents only the folder, its children still point at it
      layer: engine
      file: src/sync-engine.test.ts
      test: "runSync > documents in the trash > treats a document inside a trashed folder as deleted too"

# C8 -- the level-2 gate, and the one wrong reading of it that cost a user 352 OCR calls per tag
# change (#101). A note outside the mapped folder used to mean "the mapping was re-targeted"; a
# note the user moved looks exactly the same from the path. The row now remembers the folder it
# was written under, and only *that* disagreeing with the settings is a re-target.

- feature: C8
  name: "Level-2 skip: document unchanged"
  code: src/sync-engine.ts
  tier: free
  scenarios:
    - id: C8.1
      scenario: The user moved two synced notes out of the mapped folder; then a third document gains the same tag on the device
      expect: One note written, no move, no re-transcription of the two -- their rows keep pointing at where the user put them. Before the fix all three were rewritten and the two were dragged back
      layer: engine
      file: src/sync-engine.test.ts
      test: "runSync > edge cases (ticket 11) > leaves a note the user moved where it is when another document gains the tag (#101)"

    - id: C8.2
      scenario: A document lost one of its tags weeks ago (an orphaned row), is unchanged since, and another document gains the tag
      expect: Not opened -- no content fetched, no note written. Before, any orphaned row reopened its document on every full scan; for a PDF-backed book that is a download, a render and a per-cluster transcription on a metered backend (the Demo vault's Alice, #101)
      layer: engine
      file: src/sync-engine.test.ts
      test: "runSync > edge cases (ticket 11) > does not reopen an unchanged document just because one of its tags was removed long ago (#101)"

    - id: C8.3
      scenario: A document carrying only a page tag is deleted on the device and restored with the hash it left with
      expect: Revived. This is what the blanket rule was there for, on the one shape the notebook-tag reconcile check cannot see; the vanish pass now clears the orphaned row's hash so the return fails the hash gate instead
      layer: engine
      file: src/sync-engine.test.ts
      test: "runSync > edge cases (ticket 11) > still revives a page-tagged document that comes back from the trash with the hash it left with"

    - id: C8.4
      scenario: The mapping's folder loses its trailing slash in settings -- "Tagged/" becomes "Tagged" -- and nothing else changes anywhere
      expect: Nothing is fetched, written or moved. The two spellings name one folder; the fingerprint change forces a full scan, but no row may come out of it re-targeted -- the row's `folder` is stored as the user typed the mapping while the load-time stamp's dirname branch never carries a slash, so the re-target compare trims both sides
      layer: engine
      file: src/sync-engine.test.ts
      test: "runSync > edge cases (ticket 11) > does not read a trailing slash dropped from the mapping as a re-target (#101)"

    - id: C8.5
      scenario: The user moved one of two synced notes out of the mapped folder; then the tag is re-targeted to another folder in settings, nothing else changes
      expect: Only the note still in the old folder moves to the new one. The moved note stays where the user put it and its row keeps pointing there -- a re-target says where the tag's notes go by default, not that a note the user sorted belongs there after all. Before, every note under the tag was moved, the sorted ones included (#101)
      layer: engine
      file: src/sync-engine.test.ts
      test: "runSync > edge cases (ticket 11) > leaves a note the user moved where it is when the mapping is re-targeted, and moves the one still in the old folder"

# C26 -- the one thing that reopens a document C8 would skip. A PDF whose margin notes the backend
# lost used to be stamped as done: the device copy is unchanged, so no gate reopened it, and
# Re-transcribe refuses a note with a digest -- the notes stayed unread for good. The index row now
# remembers the loss in `ocrRetry`, and the rows below say when that memory reopens the PDF and when
# it must not: a retry renders the PDF and sends every note again, so on a paid backend each wrong
# reopening is a bill.

- feature: C26
  name: Margin notes a digest lost are read again by a later sync
  code: src/sync-engine.ts
  tier: free
  scenarios:
    - id: C26.1
      scenario: A PDF's margin notes are lost because the server was not running, and auto-sync runs again half an hour later and then an hour later
      expect: Nothing is tried at the half hour; the PDF is read again after the hour, and once that read succeeds the retry is gone. Not on the very next sync -- a server that stays off for days would otherwise have every auto-sync render the PDF, ask the dead server once per note and rewrite the note
      layer: engine
      file: src/sync-engine.test.ts
      test: "a notebook with typed and handwritten pages (issue #115) > trying a digest's lost transcriptions again > tries again an hour after nothing answered, and stops once it has read"

    - id: C26.2
      scenario: The hourly retry fails as well, because the server is still down
      expect: The hour starts again from this failure. Kept at the first failure's time, a dead server would be asked on every sync from the second hour on
      layer: engine
      file: src/sync-engine.test.ts
      test: "a notebook with typed and handwritten pages (issue #115) > trying a digest's lost transcriptions again > moves the hour forward when the retry fails as well"

    - id: C26.3
      scenario: A first sync of a large library takes seventy minutes, and a PDF near its end loses its margin notes; auto-sync runs five minutes after it finished
      expect: The PDF is not tried yet. The hour counts from the moment the digest failed, not from the start of the sync, which would have made it due again at once
      layer: engine
      file: src/sync-engine.test.ts
      test: "a notebook with typed and handwritten pages (issue #115) > trying a digest's lost transcriptions again > starts the hour when the digest failed, not when the sync started"

    - id: C26.4
      scenario: The server was down, and within the hour the user picks a different backend or model
      expect: The PDF is read again on the next sync, without waiting for the hour. The hour is for a server that is down; a different model is the user doing something about it
      layer: engine
      file: src/sync-engine.test.ts
      test: "a notebook with typed and handwritten pages (issue #115) > trying a digest's lost transcriptions again > tries a different backend or model at once, within the hour"

    - id: C26.5
      scenario: The server was down, the user starts it and presses "Sync now" ten minutes later
      expect: The PDF is read again at once. The hour applies to auto-sync only -- someone pressing Sync now has most likely just started the server, and a sync that passed the PDF by would look as if it had not noticed
      layer: engine
      file: src/sync-engine.test.ts
      test: "a notebook with typed and handwritten pages (issue #115) > trying a digest's lost transcriptions again > tries again at once when the user syncs by hand"

    - id: C26.6
      scenario: The server answered and refused the notes, and the user presses "Sync now" with the same settings
      expect: The PDF is not read again. By hand or not, a refusal comes back the same from the same model
      layer: engine
      file: src/sync-engine.test.ts
      test: "a notebook with typed and handwritten pages (issue #115) > trying a digest's lost transcriptions again > does not try a refusal again by hand either"

    - id: C26.7
      scenario: The server answered but the notes failed anyway -- an answer cut off, or one note refused -- and later syncs run with the same settings, then with another model
      expect: Nothing is sent again under the same backend and model; the first sync after the model changes reads the PDF. Retried on every sync, a metered backend would bill every note of the PDF each time for the same answer
      layer: engine
      file: src/sync-engine.test.ts
      test: "a notebook with typed and handwritten pages (issue #115) > trying a digest's lost transcriptions again > waits for a different backend or model when the server did answer"

    - id: C26.8
      scenario: A PDF waits for a retry, and the user edits its note inside the managed region before the hour is up
      expect: The note is skipped as edited, and the retry is kept unchanged. The skip notice tells the user to undo the edit; had the skip dropped the retry, undoing it would bring the note back without the margin notes it was waiting to read
      layer: engine
      file: src/sync-engine.test.ts
      test: "a notebook with typed and handwritten pages (issue #115) > trying a digest's lost transcriptions again > keeps the retry of a note the user has edited, so undoing the edit brings it back"

    - id: C26.9
      scenario: A PDF waits for a retry, and the user switches the backend to Off
      expect: The PDF is not reopened and the retry is kept for the real backend. Off reads nothing, so a retry under it would rewrite the note for nothing and spend the retry the real backend still owes
      layer: engine
      file: src/sync-engine.test.ts
      test: "a notebook with typed and handwritten pages (issue #115) > trying a digest's lost transcriptions again > does not retry under a backend that reads nothing (off)"

    - id: C26.10
      scenario: A PDF waits for a retry, and the selected backend cannot run on this machine (Apple Vision off a Mac)
      expect: The same as under Off -- not reopened, and the retry kept for a backend that can read
      layer: engine
      file: src/sync-engine.test.ts
      test: "a notebook with typed and handwritten pages (issue #115) > trying a digest's lost transcriptions again > does not retry under a backend that reads nothing (unavailable)"

    - id: C26.11
      scenario: A PDF waits for a retry, the backend is Off, and the PDF changes on the tablet so the note is rewritten anyway
      expect: The note is rewritten, and the retry survives it. The rewrite under Off read none of the margin notes the real backend lost, so it must not clear their retry
      layer: engine
      file: src/sync-engine.test.ts
      test: "a notebook with typed and handwritten pages (issue #115) > trying a digest's lost transcriptions again > keeps the retry when a backend that reads nothing rewrites the note"

    - id: C26.12
      scenario: The user switches to another model to retry, and that backend turns out unable to run here
      expect: A new retry is written, naming the backend that came up empty. The old one named the previous backend, and kept would have reopened the PDF on every sync for the same answer
      layer: engine
      file: src/sync-engine.test.ts
      test: "a notebook with typed and handwritten pages (issue #115) > trying a digest's lost transcriptions again > writes a new retry when the retry finds the backend unavailable"

    - id: C26.13
      scenario: The hour is up, but this time the digest cannot even be built -- downloading the PDF fails
      expect: The note is still written from the transcript, and the retry is kept. The build read nothing, so dropping the retry would lose for good the margin notes the server still owes
      layer: engine
      file: src/sync-engine.test.ts
      test: "a notebook with typed and handwritten pages (issue #115) > trying a digest's lost transcriptions again > keeps the retry when the digest build throws"

    - id: C26.14
      scenario: A PDF was synced while the downloaded model was selected but not yet downloaded, and later the download finishes
      expect: Nothing happens while the model is still missing, hour or not; the first sync once it is ready reads the PDF's margin notes. The notice used to send the reader to Re-transcribe, which refuses a digest, and nothing else ever read them
      layer: engine
      file: src/sync-engine.test.ts
      test: "a notebook with typed and handwritten pages (issue #115) > trying a digest's lost transcriptions again > reads a digest again once the model that was not ready is"

    - id: C26.15
      scenario: Some margin notes failed and then the downloaded model's engine stopped, so the PDF's outcome reads "unavailable"
      expect: Tried again an hour later. A repaired engine keeps its fingerprint, so a retry that waited for a different model would never come -- the backend says it was not reached, and that is what the hour is for
      layer: engine
      file: src/sync-engine.test.ts
      test: "a notebook with typed and handwritten pages (issue #115) > trying a digest's lost transcriptions again > tries again an hour after the engine stopped"

    - id: C26.16
      scenario: Apple Vision is selected on a machine it cannot run on, and an hour passes
      expect: Not tried on the hour. Vision answers "unavailable" with its real fingerprint on every page, so an hourly retry would download, render and rewrite every PDF it saw for the same answer; a different backend still reads them
      layer: engine
      file: src/sync-engine.test.ts
      test: "a notebook with typed and handwritten pages (issue #115) > trying a digest's lost transcriptions again > does not try a backend that cannot run here again on the hour"

    - id: C26.17
      scenario: The backend failed a PDF's margin notes, once because nothing answered and once because it answered with an error
      expect: The digest says which -- retryable for the first, not for the second. It is what the sync decides a free retry on -- nothing answered, so the very same request may get through later
      layer: unit
      file: src/digest-pipeline.test.ts
      test: "buildDigest without a text layer > says whether nothing answered at all"

    - id: C26.18
      scenario: The server refused every margin note of a PDF and read none -- Ollama's "model not found", Anthropic's "credit balance too low"
      expect: The digest failed and is retryable like an unreachable server. Both go away under the same settings (`ollama pull`, a top-up), and with nothing read a retry pays for nothing twice
      layer: unit
      file: src/digest-pipeline.test.ts
      test: "buildDigest without a text layer > a refusal > is tried again when the server refused every note and read none"

    - id: C26.19
      scenario: One margin note of a PDF is refused and another is read
      expect: Not retryable. A content policy refuses that one note again, and every hour the whole PDF would be paid for anew
      layer: unit
      file: src/digest-pipeline.test.ts
      test: "buildDigest without a text layer > a refusal > is not tried again when another note was read"

    - id: C26.20
      scenario: One margin note is refused and another fails for a reason that is no refusal, such as an answer cut off
      expect: Not retryable. The same model cuts the same note off again
      layer: unit
