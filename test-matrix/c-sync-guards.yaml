# Group C -- what has to be true before a long job starts. Also I7, whose promise ("a free user never
# phones home") is kept or broken on exactly this path.
#
# Both long jobs write the one sync index, so the interesting failure here is not a confusing screen:
# it is two writers interleaving rows while the loser's notes strand in the vault with nothing
# describing them. That is why the lock gets rows of its own rather than being folded into C1.
#
# The `vault` rows drive the shipped `syncNow()` and `reTranscribeAll()` with the engine replaced by a
# counter and a gate, which is the only way to hold a run open long enough to start a second one.

- feature: C1
  name: "Sync now"
  code: src/main.ts
  tier: free
  scenarios:
    - id: C1.1
      scenario: Sync now is pressed with no device token stored
      expect: A notice naming the missing connection, and no run -- the session cannot be opened without one
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a sync starts > refuses to sync without a device token, and says which thing is missing"

    - id: C1.2
      scenario: Sync now is pressed with nothing in the way
      expect: The run starts, and the lock is free again when it ends
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a sync starts > lets the sync through once nothing is in the way"

- feature: C2
  name: One sync at a time
  code: src/main.ts
  tier: free
  scenarios:
    - id: C2.1
      scenario: A second Sync now is pressed while the first run is still going
      expect: Refused with a notice. Two runs would interleave rows in the one sync index
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a sync starts > refuses a second sync while one is running"

    - id: C2.2
      scenario: Re-transcribe is started while a sync is running
      expect: Refused the same way -- the lock is one lock, not one per command
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a sync starts > refuses a re-transcribe while a sync is running"

    - id: C2.3
      scenario: The connection is dropped in settings while a run is in flight, then Sync now is pressed
      expect: The connection is named, not the running job. "A sync is already running" would send the user looking for a run they cannot see
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a sync starts > checks the connection before the running job -- an unplugged user is told the more useful thing"

    - id: C2.4
      scenario: Two presses of Sync now land in the same tick
      expect: One run. The check and the claim have to be the same step -- an await between them lets both through
      layer: vault
      file: src/sync-preflight.test.ts
      test: "two runs at once > does not let two presses of Sync now become two runs"

    - id: C2.5
      scenario: The re-transcribe confirmation is left open, a sync is started, then the dialog is confirmed
      expect: Refused. Everything the pre-flight established went stale while the dialog sat there
      layer: vault
      file: src/sync-preflight.test.ts
      test: "two runs at once > re-checks the lock after the confirmation dialog, not only before it"

- feature: C19
  name: Re-transcribe all synced notes
  code: src/main.ts
  tier: free
  scenarios:
    - id: C19.1
      scenario: Re-transcribe is started with no device token stored
      expect: The same notice a sync gives. Every long job needs the same connection
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a re-transcribe starts > refuses without a device token"

    - id: C19.2
      scenario: Re-transcribe is started before anything has ever been synced
      expect: A sentence saying so, instead of a confirmation dialog offering to spend money on nothing
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a re-transcribe starts > says there is nothing to re-transcribe when no note has been synced"

    - id: C19.3
      scenario: The sync index holds only rows whose notes the last sync removed
      expect: Counted as nothing to do. Re-transcribing a removed row would put back a note that was deliberately taken away
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a re-transcribe starts > counts only the rows a note still stands behind"

    - id: C19.4
      scenario: Re-transcribe is started with synced notes present
      expect: Nothing runs until the dialog is answered -- the count alone never starts a job that re-sends every page
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a re-transcribe starts > starts nothing until the dialog is answered"

- feature: I7
  name: A free user never phones home
  code: src/main.ts
  tier: free
  scenarios:
    - id: I7.1
      scenario: A sync is started on a backend only a licence unlocks
      expect: The licence is re-read first, and out loud -- the user is at the keyboard and a lapsed licence is worth a sentence
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a sync starts > re-reads the licence before a sync on a backend that needs one"

    - id: I7.2
      scenario: A sync is started on a backend that needs no licence
      expect: "No licence call at all. This is the whole promise: a free user's sync never talks to Polar"
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a sync starts > causes no licence call at all on a backend that needs none"

    - id: I7.3
      scenario: A re-transcribe is started on a gated backend
      expect: The same re-read. Re-transcribe spends more than a sync does, so it cannot be the cheaper path to a gated backend
      layer: vault
      file: src/sync-preflight.test.ts
      test: "what has to be true before a sync starts > re-reads the licence before a re-transcribe too"
