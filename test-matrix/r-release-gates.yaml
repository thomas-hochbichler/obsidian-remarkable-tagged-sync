- feature: R3
  name: The render cluster stays linear
  code: test-support/perf/complexity-ratio.test.ts
  tier: free
  scenarios:
    - id: R3.1
      scenario: renderPagesToPdf at 500 and at 2000 strokes in one process
      expect: The ratio stays under 6x -- linear code measured 3.5-4.2x over ten rounds, and the subtlest injected O(n^2) measured 6.6x, so the limit sits between what is and what must not be
      layer: unit
      file: test-support/perf/complexity-ratio.test.ts
      test: "complexity ratio > renderPagesToPdf stays linear: 4x the strokes may not cost more than 6x the time"

    - id: R3.2
      scenario: rasterizePage at 500 and at 2000 strokes in one process
      expect: The ratio stays under 6x, on every PR on any runner, because the ratio is a property of the code and needs no reference number
      layer: unit
      file: test-support/perf/complexity-ratio.test.ts
      test: "complexity ratio > rasterizePage stays linear: 4x the strokes may not cost more than 6x the time"
