      expect: Wi-Fi SSH is turned on and the address is read back off the device, so nobody has to go and find their tablet's IP
      layer: unit
      file: src/ssh-pairing.test.ts
      test: "pairing, end to end > opens it, and takes the address back off the device, when they did"

