# Recording one unit (spec §3, §4.2): what Readwise should hold, merged into the document's book with
# no network. One row per state row of spec §8. The load-bearing rows are W8.6-W8.9 (what a unit
# covers -- too much deletes highlights of pages it never looked at, too little never cleans up a
# deleted page), W8.13-W8.16 (an unread transcription must not delete or blank what Readwise holds)
# and W8.17-W8.19 (margin notes off must not delete every standalone note). All are silent when wrong.
- feature: W8
  name: Recording a unit for Readwise
  code: src/readwise-state.ts
  tier: pro
  scenarios:
    - id: W8.1
      scenario: A document recorded for the first time
      expect: A book under the identity's title and author, every read entry a pending `want`
      layer: unit
      file: src/readwise-state.test.ts
      test: "recordUnit > gives a new document its book, named once, with every mark waiting to be pushed"

    - id: W8.2
      scenario: A pushed mark changed on the tablet
      expect: '`want` = the new text in the same record; `pushed` and `id` kept'
      layer: unit
      file: src/readwise-state.test.ts
      test: "recordUnit > wants the new text of a mark changed on the tablet, in the same record"

    - id: W8.3
      scenario: Nothing changed
      expect: Nothing pending
      layer: unit
      file: src/readwise-state.test.ts
      test: "recordUnit > wants nothing for a mark that is what Readwise holds"

    - id: W8.4
      scenario: Same text, but the page number or the note changed
      expect: A change -- the whole `ReadwiseText` is compared
      layer: unit
      file: src/readwise-state.test.ts
      test: "recordUnit > counts a moved page or an added note as a change, the whole text compared"

    - id: W8.5
      scenario: A pushed mark erased on the tablet
      expect: '`want: null` (delete), also when the user edited it in Readwise'
      layer: unit
      file: src/readwise-state.test.ts
      test: "recordUnit > wants a mark erased on the tablet deleted, also one edited in Readwise"

    - id: W8.6
      scenario: A mark erased before its first push landed
      expect: The record is dropped; nothing reaches Readwise
