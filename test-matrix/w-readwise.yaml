      file: src/readwise-state.test.ts
      test: "recordUnit > drops a mark erased before its first push landed: nothing reaches Readwise"

    - id: W8.7
      scenario: A page-tag unit with no marks, beside a record of another page
      expect: Only its own page's record is deleted
