- feature: E27
  name: A request that is never answered ends the page, not the run
  code: src/llm-transcript.ts
  tier: free
  scenarios:
    - id: E27.1
      scenario: The server accepts a page and then answers nothing at all -- measured on a scrolled page rasterizing 325 x 7082 px, where LM Studio was still `GENERATING` after forty minutes
      expect: The page fails after ten minutes and the run carries on, naming the server and what a tall page costs. Nothing bounded this wait, so the sync stayed open with no message and disabling the plugin was the only way out -- and "Is it running?" is the wrong question for a server that is running
      layer: unit
      file: src/openai-compat-ocr-backend.test.ts
      test: "OpenAiCompatOcrBackend > fails a page the server never answers for, instead of waiting on it forever"

    - id: E27.2
      scenario: The same silence from Anthropic, which shares the request path
      expect: The page fails after the same ten minutes and says so without asking whether the machine is online. The two adapters' warning chains must not drift, and an endpoint that answers nothing is reachable
      layer: unit
      tier: pro
      file: pro/anthropic-ocr-backend.test.ts
      test: "AnthropicOcrBackend > fails a page Anthropic never answers for, instead of waiting on it forever"

    - id: E27.3
      scenario: An OpenAI-compatible server never answers for a margin note
      expect: After ten minutes the note fails with only the advice that applies to it -- a later sync will not pick it up on its own, try a different model, then the next sync reads it again. Not Re-transcribe, which refuses a PDF note with a digest, and not the tall-page hint, since a note is never a tall page
      layer: unit
      file: src/openai-compat-ocr-backend.test.ts
      test: "OpenAiCompatOcrBackend > gives a margin note that timed out only the advice that applies to it"

    - id: E27.4
      scenario: An OpenAI-compatible server never answers for a page added to a PDF on the tablet
      expect: '"Pages added on the tablet were left out", with the tall-page hint -- it is a whole page and can be the tall kind -- ending in "the next sync reads them again" rather than Re-transcribe'
      layer: unit
      file: src/openai-compat-ocr-backend.test.ts
      test: "OpenAiCompatOcrBackend > sends a page added to a PDF that timed out to the sync, not to Re-transcribe"

    - id: E27.5
      scenario: Anthropic never answers for a margin note
      tier: pro
      expect: '"Margin notes were left out because Anthropic did not answer in 10 minutes", then: try a different model, then the next sync reads them again. The sync does not retry a timeout with the same model, so the note''s lever is a different one'
      layer: unit
      file: pro/anthropic-ocr-backend.test.ts
      test: "AnthropicOcrBackend > tells a margin note that timed out what does read it again"

    - id: E27.6
      scenario: Anthropic never answers for a page added to a PDF on the tablet
      tier: pro
      expect: The same advice as for a margin note, with a page's wording -- "Pages added on the tablet were left out". It belongs to the digest, which Re-transcribe refuses
      layer: unit
      file: pro/anthropic-ocr-backend.test.ts
      test: "AnthropicOcrBackend > tells a page added to a PDF that timed out what does read it again"

- feature: E28
  name: The rate-limit backoff runs where the code actually runs
  code: src/llm-transcript.ts
  tier: free
  scenarios:
    - id: E28.1
      scenario: A provider answers 429 and the caller injected no `sleepFn` -- the nightly, and anything else driving this adapter from Node
      expect: The page waits out the backoff and is asked again. `realSleep` reached for `window.setTimeout`, which exists in Obsidian and not on Node, so the first 429 threw `ReferenceError` inside the retry and the page was lost and then reported as a provider outage. Every other retry test injects a sleep, which is exactly why nothing caught it -- this one must not
      layer: unit
      file: src/openai-compat-ocr-backend.test.ts
      test: "OpenAiCompatOcrBackend > waits out a rate limit with its own default sleep, off Obsidian"

- feature: E26
  name: Deterministic sampling on the servers the user runs
  code: src/openai-compat-ocr-backend.ts
  tier: free
  scenarios:
    - id: E26.1
      scenario: "A page goes to Ollama, LM Studio, or a custom OpenAI-compatible server"
      expect: "The request carries `temperature: 0`, so the same page reads the same way twice. It is also the sampling the plugin's own measured 7.6 % CER was taken at, and what the built-in local model has run since it shipped"
      layer: unit
      file: src/openai-compat-ocr-backend.test.ts
      test: "deterministic sampling > pins the temperature for a server the user runs"

    - id: E26.2
      scenario: "A page goes to a cloud provider through the same adapter"
      expect: "The body stays exactly `{model, messages}`. Nine current Claude models answer a non-default temperature with a 400 on every request, thinking or not, and OpenAI's reasoning models carry the same restriction -- so a blanket pin would lose whole syncs to fix a cosmetic difference"
      layer: unit
      file: src/openai-compat-ocr-backend.test.ts
      test: "deterministic sampling > sends no temperature at all to a cloud provider"

    - id: E26.3
      scenario: "The provider table is read to decide who gets the field"
      tier: pro
      expect: "Exactly the three servers the user runs. Declared per provider rather than checked at the call site, because one adapter serves both halves of the table and a wrong entry here costs a whole sync rather than a hint"
      layer: unit
      file: pro/ocr-providers.test.ts
      test: "PROVIDERS metadata > pins the temperature only on the servers the user runs"

    - id: E26.4
      scenario: "An adapter is told to cap the answer"
      expect: "The request carries that `max_tokens`, reasoning included; the cloud body (E26.2) still carries none"
      layer: unit
      file: src/openai-compat-ocr-backend.test.ts
      test: "deterministic sampling > caps the answer, reasoning included, when told to, as for a server the user runs (research 30)"

    - id: E26.5
      scenario: "Ollama, LM Studio or a custom server transcribes, with a model that may reason without end"
      expect: "Every page is capped at 16 384 tokens: 2.6x the most reasoning a healthy reference page needed (research 30), so a runaway stops in 2-5 minutes instead of the 10-minute request limit, fails the page, and the next sync retries it"
      layer: unit
      file: src/localhost-register.test.ts
      test: "create() > caps every page's answer on these servers, so a model that reasons without end stops in minutes, not at the ten-minute limit"

- feature: E40
