# The Intelligence Engine (1.9.0): one Obsidian note per handwritten page, built from the user's
# template, with tasks and other Slots extracted by an LLM and merged item by item with what the
# user edited in Obsidian.

- feature: V1
  name: Only new pages are processed
  code: src/intelligence/seen-set.ts
  tier: free
  scenarios:
    - id: V1.1
      scenario: A page carries `modifed` as the device writes it, as a string
      expect: It is read as epoch ms
      layer: unit
      file: src/intelligence/seen-set.test.ts
      test: "pageModified > reads the epoch-ms string the device stamps on an edited page"

    - id: V1.2
      scenario: A page was never edited since the device started stamping
      expect: No stamp, so null -- which the two questions read as old
      layer: unit
      file: src/intelligence/seen-set.test.ts
      test: "pageModified > is null for a page never edited since the device started stamping it"

    - id: V1.3
      scenario: The stamp is garbled or empty
      expect: Null, never NaN -- NaN compares false both ways and would decide new/old by accident
      layer: unit
      file: src/intelligence/seen-set.test.ts
      test: "pageModified > is null for a value that is not a number, rather than NaN"

    - id: V1.4
      scenario: A page already in the seen-set is synced again
      expect: Changed only when its `.rm` hash differs
      layer: unit
      file: src/intelligence/seen-set.test.ts
      test: "classifyUnit > calls a seen page changed only when its hash differs"

    - id: V1.5
      scenario: A page seen before it had any ink gets its first stroke
      expect: A change -- the null hash differs from the first real one
      layer: unit
      file: src/intelligence/seen-set.test.ts
      test: "classifyUnit > counts the first ink on a page that had no .rm when seen as a change"

    - id: V1.6
      scenario: A page not in the seen-set carries a stamp
      expect: New only when edited strictly after Intelligence Mode was switched on
      layer: unit
      file: src/intelligence/seen-set.test.ts
      test: "classifyUnit > calls an unseen page new only when it was edited after Intelligence Mode was switched on"

    - id: V1.7
      scenario: An old notebook without stamps is tagged today
      expect: Its pages are old -- no extraction, no spend
      layer: unit
      file: src/intelligence/seen-set.test.ts
      test: "classifyUnit > calls an unseen page without a modified stamp old, so a notebook from 2025 tagged today costs nothing"

    - id: V1.8
      scenario: A legacy `pages[]` document is tagged
      expect: Every page is old
      layer: unit
      file: src/intelligence/seen-set.test.ts
      test: "classifyUnit > calls every page of a legacy pages[] document old, whatever the clock says"

    - id: V1.9
      scenario: The switch-on scan meets a page written between the click and the sync
      expect: It is not stamped as seen; the two questions process it in the same run
      layer: unit
      file: src/intelligence/seen-set.test.ts
      test: "switchOnStamp > stamps pages written before the toggle or never stamped, and leaves a page written after it to the two questions"

- feature: V2
  name: Item formats write and read one item per line
  code: src/intelligence/item-format.ts
  tier: free
  scenarios:
    - id: V2.1
      scenario: "An item is written through a Tasks and a Dataview format"
      expect: "The fields land where the format puts them"
      layer: unit
      file: src/intelligence/item-format.test.ts
      test: "compileItemFormat > render > writes an item through the format"

    - id: V2.2
      scenario: "A field is empty"
      expect: "Its label goes too -- a stray 📅 or `[due:: ]` would make a query read a date that is not there"
      layer: unit
      file: src/intelligence/item-format.test.ts
      test: "compileItemFormat > render > drops a field together with the words that label it when the field is empty"

    - id: V2.3
      scenario: "A ticked line with a Tasks done date is rewritten"
      expect: "The tick and `✅ date` survive"
      layer: unit
      file: src/intelligence/item-format.test.ts
      test: "compileItemFormat > render > writes the checkbox state it is given and keeps the trailing fields of the line it replaces"

    - id: V2.4
      scenario: "A List format has no checkbox"
      expect: "No `[x]` is invented"
      layer: unit
      file: src/intelligence/item-format.test.ts
      test: "compileItemFormat > render > ignores a checkbox state for a format without a checkbox"

    - id: V2.5
      scenario: "Two placeholders share one word and only one has a value"
      expect: "The other is written empty, not as `undefined`"
      layer: unit
      file: src/intelligence/item-format.test.ts
      test: "compileItemFormat > render > leaves a second field in the same word empty when only the first has a value"

    - id: V2.6
      scenario: "A format ends in a literal like `#task`"
      expect: "The literal is always written"
      layer: unit
      file: src/intelligence/item-format.test.ts
      test: "compileItemFormat > render > keeps literal words after the last placeholder"

    - id: V2.7
      scenario: "A line the engine wrote is read back"
      expect: "Same text and fields -- the merge compares against them"
      layer: unit
      file: src/intelligence/item-format.test.ts
      test: "compileItemFormat > parse > reads text and fields back from a line it wrote"

    - id: V2.8
      scenario: "The user deleted the due date"
      expect: "The line still parses, with no field"
      layer: unit
      file: src/intelligence/item-format.test.ts
      test: "compileItemFormat > parse > reads a line whose optional field the user removed"

    - id: V2.9
      scenario: "A line carries `[x]` or a custom status like `[/]`"
      expect: "It parses, and the character is kept"
      layer: unit
      file: src/intelligence/item-format.test.ts
      test: "compileItemFormat > parse > treats the checkbox character as a wildcard"

    - id: V2.10
      scenario: "Tasks appended priority, recurrence and a done date"
      expect: "They are split off as a tail, never read as item text"
      layer: unit
      file: src/intelligence/item-format.test.ts
      test: "compileItemFormat > parse > tolerates the trailing fields the Tasks plugin appends"

    - id: V2.11
      scenario: "A line is indented or has doubled spaces"
      expect: "It still parses"
      layer: unit
      file: src/intelligence/item-format.test.ts
      test: "compileItemFormat > parse > tolerates indentation and extra spaces"

    - id: V2.12
      scenario: "A region holds prose, a callout, a heading or an empty checkbox"
      expect: "Not an item -- the parser skips it"
      layer: unit
      file: src/intelligence/item-format.test.ts
      test: "compileItemFormat > parse > returns null for a line that is not an item: prose, callouts, headings, blank lines"

    - id: V2.13
      scenario: "A format contains `$`, `(` or `)`"
      expect: "They match literally"
      layer: unit
      file: src/intelligence/item-format.test.ts
      test: "compileItemFormat > parse > reads a line with a format's regex characters literally"

    - id: V2.14
      scenario: "The Profile editor asks which Fields a format places"
      expect: "Only the fields, never `text`"
      layer: unit
      file: src/intelligence/item-format.test.ts
      test: "compileItemFormat > parse > names the fields a format places"

    - id: V2.15
      scenario: "A format lacks `{{text}}`"
      expect: "Compiling it throws, naming the missing placeholder"
      layer: unit
      file: src/intelligence/item-format.test.ts
      test: "compileItemFormat > rejects > a format without {{text}}"

- feature: V3
  name: Note lines are matched to base items without visible ids
  code: src/intelligence/matcher.ts
  tier: free
  scenarios:
    - id: V3.1
      scenario: "A line differs from its item only in case, punctuation or spacing"
      expect: "Same normalised text"
      layer: unit
      file: src/intelligence/matcher.test.ts
      test: "normaliseText > ignores case, punctuation and spacing"

    - id: V3.2
      scenario: "A German line has umlauts"
      expect: "They are letters, not punctuation"
      layer: unit
      file: src/intelligence/matcher.test.ts
      test: "normaliseText > keeps letters with accents and umlauts"

    - id: V3.3
      scenario: "Two texts share all or none of their words"
      expect: "1 or 0"
      layer: unit
      file: src/intelligence/matcher.test.ts
      test: "similarity > is 1 for the same words in another order and 0 for no shared word"

    - id: V3.4
      scenario: "Both texts are empty"
      expect: "0 -- NaN would slip past every threshold comparison"
      layer: unit
      file: src/intelligence/matcher.test.ts
      test: "similarity > is 0 for two empty texts rather than NaN"

    - id: V3.5
      scenario: "Lines were reordered, a dot added"
      expect: "Each finds its item by exact normalised text"
      layer: unit
      file: src/intelligence/matcher.test.ts
      test: "matchItems > matches lines whose text is unchanged up to case and punctuation"

    - id: V3.6
      scenario: "The user added two words to a task"
      expect: "Still the same item (similarity >= 0.6)"
      layer: unit
      file: src/intelligence/matcher.test.ts
      test: "matchItems > matches a lightly edited line to its item"

    - id: V3.7
      scenario: "The user rewrote a task entirely"
      expect: "A user line plus a tombstone -- nothing lost, nothing duplicated"
      layer: unit
      file: src/intelligence/matcher.test.ts
      test: "matchItems > reads a heavy rewrite as a user-added line and a deleted item"

    - id: V3.8
      scenario: "The user duplicated a line"
      expect: "Only one line is the item; the copy is user-added"
      layer: unit
      file: src/intelligence/matcher.test.ts
      test: "matchItems > matches one to one, so two lines never claim the same item"

    - id: V3.9
      scenario: "Two lines resemble one item"
      expect: "The closer line wins"
      layer: unit
      file: src/intelligence/matcher.test.ts
      test: "matchItems > gives an item to the most similar line first"

    - id: V3.10
      scenario: "Two lines match two items equally"
      expect: "Position decides"
      layer: unit
      file: src/intelligence/matcher.test.ts
      test: "matchItems > breaks a tie by position"

    - id: V3.11
      scenario: "An exact match sits further away than a fuzzy one"
      expect: "Exact wins"
      layer: unit
      file: src/intelligence/matcher.test.ts
      test: "matchItems > prefers an exact match over a closer position"

- feature: V4
  name: Item-level three-way merge never overwrites what the user edited
  code: src/intelligence/merge.ts
  tier: free
  scenarios:
    - id: V4.1
      scenario: "A stored source span is looked up in a re-read transcript"
      expect: "Found despite spacing and case"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "inTranscript > finds a span despite OCR spacing and case drift"

    - id: V4.2
      scenario: "A span is missing or only punctuation"
      expect: "Never counts as on the page"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "inTranscript > never finds an empty or missing span"

    - id: V4.3
      scenario: "A Slot is extracted for the first time"
      expect: "Items are written directly; one with an invented or missing source is dropped"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > first extraction > writes every item directly and drops one whose source is not on the page"

    - id: V4.4
      scenario: "The model rewords an item and changes a field, same ink"
      expect: "Nothing changes -- rewording is model noise"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > the page did not change behind an item > ignores a reworded item and a changed field while the ink is the same"

    - id: V4.5
      scenario: "The model forgets an item whose words are still on the page"
      expect: "The item stays"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > the page did not change behind an item > ignores an item the model forgot while its ink is still on the page"

    - id: V4.6
      scenario: "The ink behind a task changed its due date, review on"
      expect: "A change proposal"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > the ink behind an item changed > proposes the new field with review on"

    - id: V4.7
      scenario: "Same, review off"
      expect: "The line is updated"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > the ink behind an item changed > applies it with review off"

    - id: V4.8
      scenario: "Same, but the user edited that line"
      expect: "A proposal, whatever the toggle"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > the ink behind an item changed > proposes it even with review off when the user edited that line"

    - id: V4.9
      scenario: "The ink moved but the answer is the same, with null Fields from the strict schema"
      expect: "Only the stored span moves; no proposal"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > the ink behind an item changed > only moves the source when the model's answer is otherwise the same, an empty field included"

    - id: V4.10
      scenario: "The page shows a task ticked"
      expect: "The note line is ticked directly"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > ticks > ticks the note from the page directly, even with review on"

    - id: V4.11
      scenario: "The user unticked in Obsidian what the page ticked"
      expect: "It stays unticked"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > ticks > does not tick again a line the user unticked after the page ticked it"

    - id: V4.12
      scenario: "Page and note are both ticked"
      expect: "No write"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > ticks > records the tick without a write when the note is already ticked"

    - id: V4.13
      scenario: "The model ticks a known item but omits its source"
      expect: "The tick applies; the stored span stays"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > ticks > takes a tick for a known item even when the model gave no source span"

    - id: V4.14
      scenario: "The page shows no tick, the note does"
      expect: "The note stays ticked"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > ticks > never unticks from the page"

    - id: V4.15
      scenario: "A task's words are gone from the page, review on"
      expect: "A remove proposal"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > items whose ink is gone > proposes the removal with review on"

    - id: V4.16
      scenario: "Same, review off"
      expect: "The line is removed"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > items whose ink is gone > removes the line with review off"

    - id: V4.17
      scenario: "The line is ticked"
      expect: "Proposal, even with review off"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > items whose ink is gone > never removes a ticked line without review"

    - id: V4.18
      scenario: "The user edited the line"
      expect: "Proposal, even with review off"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > items whose ink is gone > never removes a line the user edited without review"

    - id: V4.19
      scenario: "The user added a due date to the line"
      expect: "Counts as an edit: proposal"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > items whose ink is gone > counts a field the user added as an edit"

    - id: V4.20
      scenario: "A line the user typed gained a source span, then its ink went"
      expect: "Proposal, even with review off"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > items whose ink is gone > never removes a user-typed item without review once it gained a source"

    - id: V4.21
      scenario: "The user types a task in Obsidian"
      expect: "It is kept across syncs and never removed"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > the user's own lines > keeps a typed line as a user item that is never a drop candidate"

    - id: V4.22
      scenario: "The model finds a task the user already typed"
      expect: "No proposal; the line gains the source"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > the user's own lines > does not propose an item the user already typed"

    - id: V4.23
      scenario: "A pending add proposal is typed by the user"
      expect: "The proposal disappears"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > the user's own lines > drops a pending proposal the user has since typed themselves"

    - id: V4.24
      scenario: "The user deleted a line; the model keeps finding it"
      expect: "Tombstone; it never comes back"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > the user's own lines > turns a deleted line into a tombstone and never brings the item back"

    - id: V4.25
      scenario: "A tombstone without a source meets the same text"
      expect: "Suppressed by text"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > the user's own lines > does not bring back a deleted item the model returns under new words and no known source"

    - id: V4.26
      scenario: "The model finds a new task"
      expect: "Proposal with review on, inserted with review off"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > new items > proposes a new item with review on and inserts it with review off"

    - id: V4.27
      scenario: "The same new task on two syncs"
      expect: "One proposal"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > new items > keeps one pending proposal across syncs instead of piling up copies"

    - id: V4.28
      scenario: "The model loses a known item's id"
      expect: "Folded onto the item, not proposed twice"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > new items > folds an item the model calls new onto the live item it really is"

    - id: V4.29
      scenario: "A new item has no source"
      expect: "Ignored"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > new items > ignores a new item without a source span"

    - id: V4.30
      scenario: "The model returns a tombstoned id"
      expect: "Ignored"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeList > new items > ignores an id the user deleted"

    - id: V4.31
      scenario: "A pending change gets newer content"
      expect: "One proposal, newest content, stable id"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeProposals > replaces the content of a pending proposal with the same key and keeps its id"

    - id: V4.32
      scenario: "First summary"
      expect: "Written"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeText > writes the first summary"

    - id: V4.33
      scenario: "The user never edited the summary"
      expect: "Replaced; stale proposal dropped"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeText > replaces an untouched summary and drops a stale replace proposal"

    - id: V4.34
      scenario: "The new summary reads the same"
      expect: "No write"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeText > writes nothing when the untouched summary already reads the same"

    - id: V4.35
      scenario: "The user edited the summary"
      expect: "Kept; one Replace proposal, updated not duplicated"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeText > keeps an edited summary and proposes the new one once"

    - id: V4.36
      scenario: "The model repeats the base"
      expect: "No proposal"
      layer: unit
      file: src/intelligence/merge.test.ts
      test: "mergeText > proposes nothing when the model says what the base already said"

- feature: V5
