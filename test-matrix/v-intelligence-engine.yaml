  code: src/intelligence/dates.ts
  tier: free
  scenarios:
    - id: V6.1
      scenario: "A task names an absolute date in any common form"
      expect: "The ISO date"
      layer: unit
      file: src/intelligence/dates.test.ts
      test: "resolveDue > absolute dates > reads ISO, German day-month with and without year, and month names in both languages"

    - id: V6.2
      scenario: "A December page says `bis 15.1.`"
      expect: "January next year; a date just past stays this year (overdue)"
