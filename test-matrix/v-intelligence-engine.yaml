      test: "headings > ignores a heading inside fenced code"

    - id: V5.2
      scenario: "A Slot heading has a sub-heading below it"
      expect: "The sub-heading is inside the region"
      layer: unit
      file: src/intelligence/regions.test.ts
      test: "findRegion > runs from the heading to the next heading of the same or a higher level"

    - id: V5.3
      scenario: "The user renamed the Tasks heading"
      expect: "The region is found by its items"
