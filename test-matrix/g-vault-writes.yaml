# Group G -- what happens where a computed path meets the real vault.
#
# This is gap G01, the highest-ranked gap on the list, and the reason it ranked there is that it is
# the only one where what gets destroyed is content the *user* wrote. Everything a sync writes is
# regenerable; a clobbered open note is not.
#
# Until these rows existed, every test that wrote a note wrote it into an in-memory store that could
# not fail. The collision suite in note-builder.test.ts proves the naming logic and says nothing
# about the write.
#
# Four rows below pin a throw the plugin does NOT survive today. They are characterisations, not
# promises: they say what happens, so the repair has a test to turn green. Each says so in its own
# words rather than being marked as a gap, because a gap is something nobody has looked at.

- feature: G9
  name: Safe writes to open notes
  code: src/vault-stores.ts
  tier: free
  scenarios:
    - id: G9.1
      scenario: A sync writes a note at a path that holds nothing yet
      expect: The note is created with exactly the content it was given
      layer: unit
      file: src/vault-stores.test.ts
      test: "the note store's write > creates the note when nothing is at the path"

    - id: G9.2
      scenario: A sync rewrites a note the user has open in an editor
      expect: 'It goes through vault.process(), never through a fresh create. This is the single most user-visible data-loss surface in the plugin, and the in-memory fake store had no concept of an open file'
      layer: unit
      file: src/vault-stores.test.ts
      test: "the note store's write > rewrites an existing note through process(), never through a fresh create"

    - id: G9.3
      scenario: The path handed to the store is not in normal form
      expect: It is normalized once, so the note the store looks for and the note it writes are the same one -- the asymmetry that used to write a note and then never find it again
      layer: unit
      file: src/vault-stores.test.ts
      test: "the note store's write > normalizes once, so the note it looks for and the note it writes are the same one"

    - id: G9.4
      scenario: The vault already holds Work/My Notebook.md and the sync decides Work/my notebook.md is free
      expect: "The store throws \"File already exists.\" -- correctly, it is Obsidian's own rule. What changed is that the plugin no longer walks into it: resolveFreePath asks exists(), which asks the same filesystem create asks. See G9.10"
      layer: unit
      file: src/vault-stores.test.ts
      test: "the note store's write > throws Obsidian's own sentence on a path the plugin has just decided was free"

    - id: G9.5
      scenario: A folder sits at the path the note was going to take
      expect: "The store throws, because the lookup that chooses between rewrite and create asks for a file and a folder reads as nothing-there. The plugin no longer asks it to -- see G9.11"
      layer: unit
      file: src/vault-stores.test.ts
      test: "the note store's write > throws when a folder sits where the note should go"

    - id: G9.6
      scenario: A path reaches the store carrying a character the platform forbids
      expect: 'Today it throws, and nothing lands. The sanitizer runs when a name is built; a path arriving by another route -- a stored one, a folder the user typed into tag routing -- is refused here instead. Pinned, not promised'
      layer: unit
      file: src/vault-stores.test.ts
      test: "the note store's write > throws when the path carries a character the platform forbids"

    - id: G9.7
      scenario: The sync asks whether a path is already taken
      expect: Null rather than a throw when nothing is there, and the note's text when there is
      layer: unit
      file: src/vault-stores.test.ts
      test: "the note store's read > returns null rather than throwing when nothing is at the path"

    - id: G9.8
      scenario: The path holds a note
      expect: Its text comes back, which is what the edit check and the transcript reuse both read
      layer: unit
      file: src/vault-stores.test.ts
      test: "the note store's read > returns the note's text when it is there"

    - id: G9.9
      scenario: A folder, not a note, sits at the path being checked
      expect: Null, so the caller treats it as free -- which is exactly how the write above ends up running into it
      layer: unit
      file: src/vault-stores.test.ts
      test: "the note store's read > returns null when a folder, not a note, sits at the path"

    - id: G9.10
      scenario: A new note is written into a vault that already holds the same name differing only in case
      expect: "The suffixed name is taken and the user's own note is untouched. Before this, the plugin proved the path free against the file index and then threw on it -- once, and on every sync of that notebook afterwards"
      layer: unit
      file: src/vault-stores.test.ts
      test: "choosing a path for a new note, against a vault that folds case > suffixes rather than throwing when the only note in the way differs in case"

    - id: G9.11
      scenario: A folder happens to sit exactly where the new note would go
      expect: The suffixed name is taken rather than the write failing
      layer: unit
      file: src/vault-stores.test.ts
      test: "choosing a path for a new note, against a vault that folds case > suffixes rather than throwing when a folder sits where the note would go"

    - id: G9.12
      scenario: Every suffix in the escalation is taken too, some of them only case-insensitively
      expect: It keeps escalating to the numeric tail rather than stopping at the first one the index cannot see
      layer: unit
      file: src/vault-stores.test.ts
      test: "choosing a path for a new note, against a vault that folds case > keeps escalating through the suffixes when each one is taken too"

    - id: G9.13
      scenario: The same vault on Linux, where a differently-cased name is genuinely a different file
      expect: The plain name is still taken. The fix must not cost a Linux user a suffix they never needed -- and this is the assertion that says the change is platform-shaped rather than blanket
      layer: unit
      file: src/vault-stores.test.ts
      test: "choosing a path for a new note, against a vault that folds case > still takes the plain name on Linux, where nothing folds and nothing is in the way"

# Only the orphan half of G3 is claimed here. The rest of the edited-block suite predates the matrix
# and is still on the shrink-only allowlist; these four rows are new tests, so they need rows.
- feature: G3
  name: Edited notes are never overwritten
  code: src/sync-engine.ts
  tier: free
  scenarios:
    - id: G3.1
      scenario: The document was untagged, the user then corrected the note by hand, and the document comes back
      expect: "The note is left alone and counted as skipped. Orphaning is index-only -- the note stays an ordinary file the whole time, so the user editing it is the same act it always was"
      layer: engine
      file: src/sync-engine.test.ts
      test: "edited sync blocks > does not overwrite a note the user changed while its row was orphaned"

    - id: G3.2
      scenario: An orphaned row's own note was deleted, another synced note was renamed onto that path, and the document comes back
      expect: "Nothing is written. The revived row would otherwise overwrite a note belonging to a different row -- a note the user loses with nothing on screen"
      layer: engine
      file: src/sync-engine.test.ts
      test: "edited sync blocks > does not overwrite a different synced note that now sits at an orphaned row's path"

    - id: G3.3
      scenario: A document comes back and its note was left untouched
      expect: "It is rewritten and the row goes active again. The protection must not cost the ordinary revival"
      layer: engine
      file: src/sync-engine.test.ts
      test: "edited sync blocks > still revives an orphaned row whose note is untouched"

    - id: G3.4
      scenario: A document comes back and the user had deleted its note
      expect: "It is written again. Nothing on disk is nothing to protect, and refusing here would strand a note no sync could repair"
      layer: engine
      file: src/sync-engine.test.ts
      test: "edited sync blocks > still re-creates an orphaned row's note when the user deleted it"

- feature: G10
  name: Moves preserve backlinks
  code: src/vault-stores.ts
  tier: free
  scenarios:
    - id: G10.1
      scenario: A tag's folder mapping is re-targeted and a synced note has to move
      expect: 'The move goes through fileManager.renameFile, not vault.rename -- the difference *is* the backlinks: every link elsewhere in the vault follows the note'
      layer: unit
      file: src/vault-stores.test.ts
      test: "the note store's move > renames through the file manager, which is what keeps the vault's backlinks pointing at it"

    - id: G10.2
      scenario: The index names a note the user has already deleted
      expect: Nothing happens and nothing throws, so one stale index row does not fail the whole sync
      layer: unit
      file: src/vault-stores.test.ts
      test: "the note store's move > does nothing when the note it was asked to move is not there"

    - id: G10.3
      scenario: Either end of the move is not in normal form
      expect: Both are normalized, so a path stored before the repair still resolves and the destination is not written under a second name
      layer: unit
      file: src/vault-stores.test.ts
      test: "the note store's move > normalizes both ends, so a stored source path resolves and the destination is not written twice"

- feature: G15
  name: Target folders are created
  code: src/vault-stores.ts
  tier: free
  scenarios:
    - id: G15.1
      scenario: A tag is mapped to a folder that does not exist yet
      expect: The folder is created rather than the write failing
      layer: unit
      file: src/vault-stores.test.ts
      test: "ensureFolder > creates a folder that is not there yet"

    - id: G15.2
      scenario: The same sync runs a second time
      expect: Nothing happens. The in-memory fake store's ensureFolder could never fail, so this had never been asserted against something that can
      layer: unit
      file: src/vault-stores.test.ts
      test: "ensureFolder > does nothing when the folder is already there, so a second sync is not an error"

    - id: G15.3
      scenario: The mapped folder is stored with stray or leading slashes
      expect: One folder, not two -- the check and the create normalize the same way
      layer: unit
      file: src/vault-stores.test.ts
      test: "ensureFolder > normalizes before it looks and before it creates, so one folder is not created twice"

    - id: G15.4
      scenario: The vault already holds work/ and a tag routes to Work/
      expect: "Throws \"Folder already exists.\" on the first sync after the mapping, and deliberately still does. Swallowing it would write the note into the differently-cased folder the filesystem resolves to, leave data.json holding a path the index can never find, and duplicate the note on the next sync -- silent damage in place of a loud failure. The real repair resolves the mapped folder to the vault's actual casing where the path is built; see ticket 18"
      layer: unit
      file: src/vault-stores.test.ts
      test: "ensureFolder > throws where the vault already holds the same folder under a different case"

    - id: G15.5
      scenario: The same vault on Linux
      expect: No throw. The disagreement is a property of the filesystem, so this failure is invisible on the one platform CI runs on -- which is why it needs a test that says which platform it is on
      layer: unit
      file: src/vault-stores.test.ts
      test: "ensureFolder > does not throw for that same pair on Linux, where the filesystem does not fold case"

    - id: G15.6
      scenario: The note store is asked to make sure a note's target folder exists
      expect: It is created in the vault that store was built on. Asserted through the store, not only on the function, because what a delegation gets wrong is which vault it was handed
      layer: unit
      file: src/vault-stores.test.ts
      test: "each store's own ensureFolder > creates the note's target folder in the vault the note store was built on"

    - id: G15.7
      scenario: The attachment store is asked the same about the attachments folder
      expect: The same, through the other store -- the two are built from different arguments and only a test through each can tell them apart
      layer: unit
      file: src/vault-stores.test.ts
      test: "each store's own ensureFolder > creates the attachments folder in the vault the attachment store was built on"
