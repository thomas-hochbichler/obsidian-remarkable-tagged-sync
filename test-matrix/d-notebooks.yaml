# Group D -- Note content: handwritten notebooks.
#
# One file per feature group. A feature is a container; the rows underneath it are its scenarios.
# Exactly one of `test:`, `gap:` or `waived:` per scenario. See README.md for the field contract.

- feature: D16
  name: Deterministic attachment paths
  code: src/attachment-writer.ts
  tier: free
  scenarios:
    - id: D16.1
      scenario: A notebook-level page is rendered and its PDF written
      expect: The path is <folder>/<docId>.pdf -- identity, never the title, so renaming the notebook does not strand the old file
      layer: unit
      file: src/attachment-writer.test.ts
      test: "attachmentPath > names a notebook-level attachment by docId only"

    - id: D16.2
      scenario: A page-level unit (a page tag) is rendered
      expect: The path carries both ids, <folder>/<docId>-<pageId>.pdf, so a page note and its notebook note never share a file
      layer: unit
      file: src/attachment-writer.test.ts
      test: "attachmentPath > names a page-level attachment by docId and pageId"

    - id: D16.3
      scenario: The same unit is synced a second time
      expect: The bytes are written unconditionally to the same path, with no existence check -- re-syncing overwrites in place and never accumulates copies
      layer: unit
      file: src/attachment-writer.test.ts
      test: "writeAttachment > overwrites in place -- writes unconditionally, with no existence check"

    - id: D16.4
      scenario: The vault rejects the write (read-only folder, disk full, illegal path)
      expect: writeBinary rejecting surfaces as a skipped document with the reason, not as a half-written note claiming an attachment that is not there
      layer: vault
      gap: G35

    - id: D16.5
      scenario: The renderer hands back zero bytes
      expect: An empty pdfBytes is refused before it reaches the vault, so no note embeds a 0-byte PDF
      layer: vault
      gap: G35

    - id: D16.6
      scenario: The rendered PDF is written for the first time
      expect: It is created at the path the arithmetic above produced
      layer: unit
      file: src/vault-stores.test.ts
      test: "the attachment store > creates the PDF when nothing is at the path"

    - id: D16.7
      scenario: The same unit is synced again and its PDF is already there
      expect: The bytes are replaced in place rather than the write being refused -- an attachment, unlike a note, is the sync's to overwrite
      layer: unit
      file: src/vault-stores.test.ts
      test: "the attachment store > overwrites the PDF that is already there rather than refusing it"

    - id: D16.8
      scenario: The attachments folder is stored with stray slashes
      expect: 'Normalized once, so the lookup that chooses between overwrite and create sees the same path the write uses -- otherwise every sync creates the attachment again under a second name'
      layer: unit
      file: src/vault-stores.test.ts
      test: "the attachment store > normalizes, so the lookup that chooses between overwrite and create sees the written path"

    - id: D16.9
      scenario: The user typed an attachments folder containing a character the platform forbids
      expect: 'Today the write throws. The attachment filename is built from ids and cannot be illegal; its folder is whatever the user typed. Pinned so the repair has a test to turn green'
      layer: unit
      file: src/vault-stores.test.ts
      test: "the attachment store > throws when the attachments folder the user typed carries a forbidden character"

    - id: D16.10
      scenario: An attachment of the same name differing only in case is already in the vault
      expect: 'Today the write throws, for the same reason a note does: the lookup asks the index and the create asks the filesystem'
      layer: unit
      file: src/vault-stores.test.ts
      test: "the attachment store > throws where an attachment of the same name differs only in case"

- feature: D17
  name: A notebook title becomes a filename Obsidian will not rewrite
  code: src/note-builder.ts
  tier: free
  scenarios:
    - id: D17.1
      scenario: A title contains a character no filesystem accepts
      expect: Each becomes a dash, so the note is written rather than the sync failing on it
      layer: unit
      file: src/note-builder.test.ts
      test: "sanitizeFilenamePart > replaces filesystem-illegal characters"

    - id: D17.2
      scenario: A title longer than any filesystem accepts
      expect: Cut to exactly the cap, with room left for a page suffix and the extension
      layer: unit
      file: src/note-builder.test.ts
      test: "sanitizeFilenamePart > trims very long names to the cap, rather than to merely something shorter"

    - id: D17.3
      scenario: An ordinary title
      expect: Untouched. The rules below must not cost a normal notebook its name
      layer: unit
      file: src/note-builder.test.ts
      test: "sanitizeFilenamePart > leaves ordinary names untouched"

    - id: D17.4
      scenario: A title carries a non-breaking or narrow no-break space, as EPUB metadata routinely does
      expect: It becomes an ordinary space. Obsidian's create() rewrites it and getFileByPath() does not, so leaving it means a note written once and never found again
      layer: unit
      file: src/note-builder.test.ts
      test: "sanitizeFilenamePart > writes a non-breaking space as an ordinary one, so the note can be found again after it is written"

    - id: D17.5
      scenario: A title arrives decomposed -- "u" plus a combining diaeresis rather than "ü"
      expect: Composed to NFC, which is the form Obsidian would have written anyway
      layer: unit
      file: src/note-builder.test.ts
      test: "sanitizeFilenamePart > settles a decomposed umlaut into the composed form Obsidian would have written anyway"

    - id: D17.6
      scenario: A title ends in a dot, as "To do..." does
      expect: The dot is dropped. Windows refuses such a name outright and trim() does not remove it
      layer: unit
      file: src/note-builder.test.ts
      test: "sanitizeFilenamePart > drops a trailing dot, which Windows refuses outright and trim() does not remove"

    - id: D17.7
      scenario: A title that is nothing but dots
      expect: Falls back to a dash rather than leaving an empty name, or one starting with a dot, which is hidden
      layer: unit
      file: src/note-builder.test.ts
      test: "sanitizeFilenamePart > keeps a title that is nothing but dots from becoming an empty or hidden filename"

    - id: D17.8
      scenario: A notebook called CON, NUL or COM3
      expect: Renamed on every platform, not only on Windows -- a vault synced between a Mac and a PC has to produce the same filename on both, or it grows one note per machine
      layer: unit
      file: src/note-builder.test.ts
      test: "sanitizeFilenamePart > renames a notebook Windows reserves, on every platform, so one vault does not grow one note per machine"

    - id: D17.9
      scenario: An index row written before this repair still holds a path Obsidian rewrote
      expect: The note resolves again, because every path crossing into the vault is normalized at the store boundary -- so the repair needs no migration
      layer: unit
      file: src/vault-stores.test.ts
      test: "the note store's read > normalizes the path it is given, so a stored path with an odd space still finds its note"
