      expect: "The sentence and its number, without a vault. Five nouns that inflect differently -- note/notes, note was/notes were, notebook was/notebooks were, book has/books have"
      layer: unit
      file: src/sync-notices.test.ts
      test: "partialOutcomeNotices > says each outcome in its own words, singular and plural"

    - id: H7.24
      scenario: The transcription backend warned -- a page cut off, a server that did not answer -- while the unit still wrote
      expect: The backend's own sentence is raised as a notice, one per distinct warning, with time to be read. It used to go into diagnostics and nowhere else, so a notebook that lost three pages of five reported a clean sync
      layer: unit
      file: src/sync-notices.test.ts
      test: "partialOutcomeNotices > raises each backend warning as the backend wrote it"

    - id: H7.18
      scenario: A run where nothing was skipped
      expect: "An empty list, so the caller has nothing to raise rather than a list of empty strings"
      layer: unit
      file: src/sync-notices.test.ts
      test: "partialOutcomeNotices > says nothing when nothing was skipped"

    - id: H7.19
      scenario: Every outcome at once
      expect: "Five notices in the fixed order, each with a timeout long enough to be read -- Obsidian's default is five seconds and these ask the user to go and do something"
      layer: unit
      file: src/sync-notices.test.ts
      test: "partialOutcomeNotices > keeps its order and gives each notice time to be read"

    - id: H7.20
      scenario: A run's own outcome notice, in each shape and for each of manual and background
      expect: "Stopped with and without notes written, notes written, nothing written -- and silence for the last of those in the background"
      layer: unit
      file: src/sync-notices.test.ts
      test: "outcomeNotice > says what the run did, and stays quiet only where a background run must"

    - id: H7.21
      scenario: Each of the five sentences, read for what it asks of the user
      expect: "Each names either the thing that is still fine or where to look. The difference between a report and a notification"
      layer: unit
      file: src/sync-notices.test.ts
      test: "partialOutcomeNotices > tells the user what to do about each one, not only that it happened"

    - id: H7.22
      scenario: One of the five happened and the others did not
      expect: One notice, not five
      layer: unit
      file: src/sync-notices.test.ts
      test: "partialOutcomeNotices > leaves out the ones that did not happen"

    - id: H7.23
      scenario: A background run wrote notes
      expect: "Announced. That is the good news auto-sync exists for, and the one thing worth interrupting for"
      layer: unit
      file: src/sync-notices.test.ts
      test: "outcomeNotice > still announces notes a background run wrote"

- feature: H6
  name: Last error kept for diagnostics
  code: src/main.ts
  tier: free
  scenarios:
    - id: H6.1
      scenario: A run succeeded overall but skipped documents along the way
      expect: 'The skips are on the plugin, so "Copy diagnostics" does not report "Last error: none" about a run that quietly did not finish its work'
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what a sync records for the diagnostics block > keeps the skip errors, so Last error does not read none after a run that skipped things"

    - id: H6.2
      scenario: A clean run follows one that had skips
      expect: "The old error is cleared, so diagnostics describes the latest sync rather than the worst one"
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what a sync records for the diagnostics block > clears a stale error after a clean run, so diagnostics describes the latest sync"

    - id: H7.25
      scenario: The Zotero half of a run could not write something back
      expect: Its sentence goes up as the pass wrote it, beside the backend's warnings and for the same reason -- the sync succeeded, and this half is invisible from anywhere else (spec §3.4.2)
      layer: unit
      file: src/sync-notices.test.ts
      test: "partialOutcomeNotices > raises what the Zotero half could not do, as the pass worded it"

    - id: H7.26
      scenario: The server under a PDF's margin notes is not running, and the digest comes back failed with the backend's sentence
      expect: The sentence is raised once, as a notebook's backend warning is, and diagnostics carry it prefixed with the document and tag ("Digest of ... for tag ..."), which the backend's sentence cannot name. A dead server under margin notes is as fixable as one under a notebook
      layer: engine
      file: src/sync-engine.test.ts
      test: "a notebook with typed and handwritten pages (issue #115) > raises the digest's backend warnings as a notebook's are raised, once"

    - id: H7.27
      scenario: The digest loses a page added to the PDF on the tablet, not a margin note
      expect: Diagnostics carry the backend's sentence about pages added on the tablet, and nothing in them says "margin note". The digest reads added pages too, as whole pages, and their warning is no margin note's
      layer: engine
      file: src/sync-engine.test.ts
      test: "a notebook with typed and handwritten pages (issue #115) > does not call a lost added page a margin note"

    - id: H7.28
      scenario: Every margin note of a PDF fails against the same dead server
      expect: The digest keeps the backend's reason, once however many notes it cost, apart from its own warnings, and reports the digest failed. Before, only the status was kept, so every entry said "could not be transcribed" and nothing said why
      layer: unit
      file: src/digest-pipeline.test.ts
      test: "buildDigest without a text layer > says once why the backend could not read, however many notes it cost"

    - id: H7.29
      scenario: A sync ends with five different backend warnings
      expect: The first three are raised as notices, and a fourth says how many more there are and that Copy diagnostics in settings shows them all. Each is a 15-second notice, background syncs included, so an unbounded list would bury the screen
      layer: unit
      file: src/sync-notices.test.ts
      test: "partialOutcomeNotices > raises the first three backend warnings and says how many more there are"

    - id: H7.30
      scenario: A warning channel collects sentences, some of them repeated -- every margin note of a document hitting the same dead server
      expect: Each distinct sentence is kept once, in the order first seen. The rule was written out six times across the warning channels before it became one helper
      layer: unit
      file: src/push-unique.test.ts
      test: "pushUnique > appends in order and skips what is already there"

    - id: H7.31
      scenario: A warning channel with a limit is offered more distinct sentences than it may hold
      expect: It stops at the limit, counting only distinct sentences. Only one of the six hand-written copies had a limit
      layer: unit
      file: src/push-unique.test.ts
      test: "pushUnique > stops at the limit"

- feature: E15
  name: One-time platform-gap notice
  code: src/sync-notices.ts
  tier: free
  scenarios:
    - id: E15.1
      scenario: The first sync that produces a note this platform cannot transcribe
      expect: "The limit is stated once. It promises nothing: pointing at an API key setting this build does not have is worse than silence"
      layer: vault
      file: src/status-and-notices.test.ts
      test: "the one-time notice about what this platform cannot transcribe > explains the gap the first time a sync produces a note it could not transcribe"

    - id: E15.2
      scenario: Every note in the run was transcribable
      expect: Silence
      layer: vault
      file: src/status-and-notices.test.ts
      test: "the one-time notice about what this platform cannot transcribe > stays silent when every note was transcribable"

    - id: E15.3
      scenario: A second sync in the same session hits the same gap
      expect: Silent. The promise is "once"
      layer: vault
      file: src/status-and-notices.test.ts
      test: "the one-time notice about what this platform cannot transcribe > says it once and never again"

    - id: E15.4
      scenario: Obsidian is restarted and a sync hits the gap again
      expect: "Still silent -- the flag is written to data.json. Kept in memory it would say it again every morning"
      layer: vault
      file: src/status-and-notices.test.ts
      test: "the one-time notice about what this platform cannot transcribe > is still silent after a restart, because the flag is written to data.json"

    - id: E15.5
      scenario: The notices that ask the user to go and do something
      expect: "Long enough to be read. Obsidian's default notice is gone in five seconds"
      layer: vault
      file: src/status-and-notices.test.ts
      test: "the one-time notice about what this platform cannot transcribe > gives the partial-outcome notices room to be read"

    - id: E15.6
      scenario: The gap is hit in a build that has other backends to offer, and in one that does not
      expect: "The clause appears only where there is something to point at. Naming a setting this build does not have is the failure the sentence exists to avoid"
      layer: unit
      file: src/sync-notices.test.ts
      test: "platformGapNotice > offers another backend only where this build has one"

    - id: E15.7
      scenario: The notice is asked for a second time, having already been shown
      expect: "Null, which is how the caller learns not to raise it. The decision is here; persisting the flag is the caller's"
      layer: unit
      file: src/sync-notices.test.ts
      test: "platformGapNotice > answers null once it has been shown, and when there was nothing to report"

    - id: E15.9
      scenario: The sync ran with the downloaded model selected and not on disk
      expect: Its own sentence -- how many notes synced with the render only, download it in settings, re-transcribe the notes synced meanwhile -- never the platform one. "Needs macOS 13 or later" reached a reader whose Mac was fine, once, and then never again while the gap was still open
      layer: unit
      file: src/sync-notices.test.ts
      test: "modelNotReadyNotice > names the model and the way back, and never the platform"

    - id: E15.10
      scenario: Every unit was transcribed
      expect: Nothing to say
      layer: unit
      file: src/sync-notices.test.ts
      test: "modelNotReadyNotice > says nothing when every unit was transcribed"

    - id: E15.11
      scenario: Exactly one note synced with the render only
      expect: "\"1 note\", in the singular. It is the commonest case of all -- a reader picks the model, syncs once to see what happens, and \"1 notes\" is the first thing they read"
      layer: unit
      file: src/sync-notices.test.ts
      test: "modelNotReadyNotice > counts a single note in the singular"

    - id: E15.12
      scenario: The sync ran with the downloaded model selected and not on disk, and runs again
      expect: The model's own sentence both times, and never the platform one. Unlike the platform gap this closes the moment the download does, so it is said on every sync the user is watching until then -- and the once-only flag is not spent on a sentence this reader never saw
      layer: vault
      file: src/status-and-notices.test.ts
      test: "the one-time notice about what this platform cannot transcribe > says the model is not ready instead of the platform sentence, and says it every time"

    - id: E15.13
      scenario: The downloaded model is selected and every note was transcribed anyway
      expect: Nothing said. Its own sentence is still a report about units that went untranscribed, and there were none
      layer: vault
      file: src/status-and-notices.test.ts
      test: "the one-time notice about what this platform cannot transcribe > stays quiet about the model when every note was transcribed"

    - id: E15.14
      scenario: A backend that transcribes nothing because it can never run here, rather than because a download is pending
      expect: The platform sentence, once, with the flag written. The two cases share a class and differ in what the user can do about them, and the entry is what declares which is which
      layer: vault
      file: src/status-and-notices.test.ts
      test: "the one-time notice about what this platform cannot transcribe > keeps the platform sentence for a backend that is not merely waiting on a download"

    - id: E15.8
      scenario: The sentence is read for what it commits the plugin to
      expect: "Nothing. A promise of a future fix would be a debt, and the platform gap is not this plugin's to close"
      layer: unit
      file: src/sync-notices.test.ts
      test: "platformGapNotice > promises nothing about a fix"

    - id: E15.15
      scenario: Two notes were synced while the downloaded model was selected and not yet on disk
      expect: The sentence sends only the notebooks synced meanwhile to Re-transcribe all synced notes, and says the annotated PDFs are read again by the next sync on their own. Re-transcribe refuses a PDF's digest, so a reader sent there would wait for margin notes the command never reads
      layer: unit
      file: src/sync-notices.test.ts
      test: "modelNotReadyNotice > sends only the notebooks to re-transcribe, and says the PDFs need nothing"

- feature: H9
  name: Local vault refusals named as local
  code: src/explain-error.ts
  tier: free
  scenarios:
    - id: H9.1
      scenario: A sync fails on Obsidian's own "already exists" refusal
      expect: The message says the conflict is local and points at the folder settings -- not at a reMarkable service change the user cannot fix (issue #73)
      layer: unit
      file: src/explain-error.test.ts
      test: "explainError > names a vault name conflict as local, not as a cloud problem"

    - id: H9.2
      scenario: A configured folder carries a character the platform forbids
      expect: The same local message -- the refusal is Obsidian's, whatever its exact sentence
      layer: unit
      file: src/explain-error.test.ts
      test: "explainError > treats a forbidden character in a configured folder the same way"

- feature: H10
  name: A tablet in a drawer reads as a tablet in a drawer
  code: src/status-model.ts
  tier: pro
  scenarios:
    - id: H10.1
      scenario: A background sync is skipped because the paired device did not answer
      expect: 'Its own icon, spinning nothing and offering nothing. The alternatives both lie: a check claims a sync that happened and a cross claims one that broke, and a cross painted every night for a tablet that was simply asleep is how a status bar stops being read at all'
      layer: unit
      file: src/status-model.test.ts
      test: "statusView > gives each state its own icon, and spins only while busy"

- feature: H11
  name: What a run counts and says once, whichever kind of unit it was
  code: src/sync-engine.ts
  tier: free
  scenarios:
    - id: H11.1
      scenario: A tagged **page** whose transcript the backend could not produce
      expect: Counted as unavailable, exactly as a tagged notebook is, and the note is still written. The end-of-sync notice counts units, so a vault that tags pages rather than notebooks was told nothing at all
      layer: engine
      file: src/sync-engine.test.ts
      test: "failed transcription > counts a tagged page whose transcript the backend could not produce"

    - id: H11.2
      scenario: The backend warns while transcribing a tagged page
      expect: The warning reaches the run's report. A page the backend lost while the rest read fine writes its note and counts as ok, so the warning is the only trace the loss leaves anywhere -- and that trace existed only on the notebook path
      layer: engine
      file: src/sync-engine.test.ts
      test: "failed transcription > raises what the backend warned about while transcribing a tagged page"

    - id: H11.3
      scenario: Two units the backend gave the identical warning about
      expect: One sentence in `backendWarnings`, two entries in `skipErrors`. Each warning is raised as its own `Notice`, so the identical message would stack twice on screen -- while diagnostics is where the question is which unit lost what
      layer: engine
      file: src/sync-engine.test.ts
      test: "failed transcription > says a warning the backend repeated across units only once"

# H1, the diagnostics block's side. Built for a report that had none of it: every margin note read
# "could not be transcribed", under `Last error: none` -- true, since an empty answer is no error --
# while the block named neither the model nor how many notes came back empty. Either would have
# pointed at the cause on the first message.

- feature: H1
  name: Copy diagnostics -- what the last transcription did
  code: src/ocr-tally.ts
  tier: free
  scenarios:
    - id: H1.2
      scenario: A run reads three pages and two margin notes, and each comes back read, empty or failed
      expect: Pages and margin notes are counted apart, each by what came back, and the tally names the model that ran
      layer: unit
      file: src/ocr-tally.test.ts
      test: "tallyOcr > counts pages and margin notes apart, by what came back"

    - id: H1.3
      scenario: The backend cannot run here and never looks at the images
      expect: Every image it was handed counts as not run, and no model is named
      layer: unit
      file: src/ocr-tally.test.ts
      test: "tallyOcr > counts a backend that never looked as not run, every image of it"

    - id: H1.4
      scenario: A backend answers for the whole call without a per-page list
      expect: Its status speaks for every image it was handed -- two pages read, one note empty
      layer: unit
      file: src/ocr-tally.test.ts
      test: "tallyOcr > counts an answer without a page list by its status, every image of it"

    - id: H1.5
      scenario: The counting stand-in wraps the downloaded model while it is not ready
      expect: It still answers `instanceof` and every field as the adapter does. The not-ready notice and the re-transcribe gate ask exactly that, and a plain wrapper would answer them wrong
      layer: unit
      file: src/ocr-tally.test.ts
      test: "tallyOcr > hands back a stand-in that answers instanceof and every field as the adapter does"

    - id: H1.6
      scenario: Two syncs in one session count through the same backend object (Apple Vision's adapter lives for the whole session)
      expect: The adapter itself is left untouched and each run counts only its own images. Replacing `recognize` in place wrapped it once more on every sync, and every older tally went on counting
      layer: unit
      file: src/ocr-tally.test.ts
      test: "tallyOcr > leaves the adapter itself untouched, so runs never stack"

    - id: H1.7
      scenario: A run sends nothing at all -- a cancelled re-transcribe, or a sync with nothing changed -- and another run sends several images
      expect: The first hands no tally over, so the last run's figures stay; the second hands it over once, on its first image. Diagnostics describe the last run that read something
      layer: unit
      file: src/ocr-tally.test.ts
      test: "tallyOcr > hands the tally over once, on the first image sent, and not at all when nothing is"

    - id: H1.8
      scenario: The backend is Off
      expect: Not wrapped and nothing handed over. Off answers every image "skipped", which counted as forty blank pages and replaced the last real run
      layer: unit
      file: src/ocr-tally.test.ts
      test: "tallyOcr > leaves Off alone: it reads nothing, so there is nothing to report"

    - id: H1.9
      scenario: The backend throws on the first image of a run
      expect: The tally was already handed over before it read, so a run that fails still reports
      layer: unit
      file: src/ocr-tally.test.ts
      test: "tallyOcr > hands the tally over before the backend reads, so a run that fails still reports"

    - id: H1.10
      scenario: The backend throws while reading a margin note
      expect: The note counts as failed, and the error still reaches the caller unchanged
      layer: unit
      file: src/ocr-tally.test.ts
      test: "tallyOcr > counts a throw as failed and still throws it"

    - id: H1.11
      scenario: Seven margin notes fail with six different sentences, one of them twice
      expect: All seven count as failed; the warnings keep each sentence once, and only the first five
      layer: unit
      file: src/ocr-tally.test.ts
      test: "tallyOcr > keeps each warning once, and only the first few"

    - id: H1.12
      scenario: The last run used a backend whose model field is empty
      expect: '"Last transcription: ollama, model (none set)" rather than an empty name after "model"'
      layer: unit
      file: src/ocr-tally.test.ts
      test: "describeOcrTally > says when no model is set rather than printing an empty name"

    - id: H1.13
      scenario: The last run used a backend that has no model to name (Apple Vision), with two notes not run and no warnings
      expect: '"Last transcription: vision" with no model, "Margin notes: 0 read, 0 empty, 0 failed, 2 not run", and "Transcription warnings: none"'
      layer: unit
      file: src/ocr-tally.test.ts
      test: "describeOcrTally > leaves the model out where there is none to name"

    - id: H1.14
      scenario: Diagnostics are copied after a run that did not use Apple Vision
      expect: '"Vision revision: not run in the last transcription" rather than a null revision. The revision belongs to the same run as the other figures under Last transcription, not to the whole session'
      layer: unit
      file: src/diagnostics.test.ts
      test: "buildDiagnostics > says Vision did not run in the last transcription rather than printing a null revision"

    - id: H1.15
      scenario: Diagnostics are copied after an Ollama run that read twelve pages, with five margin notes empty and two failed
      expect: The block names the backend and model that ran, counts pages and margin notes by outcome, and lists the backend's warning
      layer: unit
      file: src/diagnostics.test.ts
      test: "buildDiagnostics > names the model the last run read with and what came back, by kind"

    - id: H1.16
      scenario: Diagnostics are copied before anything was transcribed since Obsidian started
      expect: '"Last transcription: none since Obsidian started" and no count lines, rather than zeros that read like a run that found nothing'
      layer: unit
      file: src/diagnostics.test.ts
      test: "buildDiagnostics > says no transcription has run yet rather than printing zeros for one"

    - id: H1.17
      scenario: An OpenAI-compatible backend is asked which model it runs
      expect: The model id from the settings, so diagnostics can name it
      layer: unit
      file: src/openai-compat-ocr-backend.test.ts
      test: "OpenAiCompatOcrBackend > names its model for the diagnostics"

    - id: H1.18
      scenario: The downloaded model's backend is asked which model it runs
      expect: The label of the model generation it runs, so diagnostics can name it
      layer: unit
      file: src/local-ocr-backend.test.ts
      test: "LocalOcrBackend > names the model generation it runs for the diagnostics"
