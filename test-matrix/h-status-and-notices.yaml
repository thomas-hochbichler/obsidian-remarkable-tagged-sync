# Group H -- what the plugin says about a run, plus E15, the one thing it says once.
#
# Every *condition* below is tested in the engine. Not one *sentence* was, and that split is the
# whole risk: a sync that quietly skipped six notes and a sync that did everything are identical from
# outside if the announcing code stops working. The announcement is the only place the difference
# exists.
#
# The status item is the same shape from the other side. It is the only thing on screen during a run,
# and a bar left at full or an icon stuck on the spinner claims a state the plugin is not in --
# indefinitely, because nothing else will correct it.
#
# The `vault` rows drive the shipped handlers with the engine replaced by a scripted result and a
# gate, which is the only way to read the busy state while it is still busy.

- feature: C3
  name: Status bar with real progress
  code: src/status-model.ts
  tier: free
  scenarios:
    - id: C3.1
      scenario: A sync is running
      expect: The item is visible, spinning, and offers to stop
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what the status item shows while a sync runs > spins, and offers to stop"

    - id: C3.2
      scenario: The pre-scan is walking documents
      expect: "A count and the document's name, and no bar -- how much there is to do is precisely what is not known yet"
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what the status item shows while a sync runs > counts documents during the scan, with no bar, because how much there is to do is what is not known yet"

    - id: C3.3
      scenario: The scan has not enumerated anything yet
      expect: '"Tagged Sync: scanning…" rather than "checking 0 of 0", which reads as a finished run that found nothing'
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what the status item shows while a sync runs > says it is scanning while it still has nothing to count"

    - id: C3.4
      scenario: The scan has a count but has not reached a document yet
      expect: The separator is dropped, so it cannot dangle with nothing after it
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what the status item shows while a sync runs > drops the separator when there is no document name to put after it"

    - id: C3.5
      scenario: Work is under way on a measured number of pages
      expect: "The bar fills against that count and the item shows the document's name in place of the prefix -- the name is what the width is for"
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what the status item shows while a sync runs > fills the bar against the work it counted, and shows the name instead of a prefix"

    - id: C3.6
      scenario: The pre-scan under-counted and more work is reported than it measured
      expect: "The bar stops at full. Past it, the plugin looks broken at exactly the moment it is nearly done"
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what the status item shows while a sync runs > never lets the bar past full, however the count was measured"

    - id: C3.7
      scenario: A user hovers the item during a run
      expect: "The document, the tag, the page within it and the current step -- everything that does not fit in about 200px"
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what the status item shows while a sync runs > puts the whole story in the tooltip, which is where there is room for it"

    - id: C3.8
      scenario: A sync ends after the bar reached full
      expect: "The bar is hidden. One left sitting at 100% claims the run is still happening"
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what the status item shows once a sync ends > hides the bar when the run ends, rather than leaving it sitting at full"

    - id: C3.9
      scenario: The user asks for a stop and progress keeps arriving
      expect: "The item reads stopping…, stops offering to stop, and the bar freezes where it stands -- work already done is not undone by stopping"
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what the status item shows once a sync ends > stops offering to stop once the user has asked it to, and freezes the bar where it stands"

- feature: H8
  name: Status-bar outcome states
  code: src/status-model.ts
  tier: free
  scenarios:
    - id: H8.1
      scenario: A run finishes having written notes
      expect: A check, no spinner, no offer to stop, and the count
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what the status item shows once a sync ends > checks off a run that wrote notes, and says how many"

    - id: H8.2
      scenario: A run finishes with nothing to do
      expect: '"up to date" -- a count of zero would read as a failure'
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what the status item shows once a sync ends > says up to date when there was nothing to write"

    - id: H8.3
      scenario: The user stopped the run
      expect: "Its own icon. A check would claim a run that finished and a cross would claim one that broke, and a stopped run is neither"
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what the status item shows once a sync ends > gives a stopped run its own icon, because a check and a cross would both lie about it"

    - id: H8.4
      scenario: The run threw
      expect: A cross, not a spinner left turning forever
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what the status item shows once a sync ends > crosses out a run that threw"

    - id: H8.5
      scenario: Every state, asked for its icon and whether it spins
      expect: "Four states, four icons, and only busy spins. The map is a literal, and a literal is exactly the kind of thing that gets edited by hand"
      layer: unit
      file: src/status-model.test.ts
      test: "statusView > gives each state its own icon, and spins only while busy"

    - id: H8.6
      scenario: A finished state arrives carrying a bar percentage anyway
      expect: "No bar. The rule belongs to the state, not to the caller remembering to pass null"
      layer: unit
      file: src/status-model.test.ts
      test: "statusView > shows no bar unless one was given"

    - id: H8.7
      scenario: A busy state with a stop already requested
      expect: Not clickable, and the tooltip drops the offer
      layer: unit
      file: src/status-model.test.ts
      test: "statusView > withdraws the offer to stop once a stop is pending"

    - id: H8.8
      scenario: A state with a detail but nothing to stop
      expect: "The detail alone, with no blank line where the offer would have been"
      layer: unit
      file: src/status-model.test.ts
      test: "statusView > joins the tooltip without leaving an empty line where a part is missing"

    - id: H8.9
      scenario: A state with neither a detail nor an offer
      expect: An empty tooltip rather than a stray newline
      layer: unit
      file: src/status-model.test.ts
      test: "statusView > leaves the tooltip empty when there is nothing to put in it"

    - id: H8.10
      scenario: The scan reports its counts
      expect: "The counted sentence, no bar, and the name in its own field -- the whole scanning line, decided in one place"
      layer: unit
      file: src/status-model.test.ts
      test: "progressStatus > turns a scan tick into a count, a name and no bar"

    - id: H8.11
      scenario: The working phase reports its counts
      expect: A percentage, the name, and no text competing with it for the width
      layer: unit
      file: src/status-model.test.ts
      test: "progressStatus > turns a working tick into a percentage and a name"

    - id: H8.12
      scenario: A tick arrives after the user asked to stop
      expect: "The stopping line, carrying the bar forward unchanged. The ticks would otherwise go on announcing work the user has already ended"
      layer: unit
      file: src/status-model.test.ts
      test: "progressStatus > answers a pending stop instead of the tick, and carries the bar forward"

    - id: H8.13
      scenario: A run's outcome, in each of its three shapes
      expect: "Stopped, wrote, or up to date -- the state and the sentence decided together, because they have to agree"
      layer: unit
      file: src/status-model.test.ts
      test: "outcomeStatus > names the state and the sentence together, since they have to agree"

    - id: H8.14
      scenario: A finished state is asked whether it offers to stop
      expect: "It does not. The offer belongs to a run that is happening, not to the item still showing its outcome"
      layer: unit
      file: src/status-model.test.ts
      test: "statusView > only ever offers to stop a run that is happening"

    - id: H8.15
      scenario: A state carrying both a sentence and a document name
      expect: "They stay two fields. One is truncated and one must survive whole, so merging them would lose the sentence to a long title"
      layer: unit
      file: src/status-model.test.ts
      test: "statusView > passes the two texts through separately, because they are cut differently"

    - id: H8.16
      scenario: A scan tick with a count but no document reached yet
      expect: The separator is dropped rather than left dangling
      layer: unit
      file: src/status-model.test.ts
      test: "progressStatus > drops the separator when nothing follows it"

    - id: H8.17
      scenario: A scan tick before the enumeration came back
      expect: '"scanning…", because "checking 0 of 0" reads as a finished run that found nothing'
      layer: unit
      file: src/status-model.test.ts
      test: "progressStatus > says it is scanning until there is something to count"

    - id: H8.18
      scenario: A working tick reporting more work than the pre-scan measured
      expect: The bar stops at full
      layer: unit
      file: src/status-model.test.ts
      test: "progressStatus > stops the bar at full when the pre-scan under-counted"

    - id: H8.19
      scenario: A stop is requested during the scan, before any bar existed
      expect: "The stopping line with no bar -- carrying it forward must not invent one"
      layer: unit
      file: src/status-model.test.ts
      test: "progressStatus > still says stopping when there was no bar to carry"

    - id: H8.20
      scenario: Each of the three outcomes, asked for a bar
      expect: "None. A bar left sitting at full claims the run is still happening, and it would sit there until the next sync"
      layer: unit
      file: src/status-model.test.ts
      test: "outcomeStatus > leaves no bar behind in any of the three"

- feature: H7
  name: Partial-outcome notices
  code: src/sync-notices.ts
  tier: free
  scenarios:
    - id: H7.1
      scenario: A sync completes with nothing skipped
      expect: Only the ordinary success notice
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what a sync says when it finished but did not do everything > says nothing at all when nothing was skipped"

    - id: H7.2
      scenario: One note synced but transcription failed
      expect: "Said out loud, with the render explicitly still there. It used to be a console.warn under a notice announcing plain success, so the note looked synced and simply had no text"
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what a sync says when it finished but did not do everything > names failed transcription, and keeps the render out of the bad news"

    - id: H7.3
      scenario: Two notes failed transcription
      expect: Plural
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what a sync says when it finished but did not do everything > pluralises failed transcription"

    - id: H7.4
      scenario: A note was edited by hand and not overwritten
      expect: Said, with what to do about it
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what a sync says when it finished but did not do everything > says which notes it refused to overwrite, and what to do about it"

    - id: H7.5
      scenario: Two notes were edited by hand
      expect: Plural
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what a sync says when it finished but did not do everything > pluralises the refused notes"

    - id: H7.6
      scenario: A notebook could not be read
      expect: Said, pointing at the console for which one
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what a sync says when it finished but did not do everything > says how many notebooks it could not read"

    - id: H7.7
      scenario: Three notebooks could not be read
      expect: Plural
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what a sync says when it finished but did not do everything > pluralises skipped notebooks"

    - id: H7.8
      scenario: A book was laid out again on the tablet since its notes were written
      expect: "Warned. The marks stay and the text moves under them, so the quotes go on looking perfectly plausible while describing other sentences -- nothing else will ever flag it"
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what a sync says when it finished but did not do everything > warns that a re-laid-out book's quotes may describe other sentences now"

    - id: H7.9
      scenario: Two books were laid out again
      expect: Plural
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what a sync says when it finished but did not do everything > pluralises re-laid-out books"

    - id: H7.10
      scenario: A note came back with fewer highlights than the last sync wrote
      expect: "Said, because the vault may be the only place a copy still exists -- and only for as long as the user knows to look"
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what a sync says when it finished but did not do everything > says a note came back with fewer highlights than it had"

    - id: H7.11
      scenario: Four notes shrank
      expect: Plural
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what a sync says when it finished but did not do everything > pluralises shrunk notes"

    - id: H7.12
      scenario: All five happen in one run
      expect: "All five, in one fixed order. Notices stack and the last one raised sits on top, so the order decides which one a user standing up from their desk actually reads"
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what a sync says when it finished but did not do everything > raises all five in one fixed order, worst first"

    - id: H7.13
      scenario: Only one of the five happened
      expect: Only that one is raised
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what a sync says when it finished but did not do everything > leaves the ones that did not happen unsaid"

    - id: H7.14
      scenario: A background run skipped notes
      expect: "Silent about the skips, and still says it wrote notes. Nobody is at the keyboard for the bad news, and the good news is why auto-sync is on"
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what a sync says when it finished but did not do everything > says none of it on a background run, while still announcing the notes it wrote"

    - id: H7.15
      scenario: A background run found nothing to do
      expect: "Nothing at all. That notice would otherwise fire every six hours, forever, to report that nothing happened"
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what a sync says when it finished but did not do everything > does not even say 'up to date' on a background run that found nothing"

    - id: H7.16
      scenario: A background run the user stopped by hand
      expect: "Everything a manual run would say. They are at the keyboard, watching, and owed the same reporting"
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what a sync says when it finished but did not do everything > says all of it on a background run the user stopped by hand"

    - id: H7.17
      scenario: Each of the five outcomes, at one and at more than one
      expect: "The sentence and its number, without a vault. Five nouns that inflect differently -- note/notes, note was/notes were, notebook was/notebooks were, book has/books have"
      layer: unit
      file: src/sync-notices.test.ts
      test: "partialOutcomeNotices > says each outcome in its own words, singular and plural"

    - id: H7.18
      scenario: A run where nothing was skipped
      expect: "An empty list, so the caller has nothing to raise rather than a list of empty strings"
      layer: unit
      file: src/sync-notices.test.ts
      test: "partialOutcomeNotices > says nothing when nothing was skipped"

    - id: H7.19
      scenario: Every outcome at once
      expect: "Five notices in the fixed order, each with a timeout long enough to be read -- Obsidian's default is five seconds and these ask the user to go and do something"
      layer: unit
      file: src/sync-notices.test.ts
      test: "partialOutcomeNotices > keeps its order and gives each notice time to be read"

    - id: H7.20
      scenario: A run's own outcome notice, in each shape and for each of manual and background
      expect: "Stopped with and without notes written, notes written, nothing written -- and silence for the last of those in the background"
      layer: unit
      file: src/sync-notices.test.ts
      test: "outcomeNotice > says what the run did, and stays quiet only where a background run must"

    - id: H7.21
      scenario: Each of the five sentences, read for what it asks of the user
      expect: "Each names either the thing that is still fine or where to look. The difference between a report and a notification"
      layer: unit
      file: src/sync-notices.test.ts
      test: "partialOutcomeNotices > tells the user what to do about each one, not only that it happened"

    - id: H7.22
      scenario: One of the five happened and the others did not
      expect: One notice, not five
      layer: unit
      file: src/sync-notices.test.ts
      test: "partialOutcomeNotices > leaves out the ones that did not happen"

    - id: H7.23
      scenario: A background run wrote notes
      expect: "Announced. That is the good news auto-sync exists for, and the one thing worth interrupting for"
      layer: unit
      file: src/sync-notices.test.ts
      test: "outcomeNotice > still announces notes a background run wrote"

- feature: H6
  name: Last error kept for diagnostics
  code: src/main.ts
  tier: free
  scenarios:
    - id: H6.1
      scenario: A run succeeded overall but skipped documents along the way
      expect: 'The skips are on the plugin, so "Copy diagnostics" does not report "Last error: none" about a run that quietly did not finish its work'
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what a sync records for the diagnostics block > keeps the skip errors, so Last error does not read none after a run that skipped things"

    - id: H6.2
      scenario: A clean run follows one that had skips
      expect: "The old error is cleared, so diagnostics describes the latest sync rather than the worst one"
      layer: vault
      file: src/status-and-notices.test.ts
      test: "what a sync records for the diagnostics block > clears a stale error after a clean run, so diagnostics describes the latest sync"

- feature: E15
  name: One-time platform-gap notice
  code: src/sync-notices.ts
  tier: free
  scenarios:
    - id: E15.1
      scenario: The first sync that produces a note this platform cannot transcribe
      expect: "The limit is stated once. It promises nothing: pointing at an API key setting this build does not have is worse than silence"
      layer: vault
      file: src/status-and-notices.test.ts
      test: "the one-time notice about what this platform cannot transcribe > explains the gap the first time a sync produces a note it could not transcribe"

    - id: E15.2
      scenario: Every note in the run was transcribable
      expect: Silence
      layer: vault
      file: src/status-and-notices.test.ts
      test: "the one-time notice about what this platform cannot transcribe > stays silent when every note was transcribable"

    - id: E15.3
      scenario: A second sync in the same session hits the same gap
      expect: Silent. The promise is "once"
      layer: vault
      file: src/status-and-notices.test.ts
      test: "the one-time notice about what this platform cannot transcribe > says it once and never again"

    - id: E15.4
      scenario: Obsidian is restarted and a sync hits the gap again
      expect: "Still silent -- the flag is written to data.json. Kept in memory it would say it again every morning"
      layer: vault
      file: src/status-and-notices.test.ts
      test: "the one-time notice about what this platform cannot transcribe > is still silent after a restart, because the flag is written to data.json"

    - id: E15.5
      scenario: The notices that ask the user to go and do something
      expect: "Long enough to be read. Obsidian's default notice is gone in five seconds"
      layer: vault
      file: src/status-and-notices.test.ts
      test: "the one-time notice about what this platform cannot transcribe > gives the partial-outcome notices room to be read"

    - id: E15.6
      scenario: The gap is hit in a build that has other backends to offer, and in one that does not
      expect: "The clause appears only where there is something to point at. Naming a setting this build does not have is the failure the sentence exists to avoid"
      layer: unit
      file: src/sync-notices.test.ts
      test: "platformGapNotice > offers another backend only where this build has one"

    - id: E15.7
      scenario: The notice is asked for a second time, having already been shown
      expect: "Null, which is how the caller learns not to raise it. The decision is here; persisting the flag is the caller's"
      layer: unit
      file: src/sync-notices.test.ts
      test: "platformGapNotice > answers null once it has been shown, and when there was nothing to report"

    - id: E15.8
      scenario: The sentence is read for what it commits the plugin to
      expect: "Nothing. A promise of a future fix would be a debt, and the platform gap is not this plugin's to close"
      layer: unit
      file: src/sync-notices.test.ts
      test: "platformGapNotice > promises nothing about a fix"
