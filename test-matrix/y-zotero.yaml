# A tag in Zotero sends the paper (spec §2.6). Send started from the other end: the person deciding
# what to read next is sitting in Zotero, and every bridge the community built starts from a tag
# there for that reason. Same pipeline as Y19–Y22 -- folder, name, transport order, link -- with one
# rule of its own: no dialog, ever (every question Send asks is a skip with a reason here).
#
# A command since 2026-09-18 (*Send tagged Zotero papers to reMarkable*), no longer a step at the end
# of the sync: "Sync never writes to your tablet" is the promise, and the one thing that puts a file
# on the tablet is a command the user runs. So every row answers a press -- there is always a
# sentence, never silence -- and the SSH route needs no background-run guard any more.
#
# The load-bearing rows are Y31.13 and Y31.15 (the two places Send would open a dialog, and this
# command must not).

- feature: Y31
  name: A tag in Zotero sends the paper
  code: src/zotero-tag-send.ts
  tier: free
  scenarios:
    - id: Y31.1
      scenario: "A vault with the cloud connected, with or without SSH; a vault with only SSH"
      expect: "The cloud when it is connected, else the tablet over SSH -- Send's order (§2.4). The SSH restart needs no guard here: a command always has the person holding the tablet at the keyboard"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "which route a tagged paper takes > takes the cloud first, then the tablet over SSH"

    - id: Y31.3
      scenario: "Neither route"
      expect: "`null`"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "which route a tagged paper takes > has no route for a vault with neither"

    - id: Y31.8
      scenario: "An unlinked paper carrying the send tag, cloud connected, one mapped tag"
      expect: "Sent through the same pipeline as Send: the tablet folder, the item's title, `sentAt` and `sentMd5` on the link, one save, the status line naming the route, and the one-sentence notice -- which ends by saying to tag it on the tablet. **No sync tag on the document** (decided 2026-09-13 after the live test, for Send and this step alike): a tag the user never chose turned up on the tablet with no setting to explain it. Whether the paper syncs back is the reader's to say, by tagging it there"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "a paper tagged in Zotero, when the command runs > goes to the tablet through the same pipeline as Send, untagged, and the link is recorded"

    - id: Y31.9
      scenario: "Two tagged papers"
      expect: "One sentence naming both, in the plural"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "a paper tagged in Zotero, when the command runs > names every paper it sent in one sentence"

    - id: Y31.10
      scenario: "Any run of the step"
      expect: "No write reaches Zotero -- not an annotation, not a patch -- and the tag stays on the item. Items are the user's; removing a tag would be the first write to an item we only ever read"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "a paper tagged in Zotero, when the command runs > writes nothing into Zotero, and leaves the tag where it found it"

    - id: Y31.11
      scenario: "A tagged paper whose document is still on the tablet"
      expect: "Nothing sent, link untouched, and one sentence for the press: 'the paper tagged … is on your reMarkable already'. Idempotence comes from the link store (§2.5), not from Zotero, and the tag staying on a paper sent last week is the normal state"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "a paper tagged in Zotero, when the command runs > skips a paper that is already on the tablet, and says so once"

    - id: Y31.35
      scenario: "Two tagged papers, both still on the tablet"
      expect: "Nothing sent and one sentence counting them: 'all 2 papers tagged … are on your reMarkable already'"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "a paper tagged in Zotero, when the command runs > counts the papers that are on the tablet already, in one sentence"

    - id: Y31.36
      scenario: "The command, for a paper with no link here whose name the tablets folder already holds (the live test of 2026-09-18: one paper, two vaults, two copies)"
      expect: "Skipped and counted as on the tablet already, no link written. The folder is asked once per run, by name, beside the link store"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "a paper tagged in Zotero, when the command runs > does not send a paper whose name the tablet's folder already holds, whichever vault put it there"

    - id: Y31.12
      scenario: "A tagged paper whose document has vanished from the tablet"
      expect: "Sent again and the mapping replaced -- §2.5, unchanged"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "a paper tagged in Zotero, when the command runs > sends a paper whose document has vanished from the tablet again, and replaces the mapping"

    - id: Y31.13
      scenario: "A tagged paper with two PDFs"
      expect: "Skipped and named, with the command's name in the reason; no picker opened. The one question Send asks about a paper, and nobody is there to answer it"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "a paper tagged in Zotero, when the command runs > skips a paper with two PDFs, names it, and opens no dialog"

    - id: Y31.14
      scenario: "A tagged paper with no PDF"
      expect: "Skipped and named"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "a paper tagged in Zotero, when the command runs > skips a paper that has no PDF in Zotero"

    - id: Y31.15
      scenario: "A tagged paper Zotero has no copy of, on disk or online"
      expect: "Skipped and named, no link written, and no file dialog. Send's third path opens one; this step may not"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "a paper tagged in Zotero, when the command runs > skips a paper Zotero has no copy of, rather than asking for the file"

    - id: Y31.16
      scenario: "Two tagged papers, and the upload of the first throws"
      expect: "The second is still sent; the first is named with the transport's own message. One paper's failure is not the run's"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "a paper tagged in Zotero, when the command runs > keeps sending the others when one paper's upload fails"

    - id: Y31.17
      scenario: "The send tag emptied in the settings, then the command pressed"
      expect: "One sentence saying where to name a tag; Zotero is not even asked. The setting is prefilled, so an empty one is the user's doing (a vault with no client is Y29.38's door)"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "when the whole command stands down > says where to name a tag when the setting was emptied, and asks Zotero nothing"

    - id: Y31.19
      scenario: "No paper carries the tag, in a vault that also maps no tag and has no route"
      expect: "'No paper carries the tag …' and nothing about routes or tags it has not set up. Zotero is asked first and the vault's own state only if there is something tagged; somebody pressed the command, so an empty answer is a sentence, not silence"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "when the whole command stands down > says that no paper carries the tag, before anything about routes"

    - id: Y31.20
      scenario: "A send tag renamed in the settings"
      expect: "That is the tag Zotero is asked for"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "when the whole command stands down > asks Zotero for the tag the setting names"

    - id: Y31.21
      scenario: "A tagged paper in a vault that maps no tag"
      expect: "Sent, untagged. Nothing here puts a tag on, so the vault's tag mapping is none of this step's business"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "when the whole command stands down > sends in a vault that maps no tag, since the tag is the reader's to put on"

    - id: Y31.25
      scenario: "A tagged paper in a vault with no route to a tablet"
      expect: "Nothing sent, one notice carrying `SEND_NEEDS_TRANSPORT`"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "when the whole command stands down > sends nothing from a vault with no route to a tablet, and says so"

    - id: Y31.26
      scenario: "SSH the only route"
      expect: "Sent over the tablet in the same press, the status line naming that route. The restart of the reading app is the SSH setting's own sentence, agreed to in advance, and the person pressing the command is the person holding the tablet"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "when the whole command stands down > sends over SSH when the cloud is not connected, in the same press"

    - id: Y31.27
      scenario: "Zotero answers 401 to the tag listing"
      expect: "Nothing sent; one notice in the §3.4.2 shape -- which tag, Zotero's reason in the note's words, in Zotero's words"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "when the whole command stands down > says in Zotero's own words why nothing was sent when Zotero does not answer"

    - id: Y31.28
      scenario: "A tagged paper sent an hour ago whose document no sync has listed yet, `lastSyncAt` past `sentAt`"
      expect: "Nothing sent, nothing said, link untouched. The live bug of 2026-09-12: the listing right after a send lagged, 'sent since the last sync' read the send as vanished, and every run put another copy on the tablet"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "a paper tagged in Zotero, when the command runs > does not send a paper again while no sync has listed its document yet"

    - id: Y31.29
      scenario: "A tagged paper sent two days ago whose document no listing has ever found"
      expect: "Sent again, the old link replaced. Deleted on the tablet before any listing caught it; without the day's limit it would stay present for good and never come back"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "a paper tagged in Zotero, when the command runs > sends a paper again whose document no listing has found in a day"

    - id: Y31.30
      scenario: "A vault that has never touched the send tag"
      expect: "`to-remarkable`, prefilled (decided 2026-09-18, reversing 2026-09-12's empty default): nothing happens until the command is run, so the tag is a name, not a switch"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "when the whole command stands down > starts with the tag the setting suggests"

    - id: Y31.31
      scenario: "Two tagged papers and no route to a tablet"
      expect: "One notice, counting both: `2 papers tagged … not sent`. The step stands down as a whole, and says for how many"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "a paper tagged in Zotero, when the command runs > counts the papers in the notice when the whole command stands down"

    - id: Y31.32
      scenario: "The tablet folder setting left blank, and a tagged paper with a blank title"
      expect: "The default folder `Zotero`, and the paper named by its key -- the same fallbacks Send makes, in the notice as on the tablet"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "a paper tagged in Zotero, when the command runs > falls back to the default folder and the item key where the setting and the title are blank"

    - id: Y31.33
      scenario: "An upload that throws something other than an Error"
      expect: "The paper is named with that value as its reason, like any other per-item failure; the loop goes on"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "a paper tagged in Zotero, when the command runs > names a paper whose upload failed with something that is not an Error"

    - id: Y31.34
      scenario: "Zotero stops answering after the tag listing -- the attachment listing throws"
      expect: "One notice in the §3.4.2 wording, `were not all sent`, and nothing sent. Whatever went up before it stays sent and said; the next sync tries again"
      layer: unit
      file: src/zotero-tag-send.test.ts
      test: "a paper tagged in Zotero, when the command runs > says the command did not finish when Zotero fails after the listing"

# The marker's colour in the note (F9 revised 2026-09-13). Found in the desk test: Zotero showed six
# colours, the digest showed every mark yellow. One table -- `highlight-color.ts` -- names the colour
# for both, so the note and the library cannot disagree.
- feature: Y32
  name: The marker's colour in the digest
  code: src/digest-builder.ts
  tier: free
  scenarios:
    - id: Y32.1
      scenario: A highlight the device recorded in colour
      expect: 'A `<mark>` carrying the name of the Zotero colour of the same hue (`tagged-sync-hl-green`, `-magenta`, `-gray`, …), painted by the plugin''s own `styles.css` -- no snippet to install, and a theme may override it. Same table as the annotation written into Zotero, so the Paper Pro''s pastel green is green in both places'
      layer: unit
      file: src/digest-builder.test.ts
      test: "renderDigest — highlight quotes > paints a coloured mark with the name of the Zotero colour it becomes"

    - id: Y32.2
      scenario: A pen mark, or a marker recorded without a colour
      expect: 'Markdown''s own `==...==`, exactly as before: the colour is not known to be anything, and Obsidian''s default mark says so'
      layer: unit
      file: src/digest-builder.test.ts
      test: "renderDigest — highlight quotes > keeps Markdown's own mark for a highlight with no recorded colour"

    - id: Y32.3
      scenario: A coloured mark over text that carries `<` or `&`
      expect: 'The text inside the mark is escaped, the mark itself is not. Escaping the finished line would turn the `<mark>` into text; not escaping the run would let a tag in the document open raw HTML (the XML-tag case that once stopped the whole digest)'
      layer: unit
      file: src/digest-builder.test.ts
      test: "renderDigest — highlight quotes > escapes the text inside a coloured mark and leaves the mark itself alone"

    - id: Y32.4
      scenario: The runs cover the whole quote (the 75 % rule)
      expect: 'No mark and so no colour: the rule is about the marks, and a quote that is all mark is the highlight. Colour would need a mark to sit on, and a striped slab in green is still a striped slab'
      layer: unit
      file: src/digest-builder.test.ts
      test: "renderDigest — highlight quotes > drops the colour with the marks when the runs cover the whole quote"

- feature: Y33
  name: Group libraries
  code: src/zotero-client.ts
  tier: pro
  scenarios:
    - id: Y33.1
      scenario: "The connection is asked which groups it can see"
      expect: 'A list of `{ id, name }` read off `/users/<id>/groups` (`/users/0/groups` locally) -- membership, not write access; a row with no id or no name is not a library anyone can switch on'
      layer: unit
      file: src/zotero-client.test.ts
      test: "group libraries (ticket 26) > lists the groups a connection can see, by id and name, under the user prefix"

    - id: Y33.2
      scenario: "The desktop app is asked for a group's items"
      expect: '`/api/groups/<id>/…`, the same shape zotero.org uses, so the reads and writes stay written once'
      layer: unit
      file: src/zotero-local.test.ts
      test: "group libraries (ticket 26) > asks a group on its own prefix"

    - id: Y33.3
      scenario: "The desktop app is asked which groups it holds"
      expect: '`/api/users/0/groups` -- the local API mirrors the web''s group endpoints (proven in `omni.ja` of the installed Zotero 10, research/26)'
      layer: unit
      file: src/zotero-local.test.ts
      test: "group libraries (ticket 26) > lists the groups this database holds under the personal prefix"

    - id: Y33.4
      scenario: "A write into a group the desktop app may only read"
      expect: '`Write access denied` (403) comes back as `read-only`'
      layer: unit
      file: src/zotero-local.test.ts
      test: "group libraries (ticket 26) > reports a group it may only read as read-only when written into"

    - id: Y33.5
      scenario: "zotero.org is asked for a group's items"
      expect: '`/groups/<id>/…` straight away: a group path needs no user id, so `/keys/current` is not asked first'
      layer: unit
      file: src/zotero-web.test.ts
      test: "group libraries (ticket 26) > asks a group under its own prefix, which needs no account lookup at all"

    - id: Y33.6
      scenario: "zotero.org is asked which groups the key can see"
      expect: '`/users/<userID>/groups`, under the account the key belongs to'
      layer: unit
      file: src/zotero-web.test.ts
      test: "group libraries (ticket 26) > lists the key's groups under the account the key belongs to"

    - id: Y33.7
      scenario: "A group's PDF is downloaded from zotero.org"
      expect: '`/groups/<id>/items/<key>/file`, not the personal library''s path with the same key'
      layer: unit
      file: src/zotero-web.test.ts
      test: "group libraries (ticket 26) > downloads a group's PDF from the group's own path"

    - id: Y33.8
      scenario: "A client over the personal library and one enabled group lists, searches or reads a tag"
      expect: 'Every enabled library in turn, each on its own prefix, and every row stamped with the library it came from -- a key is unique only within a library. `libraries` says which, in setting order'
      layer: unit
      file: src/zotero-client.test.ts
      test: "group libraries (ticket 26) > asks each enabled library on its own prefix and stamps every row with where it came from"

    - id: Y33.9
      scenario: "The desktop app does not hold an enabled group (404 on its listing); or no connection does"
      expect: 'The one not-found that is about the connection rather than the item: it falls through to zotero.org like an outage would, and a group nobody holds lists as empty rather than failing every document of the run'
      layer: unit
      file: src/zotero-client.test.ts
      test: "group libraries (ticket 26) > falls through to the web for a group the desktop app does not hold, and lists it empty when nobody holds it"

    - id: Y33.10
      scenario: "A write is refused with 403"
      expect: '`read-only`, never fallen back on: the other connection would refuse the same way, and the write is never re-routed into another library. A refused *read* stays `unauthorized` -- that is the key, and worth asking the other connection'
      layer: unit
      file: src/zotero-client.test.ts
      test: "group libraries (ticket 26) > reads a refused write as read-only and never tries the other connection with it"

    - id: Y33.11
      scenario: "A patch on an annotation read from a group"
      expect: 'Routed by the annotation''s library as well as by its source: the same key in the personal library is another annotation'
      layer: unit
      file: src/zotero-client.test.ts
      test: "group libraries (ticket 26) > routes a patch by the annotation's library as well as by its source"

    - id: Y33.12
      scenario: "A library is named in a sentence"
      expect: '`your library`, the group''s name as the setting stored it, or `group <id>` for one the setting no longer holds'
      layer: unit
      file: src/zotero-client.test.ts
      test: "group libraries (ticket 26) > names a library the way a person would"

    - id: Y33.13
      scenario: "A vault with a group switched on, with and without Pro"
      expect: 'The Pro half, refused in place like the desktop app: a Pro vault''s client reads the personal library and the group, a free vault''s the personal library alone, and the setting is left where it is'
      layer: unit
      file: src/zotero-settings.test.ts
      test: "group libraries (ticket 26) > reach a Pro vault's client and not a free vault's"

    - id: Y33.14
      scenario: "A link into a group is stored and read back"
      expect: '`library: { group: <id> }` round-trips through `data.json`'
      layer: unit
      file: src/zotero-links.test.ts
      test: "a link into a group library (ticket 26) > round-trips the group id"

    - id: Y33.15
      scenario: "A stored link whose group id is text"
      expect: 'Not acted on -- read as not linked -- and not dropped either: a shape this build does not handle is another build''s'
      layer: unit
      file: src/zotero-links.test.ts
      test: "a link into a group library (ticket 26) > does not act on a group id given as text, and does not drop it either"

    - id: Y33.16
      scenario: "A stored link whose group id is not a whole number"
      expect: 'Same as Y33.15'
      layer: unit
      file: src/zotero-links.test.ts
      test: "a link into a group library (ticket 26) > does not act on a group id that is not a whole number, and does not drop it either"

    - id: Y33.17
      scenario: "A stored link whose group id is zero"
      expect: 'Same as Y33.15'
      layer: unit
      file: src/zotero-links.test.ts
      test: "a link into a group library (ticket 26) > does not act on a group id of zero, and does not drop it either"

    - id: Y33.18
      scenario: "A stored link whose library is a word this build does not know"
      expect: 'Same as Y33.15'
      layer: unit
      file: src/zotero-links.test.ts
      test: "a link into a group library (ticket 26) > does not act on a word this build does not know, and does not drop it either"

    - id: Y33.19
      scenario: "An item's PDFs are looked up while a group holds an item with the same key"
      expect: 'Only the PDFs of the item''s own library: `ITEM1` in a group is another paper'
      layer: unit
      file: src/zotero-send.test.ts
      test: "group libraries (ticket 26) > takes only the PDFs of the item's own library"

    - id: Y33.20
      scenario: "The personal library's copy and a group's copy of the same key are both on the tablet"
      expect: 'Told apart by the library: sending the group''s again asks about the group''s document only'
      layer: unit
      file: src/zotero-send.test.ts
      test: "group libraries (ticket 26) > tells a group's copy on the tablet apart from the personal library's"

    - id: Y33.21
      scenario: "A group's PDF is sent"
      expect: 'The bytes are fetched from the group, and the link records the group'
      layer: unit
      file: src/zotero-send.test.ts
      test: "group libraries (ticket 26) > fetches the PDF from the group and records the group on the link"

    - id: Y33.22
      scenario: "The same file hashes to an attachment in the personal library and to one in a group"
      expect: 'Not a silent match: the one question of §2.3, with the library named beside each candidate -- the answers are told apart by nothing else'
      layer: unit
      file: src/zotero-sync.test.ts
      test: "group libraries (ticket 26) > asks, naming the library beside each candidate, when the same file is in the personal library and in a group"

    - id: Y33.23
      scenario: "The same question while only the personal library is read"
      expect: 'No library named: with one there is nothing to tell apart, and every row would say the same thing'
      layer: unit
      file: src/zotero-sync.test.ts
      test: "group libraries (ticket 26) > names no library while only the personal one is read"

    - id: Y33.24
      scenario: "A document matched to a group's PDF"
      expect: 'The link carries the group; the callout links `zotero://select/groups/<id>/…` and `https://www.zotero.org/groups/<id>/…`; every quote opens `zotero://open-pdf/groups/<id>/…`; the keys carry `zoteroLibrary: "<id>"`'
      layer: unit
      file: src/zotero-sync.test.ts
      test: "group libraries (ticket 26) > links a group's paper into the group, in every link the note carries"

    - id: Y33.25
      scenario: "Write-back into a group the user may only read"
      expect: 'One create, into the group, and no retry into the personal library; the note says `not written back: no write access to <Group name>` and the run says the same (§3.4.2)'
      layer: unit
      file: src/zotero-sync.test.ts
      test: "group libraries (ticket 26) > writes into the group and nowhere else, and names the group it may only read"

    - id: Y33.26
      scenario: "A link into a group the vault has since switched off"
      expect: 'Left exactly as it is, nothing read for it -- not even the listing -- and the note says `Zotero: library switched off` with its keys left alone; "gone" would be the wrong word for a library that is merely off'
      layer: unit
      file: src/zotero-sync.test.ts
      test: "group libraries (ticket 26) > leaves a link into a group that was switched off alone, and says so"

    - id: Y33.27
      scenario: "A library refuses writes half-way through a plan"
      expect: '`executeWriteBack` gives up with the `read-only` error rather than counting `0 of 12 written, retry on next sync`: nothing after it can land either, and the pass names the group'
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "carrying out the plan > gives up on a library that refuses writes, so the pass can name it"

    - id: Y33.28
      scenario: "The callout line for an item in a group"
      expect: '`zotero://select/groups/<id>/items/<key>` and `https://www.zotero.org/groups/<id>/items/<key>` -- Zotero''s own spelling on both'
      layer: unit
      file: src/zotero-note.test.ts
      test: "an item in a group library (ticket 26) > links into the group in Zotero and on the web"

    - id: Y33.29
      scenario: "The per-quote link for a group's PDF"
      expect: '`zotero://open-pdf/groups/<id>/items/<attKey>?page=…&annotation=…`'
      layer: unit
      file: src/zotero-note.test.ts
      test: "an item in a group library (ticket 26) > opens the reader on the group's copy of the PDF"

    - id: Y33.30
      scenario: "Frontmatter for an item in a group, then for one in the personal library, then the toggle-off cleanup"
      expect: '`zotero-library: <id>` beside `zotero-key` for a group only; `null` takes the line out, so a query on `zotero-key` alone keeps working; the cleanup removes it with the key'
      layer: unit
      file: src/frontmatter.test.ts
      test: "the two Zotero keys > names the group library only where the item is in one, and takes the line out with the key"

    - id: Y33.31
      scenario: "Send from the context menu of a note whose frontmatter carries `zotero-library`"
      expect: 'The item is asked for in that group (a YAML number or a quoted string alike), its PDF sent from there, and the link records the group'
      layer: unit
      file: src/zotero-plugin.test.ts
      test: "the context action on a note that names its paper > sends a group's paper from the group, read off the note's zotero-library"

    - id: Y33.32
      scenario: "The send picker's results while more than one library is searched"
      expect: 'The library''s name under each result; with the personal library alone no name at all'
      layer: unit
      file: src/zotero-send-dialog.test.ts
