      scenario: A configured connection answers
      expect: The uncoloured "Checking…" line is replaced by what actually answered, in the theme's success colour. What is *configured* is not the same question as what *answered* -- a key that is set up and rejected has to read as "not connected", which is the state that sends the user to fix it
      layer: unit
      file: src/settings-tab.test.ts
      test: "the Zotero section > replaces the line with what actually answered"

    - id: Y10.9
      tier: pro
      scenario: The configured connection does not answer
      expect: '"Not connected." in the error colour -- `status()` answers rather than throwing, which is why the line has no second arm'
      layer: unit
      file: src/settings-tab.test.ts
      test: "the Zotero section > says not connected when the connection that is set up does not answer"

    - id: Y10.10
      tier: pro
      scenario: The zotero.org switch is off, then on (desk test 2026-09-13)
      expect: 'Off, the key row is hidden -- not removed, so a pasted key stays for the day the switch comes back on. On, the "Zotero cloud" heading holds the switch and the key row, "Zotero local" the desktop switch, and "Zotero on the tablet" the sending rows. One switch per connection, so whether anything goes over the internet is one visible thing rather than "is the key field empty"'
      layer: unit
      file: src/settings-tab.test.ts
      test: "the Zotero section > shows the key row only while zotero.org is switched on, under its own heading"

    - id: Y10.11
      tier: pro
      scenario: The zotero.org switch is flipped on
      expect: Saved, the key row shown, and the status line asked again -- it is now about a different set of connections. No redraw, unlike the desktop switch, so the page does not jump
      layer: unit
      file: src/settings-tab.test.ts
      test: "the Zotero section > saves the cloud switch, shows the key row and asks the status line again"

    - id: Y10.12
      tier: pro
      scenario: A key is stored but the zotero.org switch is off
      expect: '"Not connected.", and no request goes to zotero.org. The key is kept for the day the switch is turned on; until then nothing leaves the machine, which is what the switch is for'
      layer: unit
      file: src/settings-tab.test.ts
      test: "the Zotero section > reads a key with zotero.org switched off as not connected, without asking zotero.org"

- feature: Y11
  name: Where a digest entry sits on the source page
  code: src/digest-pipeline.ts
  tier: free
  scenarios:
    - id: Y11.1
      scenario: A digest is built
      expect: The entries it was rendered from come back with it. Re-deriving them would mean parsing our own markdown, which is a rendering rather than a record -- and nothing of this reaches the vault
      layer: unit
      file: src/digest-pipeline.test.ts
      test: "where the digest's entries sit on the source page > hands back the entries the markdown was rendered from"

    - id: Y11.2
      scenario: A page of a PDF whose text layer could be read
      expect: Its source index and the page height in points. The height is the axis every rectangle is measured against and the one thing a caller cannot recover from the rectangles themselves
      layer: unit
      file: src/digest-pipeline.test.ts
      test: "where the digest's entries sit on the source page > says which page of the source document it is, and how tall that page is"

    - id: Y11.3
      scenario: A page whose text layer could not be read
      expect: '`source: null` and no rectangles. Without a text layer the frame is the *device screen*, so the same numbers would name a place on the tablet -- a highlight written back from them would land on the wrong part of the paper'
      layer: unit
      file: src/digest-pipeline.test.ts
      test: "where the digest's entries sit on the source page > says a page whose text could not be read is not a place in the document"

    - id: Y11.4
      scenario: A margin note on a page of the document
      expect: Its own ink's box, in the source page's points. Flat boxes and boxes past the page edge are both real -- the device's canvas is wider than the paper, and a single horizontal stroke has no height
      layer: unit
      file: src/digest-pipeline.test.ts
      test: "where the digest's entries sit on the source page > gives a margin note a box on the page it was written on"

    - id: Y11.5
      scenario: A margin note on a page that is not a page of the document
      expect: No box, for the same reason as Y11.3
      layer: unit
      file: src/digest-pipeline.test.ts
      test: "where the digest's entries sit on the source page > leaves a margin note without a box where the page is not a place in the document"

    - id: Y11.6
      scenario: One highlight over printed text
      expect: Its runs are kept, not just the box around them. A gesture over wrapped lines is one box per line, and their union includes the unmarked ends of the first and last line -- which is not what the reader marked
      layer: unit
      file: src/digest-pipeline.test.ts
      test: "buildDigest merges highlights that share a sentence > keeps every run of a highlight, not only the box around them"

    - id: Y11.7
      scenario: Two runs of one adjusted selection, merged into one entry
      expect: The entry carries both runs. It is one annotation and all of it is what they marked; the survivor's own box stays what it was, because that is about where the entry sits
      layer: unit
      file: src/digest-pipeline.test.ts
      test: "buildDigest merges highlights that share a sentence > gives the merged entry every member's runs"

    - id: Y11.8
      scenario: Three highlights as the devices record them -- a Paper Pro gesture (palette id 3, opaque-black color_rgba), a reMarkable 2 green (palette id 4, no color_rgba), a Paper Pro highlighter (id 9, true colour)
      expect: Palette yellow, palette green, the true colour. A named palette id is authoritative and color_rgba resolves only the HIGHLIGHT placeholder, the precedence the renderer already used; reading color_rgba first made the first black and the second colourless
      layer: unit
      file: src/digest-pipeline.test.ts
      test: "buildDigest marker colour > takes the palette id the device named, and color_rgba only for the HIGHLIGHT placeholder"

- feature: Y12
  name: Which Zotero PDF a synced document is
  code: src/zotero-match.ts
  tier: free
  scenarios:
    - id: Y12.1
      scenario: A document that is already linked, in a library that now holds a second file with the same bytes and name
      expect: The stored link, untouched. Re-matching would undo a correction the user made by hand the moment the library grew a lookalike (§2.3, "use it; never re-match")
      layer: unit
      file: src/zotero-match.test.ts
      test: "a document that is already linked > is used as it stands, whatever else the library now looks like"

    - id: Y12.2
      scenario: The file behind a linked attachment is replaced in Zotero
      expect: Unaffected. The link is by key, and the new file has a hash that would match nothing
      layer: unit
      file: src/zotero-match.test.ts
      test: "a document that is already linked > survives the file behind it being replaced"

    - id: Y12.3
      scenario: The linked attachment was trashed or deleted
      expect: '"Gone": the note keeps everything it has and loses its Zotero part, write-back does not run, and the link stays in `data.json` because the user may put the item back'
      layer: unit
      file: src/zotero-match.test.ts
      test: "a document that is already linked > says the item is gone when Zotero no longer has it"

    - id: Y12.4
      scenario: The tablet's bytes hash to exactly one attachment
      expect: Linked without asking. The tablet keeps the file it was given byte for byte -- measured against Zotero's storage -- so a hash hit is identity, not evidence
      layer: unit
      file: src/zotero-match.test.ts
      test: "a document that arrived some other way > links silently when exactly one attachment has these bytes"

    - id: Y12.5
      scenario: Two attachments have the same bytes
      expect: Asked, with both offered. A paper filed under two entries is an ordinary library; picking either would be a coin toss the user never sees
      layer: unit
      file: src/zotero-match.test.ts
      test: "a document that arrived some other way > asks when two attachments have the same bytes"

    - id: Y12.6
      scenario: A linked file on the web connection, which has no hash, and a document whose bytes were not read
      expect: No match. Compared without both guards, `null === null` would silently link every hashless attachment to it -- by the rule that is supposed to be the certain one
      layer: unit
      file: src/zotero-match.test.ts
      test: "a document that arrived some other way > never takes two absent hashes for the same bytes"

    - id: Y12.7
      scenario: No hash hit, and one attachment's filename is the tablet document's name
      expect: Asked, not linked. A shared filename is a resemblance
      layer: unit
      file: src/zotero-match.test.ts
      test: "a document that arrived some other way > offers the one attachment whose filename is the tablet's document name, and still asks"

    - id: Y12.8
      scenario: The device kept `.pdf` in the document name, or dropped it, or changed its case
      expect: All three compare equal. Both spellings were seen on a real device (ticket 10), and neither is the user's doing
      layer: unit
      file: src/zotero-match.test.ts
      test: "a document that arrived some other way > compares the name with and without the extension the device may have kept"

    - id: Y12.9
      scenario: Two attachments in the library carry that filename
      expect: Nothing is offered. Two files called `paper.pdf` say nothing at all
      layer: unit
      file: src/zotero-match.test.ts
      test: "a document that arrived some other way > says nothing at all when two files in the library carry that name"

    - id: Y12.10
      scenario: A tablet document and a Zotero file that a human would call the same paper
      expect: No match. Titles are never compared -- a wrong link writes one reader's highlights onto another paper, somewhere the user has no reason to look
      layer: unit
      file: src/zotero-match.test.ts
      test: "a document that arrived some other way > never guesses from a title that merely looks like the same paper"

    - id: Y12.19
      scenario: An attachment with no filename and a document with an empty name
      expect: Not a match. Stripped and compared without the guard, both come out as "" and every nameless attachment matches every nameless document
      layer: unit
      file: src/zotero-match.test.ts
      test: "a document that arrived some other way > takes two missing names for nothing rather than for each other"

    - id: Y12.11
      scenario: Nothing in the library resembles the document
      expect: No Zotero part in the note, and the *Link to Zotero item…* command is how it gets one
      layer: unit
      file: src/zotero-match.test.ts
      test: "a document that arrived some other way > leaves a document alone when there is nothing to go on"

    - id: Y12.12
      scenario: The user closed the picker without answering, and the next sync runs
      expect: Not asked again (§2.3, "ask once"). Without this, a duplicate hash reopens the same picker on every sync
      layer: unit
      file: src/zotero-match.test.ts
      test: "asking once > does not ask a second time about a question the user closed"

    - id: Y12.13
      scenario: The user later links the document by hand
      expect: That link is used. A decision outranks the earlier shrug
      layer: unit
      file: src/zotero-match.test.ts
      test: "asking once > still uses a link written after that question was closed"

    - id: Y12.14
      scenario: Zotero is not connected, so there is no library listing
      expect: Nothing is decided and the sync runs as it does today (§2.3, last row)
      layer: unit
      file: src/zotero-match.test.ts
      test: "with nothing to match against > decides nothing when the library could not be read"

    - id: Y12.15
      scenario: A linked document while Zotero is not connected
      expect: Reported as gone for that run rather than confirmed from nothing. The link itself is untouched
      layer: unit
      file: src/zotero-match.test.ts
      test: "with nothing to match against > reports a linked document as gone rather than inventing an attachment"

    - id: Y12.16
      scenario: A dismissed question is stored
      expect: It reads as unlinked everywhere except the asking. That is the whole of "ask once" -- there is no other place to remember it
      layer: unit
      file: src/zotero-links.test.ts
      test: "a question the user closed > is remembered, and reads as unlinked everywhere else"

    - id: Y12.17
      scenario: An ordinary unlinked document, and a linked one
      expect: Neither reads as a closed question
      layer: unit
      file: src/zotero-links.test.ts
      test: "a question the user closed > is not what an ordinary unlinked document looks like"

    - id: Y12.18
      scenario: A link written after the question was closed
      expect: It replaces the marker outright
      layer: unit
      file: src/zotero-links.test.ts
      test: "a question the user closed > gives way to a link written later"

- feature: Y13
  name: A digest entry as a Zotero annotation
  code: src/zotero-annotations.ts
  tier: pro
  scenarios:
    - id: Y13.1
      scenario: A marker swipe and a pen mark
      expect: '`highlight` and `underline`. The digest renders both identically -- the reader wants the passage, not the tool -- but in Zotero they are two different marks (§3.1)'
      layer: unit
      file: src/zotero-annotations.test.ts
      test: "what kind of annotation an entry becomes > makes a marker swipe a highlight and a pen mark an underline"

    - id: Y13.2
      scenario: A margin note that is not anchored to a highlight
      expect: A sticky `note` (§3.1)
      layer: unit
      file: src/zotero-annotations.test.ts
      test: "what kind of annotation an entry becomes > makes a standalone margin note a sticky"

    - id: Y13.3
      scenario: A highlight whose runs have no rectangles
      expect: Nothing is offered. `annotationPosition` is not optional, and the entry is in the vault note either way
      layer: unit
      file: src/zotero-annotations.test.ts
      test: "what kind of annotation an entry becomes > offers nothing for a highlight with no place on the page"

    - id: Y13.4
      scenario: A margin note whose transcription came back empty
      expect: No sticky. One with no comment marks a spot and says nothing -- it cannot be told from a stray click, and the ink is in the vault's own PDF
      layer: unit
      file: src/zotero-annotations.test.ts
      test: "what kind of annotation an entry becomes > offers nothing for a margin note that could not be transcribed"

    - id: Y13.5
      scenario: A margin note with no box on the source page
      expect: No sticky, for the same reason as Y13.3
      layer: unit
      file: src/zotero-annotations.test.ts
      test: "what kind of annotation an entry becomes > offers nothing for a margin note with no place on the page"

    - id: Y13.6
      scenario: The text of a highlight annotation
      expect: The marked runs, never the sentence around them. In Zotero the annotation sits on the page it came from, so the sentence is not context there -- it is a claim that the reader marked words the page shows they did not
      layer: unit
      file: src/zotero-annotations.test.ts
      test: "the words the annotation carries > is the marked runs, never the sentence around them"

    - id: Y13.7
      scenario: A gesture recorded as several runs
      expect: The passage it covered, joined
      layer: unit
      file: src/zotero-annotations.test.ts
      test: "the words the annotation carries > joins several runs of one gesture into the passage it covered"

    - id: Y13.8
      scenario: A highlight the text layer could not resolve into runs
      expect: What the device itself recorded -- which is what the F4 soft fail puts in `sentence` and the only thing that is there
      layer: unit
      file: src/zotero-annotations.test.ts
      test: "the words the annotation carries > falls back to what the device recorded when no run is known"

    - id: Y13.9
      scenario: Margin notes written beside a highlight
      expect: They become that annotation's comment, one blank line apart (§3.1)
      layer: unit
      file: src/zotero-annotations.test.ts
      test: "the words the annotation carries > carries a margin note anchored to a highlight as that highlight's comment"

    - id: Y13.10
      scenario: A highlight with nothing written beside it
      expect: An empty comment, which is a value we wrote and is remembered as one
      layer: unit
      file: src/zotero-annotations.test.ts
      test: "the words the annotation carries > leaves the comment empty where nothing was written beside the passage"

    - id: Y13.11
      scenario: The position field
      expect: A JSON **string** in the PDF's own frame. Zotero's data layer rejects the object form outright
      layer: unit
      file: src/zotero-annotations.test.ts
      test: "where Zotero is told the annotation sits > is a string, in the PDF's own frame"

    - id: Y13.12
      scenario: A gesture over two wrapped lines
      expect: Two rectangles. Their union would paint the unmarked ends of the first and last line as marked
      layer: unit
      file: src/zotero-annotations.test.ts
      test: "where Zotero is told the annotation sits > carries one rectangle per run, so a wrapped gesture marks the words and not the block"

    - id: Y13.13
      scenario: A margin note whose ink is flat and sits past the page edge
      expect: A 22 pt square, on the page. Both facts are real in the fixture -- a horizontal stroke has no height, and the device's canvas is wider than the paper -- and Zotero paints a rectangle, so either one paints nothing
      layer: unit
      file: src/zotero-annotations.test.ts
      test: "where Zotero is told the annotation sits > gives a sticky a square Zotero can actually draw, on the page"

    - id: Y13.14
      scenario: An ordinary margin note
      expect: The square sits at the top-left of the ink -- where the reader started writing, and the corner Zotero anchors a note's icon to
      layer: unit
      file: src/zotero-annotations.test.ts
      test: "where Zotero is told the annotation sits > puts the sticky at the corner the reader started writing in"

    - id: Y13.15
      scenario: The sort index
      expect: '`PPPPP|000000|TTTTT`. The middle field is the reader''s own character offset, which we do not have -- zero sorts ours by page and height, and inventing one would sort them by a number that means nothing'
      layer: unit
      file: src/zotero-annotations.test.ts
      test: "the sort index Zotero will not do without > is the page, six zeros, and the distance from the page top"

    - id: Y13.16
      scenario: A rectangle above the page top or far below its bottom
      expect: Still five digits. The format is fixed width, and a negative number or a sixth digit makes Zotero refuse the whole annotation
      layer: unit
      file: src/zotero-annotations.test.ts
      test: "the sort index Zotero will not do without > stays five digits for a rectangle off the top or the bottom of the page"

    - id: Y13.17
      scenario: An entry with no rectangle at all
      expect: The top of its page, rather than no index -- the field is `NOT NULL` in Zotero's own schema
      layer: unit
      file: src/zotero-annotations.test.ts
      test: "the sort index Zotero will not do without > puts an entry with no rectangle at the top of its page rather than nowhere"

    - id: Y13.18
      scenario: Every colour a device has been seen to record -- the reMarkable 2's three palette ids, the Paper Pro's gesture ids, highlighter and shader true colours
      expect: The one of Zotero's eight whose hue band the colour falls in, per the measured table (ticket 27). Off that list a colour is invisible in the reader's colour filter and its sidebar grouping, which is most of what a colour is for there
      layer: unit
      file: src/zotero-annotations.test.ts
      test: "the colour > is the one of Zotero's eight whose hue band the device colour falls in"

    - id: Y13.23
      scenario: A pastel highlighter colour -- the Paper Pro's green 172/255/133, its yellow 255/237/117
      expect: Its namesake, not grey or orange. By squared RGB distance a pastel is nearer Zotero's grey than its own saturated colour; the hue is what a colour's name is
      layer: unit
      file: src/zotero-annotations.test.ts
      test: "the colour > keeps a pastel with its namesake rather than with grey"

    - id: Y13.19
      scenario: A pen mark, and a highlight the device recorded without a colour
      expect: Zotero's own default yellow (§3.2)
      layer: unit
      file: src/zotero-annotations.test.ts
      test: "the colour > is Zotero's own yellow for a mark that has no colour"

    - id: Y13.20
      scenario: Every colour this plugin can send
      expect: Lowercase six-digit hex. Zotero's data layer matches `#[a-f0-9]{6}` and rejects anything else, uppercase included
      layer: unit
      file: src/zotero-annotations.test.ts
      test: "the colour > is always lowercase six-digit hex"

    - id: Y13.21
      scenario: A document that numbers its front matter in roman
      expect: The document's own label, `xii`. The physical page is already carried by `pageIndex`
      layer: unit
      file: src/zotero-annotations.test.ts
      test: "the page label > is the document's own, as the digest reads it"

    - id: Y13.22
      scenario: A document with no page labels
      expect: '`""` (§3.2), rather than an ordinal that would read as the document''s own numbering'
      layer: unit
      file: src/zotero-annotations.test.ts
      test: "the page label > is empty where the document does not number its pages"

- feature: Y14
  name: Add and refresh, trash only what is still ours
  code: src/zotero-writeback.ts
  tier: pro
  scenarios:
    - id: Y14.1
      scenario: A highlight Zotero has never seen
      expect: Created, with what to remember about it -- the record is what every later sync compares against
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "a highlight Zotero has never seen > is created, with what to remember about it"

    - id: Y14.2
      scenario: A page with a highlight and a standalone margin note
      expect: A highlight and a sticky, in reading order
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "a highlight Zotero has never seen > carries a standalone margin note as a sticky of its own"

    - id: Y14.3
      scenario: Nothing about a known annotation has changed
      expect: No request at all. A refresh that rewrites identical fields costs a version bump in the user's library for nothing
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "a highlight that is already in Zotero > is left alone when nothing about it has changed"

    - id: Y14.4
      scenario: A margin note written beside a highlight that was already synced
      expect: A patch carrying only the changed field, under the version it was read at
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "a highlight that is already in Zotero > is refreshed, field by field, when the tablet says something new"

    - id: Y14.5
      scenario: The user edited one of our fields in Zotero
      expect: That field is never written again, then or on any later sync. The comparison is against **what we wrote**, so a difference can only be theirs (§3.3)
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "a highlight that is already in Zotero > never writes a field the user has edited in Zotero, then or ever after"

    - id: Y14.6
      scenario: One field taken over by the user, another changed on the tablet
      expect: The surrendered field is left alone and the other is refreshed. Surrender is per field, not per annotation
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "a highlight that is already in Zotero > keeps refreshing the fields the user has not touched"

    - id: Y14.7
      scenario: The user deleted one of our annotations in Zotero
      expect: Remembered as deleted. Re-creating it would overrule a decision silently, and every sync would do it again
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "a highlight that is already in Zotero > stays deleted once the user has deleted it"

    - id: Y14.8
      scenario: The sync after that one
      expect: Still not recreated -- which is the only thing that tells "deleted by the user" from "never written"
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "a highlight that is already in Zotero > is not created again on any later sync either"

    - id: Y14.9
      scenario: '`data.json` lost its mapping while the annotations survived (a restored vault, a second machine)'
      expect: Our own annotations are adopted by `(type, page, text)` instead of duplicated. Without it the next sync writes a second copy of every highlight, and only deleting them by hand puts it right
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "when the mapping is lost but the annotations are not > adopts our own annotation rather than writing a second copy of it"

    - id: Y14.10
      scenario: A tagged annotation that differs in page, in text, or in kind
      expect: Not adopted. All three have to agree; an annotation we cannot identify is one we have no business editing
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "when the mapping is lost but the annotations are not > matches on type, page and text together, never on one of them"

    - id: Y14.11
      scenario: Two entries that would both match the same annotation
      expect: One each. The second adopting the first's annotation would leave one highlight describing the other
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "when the mapping is lost but the annotations are not > gives two entries two annotations, never the same one twice"

    - id: Y14.12
      scenario: An adopted annotation whose fields have drifted
      expect: Refreshed to what the tablet says. There is no record of writing it, so nothing about it reads as the user's edit -- which is what adoption is for
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "when the mapping is lost but the annotations are not > refreshes an adopted annotation to what the tablet says"

    - id: Y14.13
      scenario: A page the reader added on the device
      expect: Skipped, and counted. It is no page of the source PDF, so nothing on it has a place there (§3.1)
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "what is not written at all > skips a page the reader added on the device"

    - id: Y14.24
      scenario: A margin note whose transcription came back empty
      expect: Skipped, and counted. There is nothing to put in a sticky, and the ink is in the vault's own PDF
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "what is not written at all > skips a margin note there is nothing to say about"

    - id: Y14.14
      scenario: An entry with no place on its page
      expect: Skipped, and counted -- the vault note still carries it
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "what is not written at all > skips an entry that has no place on its page"

    - id: Y14.15
      scenario: The user's own Zotero highlights
      expect: Never mentioned in the plan. They are not in the input at all -- the client filters by the ownership tag on the server -- and nothing here invents them
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "what is not written at all > never touches an annotation that is not one of ours"

    - id: Y14.16
      scenario: A highlight the reader erased on the tablet, untouched in Zotero
      expect: Planned for the trash under the version it was read at, and to be remembered as deleted so it is never recreated (§3.3)
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "a highlight the reader erased on the tablet > is trashed while it still reads exactly as we wrote it"

    - id: Y14.26
      scenario: The erased highlight's annotation carries a comment the user wrote in Zotero
      expect: Not trashed, and the field is remembered as theirs. Erasing the ink does not take back what they built on it in Zotero
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "a highlight the reader erased on the tablet > stays when the user has built on it in Zotero, and is remembered as theirs"

    - id: Y14.27
      scenario: The erased highlight's annotation had a field surrendered on an earlier sync
      expect: Not trashed. A surrender is for good, whether or not the field still differs today
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "a highlight the reader erased on the tablet > stays when a field was already surrendered on an earlier sync"

    - id: Y14.28
      scenario: Erased on the tablet and already gone from Zotero
      expect: Remembered as deleted, no request. Nothing is left to trash
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "a highlight the reader erased on the tablet > is only remembered as gone when Zotero no longer has it either"

    - id: Y14.29
      scenario: The sync after the trash
      expect: Neither trashed again nor recreated -- the `deleted` record answers both, as it does for a deletion the user made in Zotero
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "a highlight the reader erased on the tablet > is not trashed twice, or recreated, once it is in the trash"

    - id: Y14.30
      scenario: A highlight still on the tablet, on a page whose text layer could not be read
      expect: Skipped, not trashed. "Not in the digest" and "not offered to Zotero" are different facts, and only the first means erased
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "a highlight the reader erased on the tablet > is told apart from a highlight that is still there but could not be offered"

    - id: Y14.31
      scenario: The digest was not given the annotation's page -- a failed build, or a page-scoped unit for another page
      expect: Nothing is trashed and nothing is remembered. What the digest never saw is not evidence of anything erased
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "a highlight the reader erased on the tablet > is never decided on a page the digest was not given"

    - id: Y14.34
      scenario: The reader erased the last highlight on a page, so the page has no digest entry at all
      expect: Trashed. The page was given to the digest, so its silence is evidence -- otherwise the last highlight on any page could never be taken back. Live 2026-09-13 on a page-scoped unit, where a whole-document guard blocked exactly this
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "a highlight the reader erased on the tablet > is decided on a page the digest was given even when that page has nothing left on it"

    - id: Y14.32
      scenario: Carrying out a trash
      expect: The client is asked with the annotation's own version and source; the record is stored as deleted and counted as written
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "carrying out the plan > records a trashed annotation as deleted, so it is never recreated"

    - id: Y14.33
      scenario: Zotero answers 412 to the trash
      expect: Nothing recorded, not counted as written. The user touched it in the window between read and write, and the next sync reads that edit and keeps the annotation for good
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "carrying out the plan > leaves an annotation alone when it changed under us on the way to the trash"

    - id: Y14.17
      scenario: A batch of new annotations
      expect: Each key recorded against the block id that asked for it -- position is the only identity a not-yet-created annotation has
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "carrying out the plan > records the key Zotero gave each new annotation"

    - id: Y14.18
      scenario: Zotero refuses one annotation of a batch
      expect: The created ones are mapped, the refused one is not, and the count says how far it got. The next sync creates it again -- which is safe precisely because nothing is ever deleted (§3.4.3)
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "carrying out the plan > keeps what landed when Zotero refuses one of a batch"

    - id: Y14.25
      scenario: The create call throws something that is not a `ZoteroError`
      expect: Its message is reported and nothing is recorded, so the next sync creates the annotations again. Swallowing it would be a write-back that silently never happened
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "carrying out the plan > reports a failure that is not Zotero's own words, rather than swallowing it"

    - id: Y14.19
      scenario: The desktop app goes away mid-run
      expect: Everything already written is kept and reported. Retrying here would only make the next sync slower -- the client has already honoured whatever wait was asked for
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "carrying out the plan > stops at the first failure and keeps everything before it"

    - id: Y14.20
      scenario: Zotero answers 412 -- the item changed between our read and our write
      expect: The field is handed over, exactly as if the edit had been visible in the read. That window is the user editing it by hand
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "carrying out the plan > hands a field over when Zotero says the item changed under us"

    - id: Y14.21
      scenario: A deletion the user made
      expect: Written into `data.json`, so the next sync does not undo it
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "carrying out the plan > remembers a deletion the user made, so the next sync does not undo it"

    - id: Y14.22
      scenario: A document whose annotations are all up to date
      expect: No request of any kind. A sync of an unchanged document must not touch the user's library
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "carrying out the plan > asks Zotero for nothing when there is nothing to do"

    - id: Y14.23
      scenario: An annotation read from the web, patched
      expect: The patch carries that connection's version and goes back to it. Local and web versions are unrelated -- 246 against 986 for one item -- so the wrong one is either a false conflict or a silent overwrite
      layer: unit
      file: src/zotero-writeback.test.ts
      test: "carrying out the plan > sends a patch back to the connection its version came from"

- feature: Y15
  name: The note a linked document gets
  code: src/zotero-note.ts
  tier: free + Pro
  scenarios:
    - id: Y15.1
      scenario: An item with a first creator, a year and a title
      expect: '`Smith 2024 · Best Practices für Prompting` -- the citation a reader recognises, then what the paper is called'
      layer: unit
      file: src/zotero-note.test.ts
      test: "how the item is named in the note > is the first creator, the year and the title"

    - id: Y15.2
      scenario: A webpage saved without an author, and an item with no date
      expect: The missing part is dropped, not filled in. A source without an author is not "Unknown 2024"; it is its title
      layer: unit
      file: src/zotero-note.test.ts
      test: "how the item is named in the note > drops the parts Zotero does not have rather than filling them in"

    - id: Y15.3
      scenario: An item with no title, no creator and no year
      expect: Its key. A link whose label is empty is a link nobody can see, and the key is at least the thing it opens
      layer: unit
      file: src/zotero-note.test.ts
      test: "how the item is named in the note > falls back to the key for an item with no title at all"

    - id: Y15.4
      scenario: A title carrying square brackets -- `[Preprint]`, `[in press]`
      expect: Escaped. Unescaped, the first `]` closes the link label early and leaves the `zotero://` URL standing in the note as text. Zotero titles carry these routinely
      layer: unit
      file: src/zotero-note.test.ts
      test: "how the item is named in the note > escapes the brackets a Zotero title carries"

    - id: Y15.5
      scenario: A linked document, web connection configured, everything written back, a literature note in the vault
      expect: The §4 sample line, byte for byte -- item link, web link, the write-back date, the literature note
      layer: unit
      file: src/zotero-note.test.ts
      test: "the Zotero line of the ownership callout > is the line of the §4 sample"

    - id: Y15.6
      scenario: A user who has Zotero on the desktop and no API key
      expect: No web link. The zotero.org URL needs a numeric user id we were never told, so the alternative is a guess that 404s for the one person who owns the library
      layer: unit
      file: src/zotero-note.test.ts
      test: "the Zotero line of the ownership callout > offers no web link where the web connection is not configured"

    - id: Y15.7
      scenario: Write-back did not run at all
      expect: '"not written back: <reason>" in place of the date. The note is the only surface left once the sync notice is gone'
      layer: unit
      file: src/zotero-note.test.ts
      test: "the Zotero line of the ownership callout > says why nothing was written back, where nothing was"

    - id: Y15.24
      scenario: The vault has the free half of Zotero (§5)
      expect: '"highlights stay in the vault — writing them into Zotero is Tagged Sync Pro" in place of the date. Says where the highlights are before it says what would move them, so the sentence stays true for a reader who never buys Pro and never reads as an error'
      tier: free
      layer: unit
      file: src/zotero-note.test.ts
      test: "the Zotero line of the ownership callout > says where the highlights are for a vault that has the free half"

    - id: Y15.8
      scenario: Write-back stopped half way through
      expect: Both numbers -- "12 of 30 highlights written back". The reader is otherwise told nothing about the eighteen of their own marks the paper is missing
      layer: unit
      file: src/zotero-note.test.ts
      test: "the Zotero line of the ownership callout > names both numbers for a run that was cut short"

    - id: Y15.9
      scenario: A vault with no note about this paper
      expect: The clause is absent, not empty. "literature note:" with nothing after it reads as a link that went missing
      layer: unit
      file: src/zotero-note.test.ts
      test: "the Zotero line of the ownership callout > says nothing about a literature note where the vault has none"

    - id: Y15.10
      scenario: A ZotLit literature note carrying this item's `zotero-key`
      expect: Pointed at with a wikilink. Found through the frontmatter alone -- the note is never read and never written
      layer: unit
      file: src/zotero-note.test.ts
      test: "the vault's own note about the paper > is the note carrying this item's key"

    - id: Y15.11
      scenario: A literature note that carries only a citekey
      expect: Found by the citekey. Zotero Integration templates commonly write that key and not the item key
      layer: unit
      file: src/zotero-note.test.ts
      test: "the vault's own note about the paper > is found by the citekey where the note carries no item key"

    - id: Y15.12
      scenario: The notes this sync just wrote, which now carry `zotero-key` themselves
      expect: Excluded. Otherwise a document synced under two mapped tags finds its own twin -- or itself -- and prints "literature note" pointing at a generated note
      layer: unit
      file: src/zotero-note.test.ts
      test: "the vault's own note about the paper > is never one of the notes this sync just wrote"

    - id: Y15.13
      scenario: Two notes in the vault carry the same item key
      expect: The lowest path, whatever order they arrive in. Obsidian's cache has no order to promise, and the line must not change from one sync to the next because of it
      layer: unit
      file: src/zotero-note.test.ts
      test: "the vault's own note about the paper > picks the same one of several matches every time"

    - id: Y15.14
      scenario: An item with no citekey, and a note with no citekey
      expect: 'No match. `null === null` would otherwise make every keyless note the literature note of every keyless item -- the same absent-value trap as the hash row of §2.3'
      layer: unit
      file: src/zotero-note.test.ts
      test: "the vault's own note about the paper > never takes two missing citekeys for a match"

