    - id: Y16.6
      scenario: The frontmatter backfill pass, which never asks Zotero
      expect: Both lines left exactly as they stand. Absent means "I do not know"; read as "no link" it would strip the key off every linked note in the vault until each document's next real sync put it back
      layer: unit
      file: src/frontmatter.test.ts
      test: "the two Zotero keys > leaves both alone for a caller that does not know"

    - id: Y16.7
      scenario: The Pro frontmatter toggle is switched off
      expect: '`zotero-key` goes with the plugin''s own keys; `citekey` stays, like every other user line'
      layer: unit
      file: src/frontmatter.test.ts
