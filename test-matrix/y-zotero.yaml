      expect: 'Cut to 120 (§2.4)'
      layer: unit
      file: src/zotero-send.test.ts
      test: 'what the document is called on the tablet > cuts a very long title at 120 characters'

    - id: Y19.6
      scenario: 'A title of emoji'
      expect: 'Cut between code points. A cut through a surrogate pair leaves half a character in the tablet''s file list'
      layer: unit
      file: src/zotero-send.test.ts
      test: 'what the document is called on the tablet > cuts between characters, never through one'

    - id: Y19.7
      scenario: 'Any document at all'
      expect: 'No key suffix and no marker of ours (§2.4). The tablet''s file list is the reader''s; what makes the document findable again is the link in `data.json`'
      layer: unit
      file: src/zotero-send.test.ts
      test: 'what the document is called on the tablet > carries no key, no marker and nothing else of ours'

    - id: Y19.8
      scenario: 'An item with one PDF'
      expect: 'That one, with no question asked'
      layer: unit
      file: src/zotero-send.test.ts
      test: 'which PDF of an item is meant > is the only one, where there is only one'

    - id: Y19.9
      scenario: 'An item with two PDFs -- a preprint beside the published version'
      expect: 'A question (§2.4). The one the reader annotates is the one the highlights go back onto, and the two do not have the same pages'
      layer: unit
      file: src/zotero-send.test.ts
      test: 'which PDF of an item is meant > is a question where an item has two'

    - id: Y19.10
      scenario: 'An item whose attachments all belong to something else'
      expect: 'Nothing to send. The picker says so rather than sending someone else''s paper'
      layer: unit
      file: src/zotero-send.test.ts
      test: 'which PDF of an item is meant > is nothing for an item whose attachments are all somebody else''s'

    - id: Y19.15
      scenario: 'A vault with both the cloud and a paired tablet'
      expect: 'The cloud. Not about speed: the SSH route ends in a restart of the tablet''s reading app, which closes whatever the reader has open'
      layer: unit
      file: src/zotero-send.test.ts
      test: 'which route the send takes > is the cloud wherever there is one, even with a paired tablet'

    - id: Y19.16
      scenario: 'A vault with only a paired tablet'
      expect: 'The tablet'
      layer: unit
      file: src/zotero-send.test.ts
      test: 'which route the send takes > is the tablet for a vault that has only that'

    - id: Y19.17
      scenario: 'A vault with neither'
      expect: 'Nothing, and the command says so in the spec''s own words'
      layer: unit
      file: src/zotero-send.test.ts
      test: 'which route the send takes > is nothing for a vault with neither'

    - id: Y19.18
      scenario: A linked document the last sync's listing found
      expect: Counted as still on the tablet. §2.5 needs that answer before it can offer *Send another copy*, and the last sync's listing is the cheapest place it exists -- listing the account costs a round trip on the cloud and a full index-and-hash pass over SSH, in front of a person who pressed Send. Judged by the listing and not by the index rows since 2026-09-13, because a document sent without a sync tag never earns a row
      layer: unit
      file: src/zotero-send.test.ts
      test: "what is still on the tablet > counts a document the last listing found"

    - id: Y19.19
      scenario: A linked document a listing found once and the last listing missed
      expect: "Not counted: that is a document leaving the tablet, and §2.5 then replaces the mapping rather than asking. Deleted today means back on the next sync, not tomorrow (asked in the desk test of 2026-09-13)"
      layer: unit
      file: src/zotero-send.test.ts
      test: "what is still on the tablet > does not count one a listing has missed since -- that is a document that left the tablet"

    - id: Y19.20
      scenario: A paper sent within the day, and no listing has found its document yet
      expect: "Counted, so the user is asked. Without this rule the first copy reads as vanished, its link is dropped, and two documents on the tablet share one mapping between them. Seen live 2026-09-12: a listing five seconds after an upload did not have the document -- the cloud's root lagged -- and counting by 'sent since the last sync' put a second copy on the tablet per run"
      layer: unit
      file: src/zotero-send.test.ts
      test: "what is still on the tablet > counts one that was sent and no listing has found yet, for a day"

    - id: Y19.22
      scenario: A paper sent more than a day ago that no listing has ever found
      expect: "Not counted any more. Otherwise a document deleted on the tablet before any listing caught it stays present for good and the tag-driven send never brings the paper back. A day rather than an hour, because a cloud send read back over SSH turns up only when the tablet next pulls from the cloud"
      layer: unit
      file: src/zotero-send.test.ts
      test: "what is still on the tablet > lets go of one that no listing has found in a day"

    - id: Y19.24
      scenario: A sync's listing, laid over the links -- one found, one found before and missing now, one sent minutes ago and not found, one gone that is back, one gone and still missing, one declined question
      expect: "`seenAt` stamped on the found one; `goneAt` stamped on the one that was found before; the fresh send left alone (the day's grace, Y19.20, is its answer); the returned one seen again with `goneAt` cleared; the one already gone keeps its first miss; the declined marker is not a link and is left as it is. Every document the listing had, tagged or not, and no link added or dropped"
      layer: unit
      file: src/zotero-send.test.ts
      test: "what is still on the tablet > records what a listing found, what it has stopped finding, and what came back"

