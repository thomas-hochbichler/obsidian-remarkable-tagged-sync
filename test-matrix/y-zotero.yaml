# The three entry points a person reaches, and the wiring under them. Y29 is where the decisions are
# -- what Send refuses, what it asks, what it records -- and Y30 is the one thing a unit test of Y29
# cannot say: that `main.ts` hands those decisions the real plugin's licence, settings, transports
# and clock. A host wired to the wrong thing passes every Y29 row and ships a command that does
# nothing.
#
# The load-bearing rows are Y29.1 (a free vault registers nothing at all, §5) and Y29.13/Y29.14 (a
# second copy is offered and never assumed -- nothing already on the tablet is ever touched, §1.2).

- feature: Y29
