# The wiring (spec §3.4, §5). Three features, and the order between them is the whole of §3.4.1: the
# note is on disk before anything here talks to Zotero, so every way a library can fail costs the
# Zotero part of one note and nothing else. Y25 is the policy, Y28 is where the run puts it, and Y26
# and Y27 are the two places a person is asked something.
#
# The load-bearing rows are Y28.2 (the second write's hash is the row's, or the next sync reads the
# plugin's own write as a hand edit and never touches the note again) and Y28.8 (a lapsed licence
# keeps the frontmatter keys, because "I do not know" and "not linked" are different answers).

- feature: Y25
  name: The Zotero half of a sync
  code: src/zotero-sync.ts
  tier: free + Pro
  scenarios:
    - id: Y25.1
      scenario: A linked document whose highlights write back cleanly
      expect: The callout line of §4 -- the paper, the web library, and the date it was written back
      layer: unit
      file: src/zotero-sync.test.ts
      test: "what the pass does for one written note > names the paper, links the web library and dates the write-back"

    - id: Y25.2
      scenario: The same document's quotes
      expect: One `zotero://open-pdf` link per written highlight, on the physical page and the annotation Zotero handed back
      layer: unit
      file: src/zotero-sync.test.ts
      test: "what the pass does for one written note > gives every written highlight its in-Zotero link"

    - id: Y25.3
      scenario: The note's frontmatter
      expect: The **item's** key and citekey, never the attachment's. `zotero-key` is the vocabulary ZotLit and Zotero Integration write, and it names the paper there
      layer: unit
      file: src/zotero-sync.test.ts
      test: "what the pass does for one written note > hands back the two frontmatter keys of the item, not of the attachment"

    - id: Y25.4
      scenario: What is stored after a write-back
      expect: The annotation map, per block id. Without it the next sync creates a second copy of every highlight in the user's library
      layer: unit
      file: src/zotero-sync.test.ts
      test: "what the pass does for one written note > remembers what it wrote, so the next sync refreshes rather than duplicates"

    - id: Y25.5
      scenario: A vault talking only to the Zotero desktop app
      expect: No web-library link. The desktop connection knows the user id, but a vault that never talks to zotero.org has no business printing a zotero.org URL into a note (§4)
      layer: unit
      file: src/zotero-sync.test.ts
      test: "what the pass does for one written note > leaves out the web link for a vault that only talks to the desktop app"

    - id: Y25.6
      scenario: A vault holding both a literature note about the paper and our own note about it
      expect: The literature note. Our own notes now carry `zotero-key` too, so the note just written is excluded by path -- otherwise a note would point at its own twin and call it the user's
      layer: unit
      file: src/zotero-sync.test.ts
      test: "what the pass does for one written note > points at the vault's own note about the paper, and never at one of ours"

    - id: Y25.7
      scenario: A standalone PDF that hangs under no bibliographic item
      expect: The attachment stands in for the item -- its title in the line, its own key as `zotero-key`. In Zotero it *is* the item, and `zotero://select` opens it
      layer: unit
      file: src/zotero-sync.test.ts
      test: "what the pass does for one written note > stands the attachment in for a standalone PDF that hangs under no item"

    - id: Y25.8
      scenario: An unlinked document whose bytes hash to exactly one attachment
      expect: Linked without asking, and the note says "matched by file hash". Identity, not resemblance (§2.3)
      layer: unit
      file: src/zotero-sync.test.ts
      test: "matching a document nobody has linked > links it silently when one attachment has exactly these bytes, and says so in the note"

    - id: Y25.9
      scenario: The same file attached to two items
      expect: The picker, once, with both candidates and the evidence; the answer is stored
      layer: unit
      file: src/zotero-sync.test.ts
      test: "matching a document nobody has linked > asks once when the same file hangs under two items, and remembers the answer"

    - id: Y25.10
      scenario: The note after the user answered that picker
      expect: No "matched by file hash". The clause discloses a decision the plugin made alone, and this one was the user's
      layer: unit
      file: src/zotero-sync.test.ts
      test: "matching a document nobody has linked > does not claim the answer as its own: a link the user chose says nothing about a hash"

    - id: Y25.11
      scenario: The user closes the picker without answering
      expect: Remembered as declined. Without it the same picker opens on every sync, for somebody who has already decided
      layer: unit
      file: src/zotero-sync.test.ts
      test: "matching a document nobody has linked > remembers a picker the user closed, so the question is asked once and not every sync"

    - id: Y25.12
      scenario: The same ambiguity during a background sync
      expect: Nothing is asked **and** nothing is remembered. A refusal recorded on the user's behalf would spend the one question §2.3 allows on a run nobody was watching
      layer: unit
      file: src/zotero-sync.test.ts
      test: "matching a document nobody has linked > never asks in a background run, and never records a refusal the user did not make"

    - id: Y25.13
      scenario: A document already declined
      expect: Not asked again, and its bytes are never read -- hashing a file to answer a question nobody will be asked is the cost this skip avoids
      layer: unit
      file: src/zotero-sync.test.ts
      test: "matching a document nobody has linked > asks nothing again about a document that was already declined, and reads no bytes for it"

    - id: Y25.14
      scenario: A document that is already linked
      expect: Never re-matched, so never re-hashed. Re-matching would undo a correction the user made by hand the moment the library grew a second file with that name
      layer: unit
      file: src/zotero-sync.test.ts
      test: "matching a document nobody has linked > never hashes a document it is already linked to"

    - id: Y25.15
      scenario: A document nothing in the library matches
      expect: 'No line, no links, and `zoteroKey: null` -- which removes the key. "Not linked" is an answer, unlike "I could not ask"'
      layer: unit
      file: src/zotero-sync.test.ts
      test: "matching a document nobody has linked > leaves a note with no Zotero part alone, and takes the key off it"

    - id: Y25.16
      scenario: A run that writes several notes
      expect: One library listing for the whole run. It is the matcher's entire input and the most expensive thing this feature does; per document it would make a twenty-note sync twenty times as slow at it
      layer: unit
      file: src/zotero-sync.test.ts
      test: "matching a document nobody has linked > reads the library once however many notes the run writes"

    - id: Y25.17
      scenario: Zotero unreachable while the write-back runs
      expect: 'The note still names the paper and carries `not written back: <reason>`; the run gets a sentence naming the document. §3.4.2 -- skipped, and said out loud'
      layer: unit
      file: src/zotero-sync.test.ts
      test: "when Zotero says no > keeps the note's own identity and says in one clause why its marks are not there yet"

    - id: Y25.24
      scenario: A free vault's pass over a linked document (§5)
      expect: 'The note names the paper, keeps its keys and carries the free clause; no `in Zotero` links; no notice. Not one write-shaped request reaches Zotero -- not even the listing of our own annotations, which is the call that needs a write-capable key'
      tier: free
      layer: unit
      file: src/zotero-sync.test.ts
      test: "in a vault that has the free half > names the paper, writes nothing, and says where the highlights are"

    - id: Y25.18
      scenario: Zotero refuses some of a batch
      expect: '"N of M highlights written, retry on next sync" in both the note and the run. Add-and-refresh means nothing needs rolling back'
      layer: unit
      file: src/zotero-sync.test.ts
      test: "when Zotero says no > reports a half-written run in both numbers, and keeps the keys it did get"

    - id: Y25.19
      scenario: The attachment has been trashed or deleted in Zotero
      expect: '"Zotero: item no longer found", no write-back, and the frontmatter keys left **absent** rather than removed -- the user may put the item back, and the key is the only record of what the document was'
      layer: unit
      file: src/zotero-sync.test.ts
      test: "when Zotero says no > keeps the note and drops the Zotero part when the attachment is gone from the library"

    - id: Y25.20
      scenario: Anything at all throws -- the listing, the picker, the save
      expect: Never propagates. The note is already written; this costs its Zotero part and the run hears one sentence
      layer: unit
      file: src/zotero-sync.test.ts
      test: "when Zotero says no > never throws, whatever the library does, and leaves the note's keys where they are"

    - id: Y25.21
      scenario: Each of the seven ways Zotero can say no
      expect: A distinct sentence, about Zotero rather than about us. The note is read months later by somebody asking whether their marks are in their library
      layer: unit
      file: src/zotero-sync.test.ts
      test: "what a failure is called > has a sentence for every way Zotero can say no"

    - id: Y25.22
      scenario: A failure that is not a Zotero failure at all
      expect: Its own message, kept
      layer: unit
      file: src/zotero-sync.test.ts
      test: "what a failure is called > keeps the message of anything that is not a Zotero failure at all"

    - id: Y25.23
      scenario: Several documents skipped in one run
      expect: 'Both sentences name the document. Two bare "Zotero: 3 of 7" lines in one run are unreadable'
      layer: unit
      file: src/zotero-sync.test.ts
      test: "what a failure is called > names the document in both sentences the run raises"

- feature: Y26
  name: Which paper is this?
