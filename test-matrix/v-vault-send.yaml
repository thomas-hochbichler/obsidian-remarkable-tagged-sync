- feature: V4
  name: The record of a send -- which tablet documents the vault sent, and from which file
  code: src/vault-sends.ts
  tier: free
  scenarios:
    - id: V4.1
      scenario: A send with every field of spec §5 is written and read back
      expect: Exactly what was stored
      layer: unit
      file: src/vault-sends.test.ts
      test: "reading a send > reads back exactly what was stored, every field of spec §5"

    - id: V4.2
      scenario: Nothing is stored for the document
      expect: Null, never a throw
      layer: unit
      file: src/vault-sends.test.ts
      test: "reading a send > answers null for nothing stored"

    - id: V4.3
      scenario: The entry is a string
      expect: No send is read, and nothing throws
      layer: unit
      file: src/vault-sends.test.ts
      test: "reading a send > answers null for a string"

    - id: V4.4
      scenario: The entry is an array
      expect: No send is read, and nothing throws
      layer: unit
      file: src/vault-sends.test.ts
      test: "reading a send > answers null for an array"

    - id: V4.5
      scenario: The entry is null
      expect: No send is read, and nothing throws
      layer: unit
      file: src/vault-sends.test.ts
      test: "reading a send > answers null for null"

    - id: V4.6
      scenario: The entry has no origin
      expect: Null -- origin, kind and send time are what make an entry a send
      layer: unit
      file: src/vault-sends.test.ts
      test: "reading a send > answers null for an entry without an origin"

    - id: V4.7
      scenario: The entry names a kind this build does not send, written by a newer one
      expect: Null, and the entry stays in the map
      layer: unit
      file: src/vault-sends.test.ts
      test: "reading a send > answers null for a kind this build does not know"

    - id: V4.8
      scenario: The send time does not parse
      expect: Null -- a time nobody can compare decides no lifetime
      layer: unit
      file: src/vault-sends.test.ts
      test: "reading a send > answers null for a send time that is no time"

    - id: V4.9
      scenario: An entry's name or folder id is unreadable
      expect: Read without them, so the "untouched" test of spec §3 cannot pass and the copy counts as the user's -- the safe side
      layer: unit
      file: src/vault-sends.test.ts
      test: "reading a send > reads an entry that lost its name or folder, without them -- the copy then counts as the user's"

    - id: V4.10
      scenario: The promoted-tag list holds things that are not strings
      expect: Only the strings are read
      layer: unit
      file: src/vault-sends.test.ts
      test: "reading a send > keeps only the strings of a promoted-tag list"

    - id: V4.11
      scenario: Is a document covered by the record
      expect: Yes for a document the vault sent, no for any other -- the one test behind "is this copy ours" and "one note for the whole document"
      layer: unit
      file: src/vault-sends.test.ts
      test: "what the record covers > covers a document the vault sent, and no other"

    - id: V4.12
      scenario: The document's entry was written by an install this build cannot read
      expect: Covered all the same. Read as a stranger, one document would give page notes on this machine and one note on the other
      layer: unit
      file: src/vault-sends.test.ts
      test: "what the record covers > covers a document whose entry this build cannot read"

    - id: V4.13
      scenario: A document id that is a key of Object's prototype
      expect: Not covered -- only the map's own entries count
      layer: unit
      file: src/vault-sends.test.ts
      test: "what the record covers > does not take a key of the map's prototype for an entry"

    - id: V4.14
      scenario: The record holds two copies of one origin, one of another, and an unreadable entry naming the same path
      expect: The two copies, oldest first; nothing else
      layer: unit
      file: src/vault-sends.test.ts
      test: "what the record covers > finds every earlier copy of one origin, oldest first, and nothing of another"

    - id: V4.15
      scenario: An entry carries a field a newer build wrote, and this build writes the entry
      expect: The unknown field survives the write
      layer: unit
      file: src/vault-sends.test.ts
      test: "writing a send > carries the fields a newer build wrote on the same entry"

    - id: V4.16
      scenario: Another entry is written beside one this build cannot read
      expect: The unreadable entry stays exactly as it was
      layer: unit
      file: src/vault-sends.test.ts
      test: "writing a send > leaves an entry it cannot read where it is when another is written"

    - id: V4.17
      scenario: A send is written
      expect: A new map; the one handed in is untouched
      layer: unit
      file: src/vault-sends.test.ts
      test: "writing a send > does not write through the map it was given"

    - id: V4.18
      scenario: A sync's listing finds a sent document
      expect: Marked seen
      layer: unit
      file: src/vault-sends.test.ts
      test: "what a sync listing says (spec §5) > marks a listed copy seen"

    - id: V4.19
      scenario: A sync's listing misses a document no listing has found yet
      expect: Neither seen nor gone -- the listing lags the upload (seen live 2026-09-12)
      layer: unit
      file: src/vault-sends.test.ts
      test: "what a sync listing says (spec §5) > leaves a copy no listing has found yet alone -- the listing lags the upload"

    - id: V4.20
      scenario: A listing misses a document an earlier listing found
      expect: Marked gone at that time
      layer: unit
      file: src/vault-sends.test.ts
      test: "what a sync listing says (spec §5) > marks a copy gone once a listing misses it after having found it"

    - id: V4.21
      scenario: A later listing misses a document already marked gone
      expect: The first miss stays the time it went, so the 30 days are not pushed back
      layer: unit
      file: src/vault-sends.test.ts
      test: "what a sync listing says (spec §5) > keeps the first miss as the time it went"

    - id: V4.22
      scenario: A document marked gone is listed again
      expect: The gone mark is taken off and it is seen -- restored from the tablet's trash
      layer: unit
      file: src/vault-sends.test.ts
      test: "what a sync listing says (spec §5) > takes the gone mark off a copy that turns up again -- restored from the trash"

    - id: V4.23
      scenario: A listing runs over an entry this build cannot read
      expect: Untouched
      layer: unit
      file: src/vault-sends.test.ts
      test: "what a sync listing says (spec §5) > leaves an entry it cannot read untouched"

    - id: V4.24
      scenario: No listing has found a sent copy yet, 23 hours and then 24 hours after the send
      expect: Still on the tablet inside the day's grace, not after it -- the grace a Zotero send gets
      layer: unit
      file: src/vault-sends.test.ts
      test: "what a sync listing says (spec §5) > is still on the tablet a day after the send while no listing has found it, and not after"

    - id: V4.25
      scenario: A copy was seen long ago, or was marked gone
      expect: On the tablet while seen, however long ago; not once gone
      layer: unit
      file: src/vault-sends.test.ts
      test: "what a sync listing says (spec §5) > is on the tablet once seen, however long ago, and not once gone"

    - id: V4.26
      scenario: A gone copy's entry, an hour short of 30 days later
      expect: Kept, so a copy restored from the trash inside the month is still the vault's own (§11 P5)
      layer: unit
      file: src/vault-sends.test.ts
      test: "how long an entry lives (spec §11 P5) > keeps a gone copy for 30 days, so one restored from the trash is still the vault's own"

    - id: V4.27
      scenario: A gone copy's entry, 30 days after it went
      expect: Dropped
      layer: unit
      file: src/vault-sends.test.ts
      test: "how long an entry lives (spec §11 P5) > drops it 30 days after it went"

    - id: V4.28
      scenario: A copy still listed, a year after its send
      expect: Kept -- only absence ages an entry
      layer: unit
      file: src/vault-sends.test.ts
      test: "how long an entry lives (spec §11 P5) > keeps a copy that is still on the tablet, however old its send"

    - id: V4.29
      scenario: A copy no listing ever found, short of and at 30 days after the send
      expect: Kept, then dropped. It never earns a gone mark, so its age is counted from the send
      layer: unit
      file: src/vault-sends.test.ts
      test: "how long an entry lives (spec §11 P5) > drops a copy no listing ever found 30 days after its send -- it never earns a gone mark"

    - id: V4.30
      scenario: An unreadable entry carries old dates
      expect: Never dropped -- it has no date this build can trust
      layer: unit
      file: src/vault-sends.test.ts
      test: "how long an entry lives (spec §11 P5) > never drops an entry it cannot read -- it has no date to trust"

    - id: V4.31
      scenario: The origin is renamed
      expect: The entry names the new path
      layer: unit
      file: src/vault-sends.test.ts
      test: "following the origin through renames (spec §5) > follows a renamed origin"

    - id: V4.32
      scenario: A folder with two origins below it, one nested, is renamed; a sibling folder's name starts the same
      expect: Both origins below it follow; the sibling's does not
      layer: unit
      file: src/vault-sends.test.ts
      test: "following the origin through renames (spec §5) > follows every origin below a renamed folder, and only those"

    - id: V4.33
      scenario: Some other file is renamed
      expect: Null, which is how the caller learns not to write data.json
      layer: unit
      file: src/vault-sends.test.ts
      test: "following the origin through renames (spec §5) > answers null for a rename of something else"

    - id: V4.34
      scenario: An entry this build cannot otherwise read names an origin under a renamed folder
      expect: Its origin follows and the rest of it stays -- whichever install reads it later finds the path current
      layer: unit
      file: src/vault-sends.test.ts
      test: "following the origin through renames (spec §5) > moves the origin of an entry it cannot otherwise read, and keeps the rest of it"

    - id: V4.35
      scenario: A rename meets an entry that is no record at all
      expect: Left exactly as it was
      layer: unit
      file: src/vault-sends.test.ts
      test: "following the origin through renames (spec §5) > leaves an entry without an origin where it is"

    - id: V4.36
      scenario: A sync hands back marks for a document whose origin was renamed meanwhile
      expect: The marks are set on the live entry; the new origin and unknown fields stay
      layer: unit
      file: src/vault-sends.test.ts
      test: "what a sync hands back (spec §5) > sets the marks on the live entry and keeps everything else on it"

    - id: V4.37
      scenario: A send was recorded while the sync ran
      expect: It is still in the map after the marks are applied
      layer: unit
      file: src/vault-sends.test.ts
      test: "what a sync hands back (spec §5) > keeps a send recorded while the sync ran"

    - id: V4.38
      scenario: A sync hands back marks for a document that has no entry by then
      expect: No entry is made -- marks describe a send, they do not make one
      layer: unit
      file: src/vault-sends.test.ts
      test: "what a sync hands back (spec §5) > makes no entry for a document that has none by then"


- feature: V5
  name: A second send -- what the earlier copy is now, and the trash
  code: src/cloud-send.ts
  tier: free
  scenarios:
    - id: V5.1
      scenario: An upload goes into a folder that was there, and into one it made
      expect: The answer names that folder's id either way -- the record keeps it, and a copy is untouched only while it is still in it
      layer: unit
      file: src/cloud-send.test.ts
      test: "the cloud's Zotero folder > is named in the answer, whether it was there or made"

    - id: V5.30
      scenario: A vault send hands the upload the folder id its look just found
      expect: The document goes into that folder; the account is not listed again and no folder is made -- one listing per send, not two (~7 s in Obsidian)
      layer: unit
      file: src/cloud-send.test.ts
      test: "the cloud's Zotero folder > is the one a look handed in, without listing the account again"

    - id: V5.31
      scenario: The look's listing holds the send folder twice, nested folders of that name, or none
      expect: The lowest top-level id, the one the upload's own lookup would pick; nothing where there is no such folder, so the upload makes it as before
      layer: unit
      file: src/cloud-send.test.ts
      test: "the send folder as the look found it (ticket 16: one listing per vault send) > is named by its id -- the lowest of two, as the upload would pick -- and not at all where the account has none"

    - id: V5.2
      scenario: The earlier copy is listed where and as what it was sent, unpinned, with no tag, no page tag and no .rm file
      expect: Untouched, with the listing's id and hash; exactly one listing, one getContent and one getEntries were made
      layer: unit
      file: src/cloud-send.test.ts
      test: "what an earlier copy of a vault send is now (send spec §3) > is untouched where the listing, the page tags and the files all say nobody was there"

    - id: V5.3
      scenario: The listing does not show the copy -- sent a minute ago, or deleted on the tablet
      expect: Gone, and nothing but the listing was asked
      layer: unit
      file: src/cloud-send.test.ts
      test: "what an earlier copy of a vault send is now (send spec §3) > is gone when the listing does not show it"

    - id: V5.4
      scenario: One copy is in the trash, another in a folder that is
      expect: Both gone, nothing but the listing asked
      layer: unit
      file: src/cloud-send.test.ts
      test: "what an earlier copy of a vault send is now (send spec §3) > is gone when it is in the trash, or in a folder that is"

    - id: V5.5
      scenario: The copy was moved to another folder
      expect: The user's, and no getContent or getEntries -- the listing already said so
      layer: unit
      file: src/cloud-send.test.ts
      test: "what an earlier copy of a vault send is now (send spec §3) > is the user's when moved to another folder, and the tablet is not asked anything more"

    - id: V5.6
      scenario: The copy was moved to the top level
      expect: The user's, and nothing more asked
      layer: unit
      file: src/cloud-send.test.ts
      test: "what an earlier copy of a vault send is now (send spec §3) > is the user's when moved to the top level, and the tablet is not asked anything more"

    - id: V5.7
      scenario: The copy was renamed on the tablet
      expect: The user's (P16), and nothing more asked
      layer: unit
      file: src/cloud-send.test.ts
      test: "what an earlier copy of a vault send is now (send spec §3) > is the user's when renamed (P16), and the tablet is not asked anything more"

    - id: V5.8
      scenario: The copy was pinned
      expect: The user's (P16), and nothing more asked
      layer: unit
      file: src/cloud-send.test.ts
      test: "what an earlier copy of a vault send is now (send spec §3) > is the user's when pinned (P16), and the tablet is not asked anything more"

    - id: V5.9
      scenario: The document carries a tag, mapped to a folder or not
      expect: The user's -- a tag is something the user did -- and nothing more asked
      layer: unit
      file: src/cloud-send.test.ts
      test: "what an earlier copy of a vault send is now (send spec §3) > is the user's when tagged, mapped or not, and the tablet is not asked anything more"

    - id: V5.10
      scenario: The document's tags come in the legacy shape, plain strings
      expect: The user's all the same
      layer: unit
      file: src/cloud-send.test.ts
      test: "what an earlier copy of a vault send is now (send spec §3) > is the user's when tagged in the legacy shape, and the tablet is not asked anything more"

    - id: V5.11
      scenario: Only a page carries a tag
      expect: The user's after one getContent; the file list is not asked for
      layer: unit
      file: src/cloud-send.test.ts
      test: "what an earlier copy of a vault send is now (send spec §3) > is the user's when a page carries a tag, which costs no file list"

    - id: V5.28
      scenario: The copy's .content has no page-tag list
      expect: No page tag -- untouched, the other tests passing
      layer: unit
      file: src/cloud-send.test.ts
      test: "what an earlier copy of a vault send is now (send spec §3) > reads no page-tag list as no page tag"

    - id: V5.29
      scenario: The copy's .content has a null page-tag list
      expect: No page tag, the same
      layer: unit
      file: src/cloud-send.test.ts
      test: "what an earlier copy of a vault send is now (send spec §3) > reads a null page-tag list as no page tag"

    - id: V5.12
      scenario: A page has an .rm file -- ink, a highlight, or ink erased again
      expect: The user's. Erased ink cannot be told from ink, and the error falls on the side of asking
      layer: unit
      file: src/cloud-send.test.ts
      test: "what an earlier copy of a vault send is now (send spec §3) > is the user's when any page has an .rm file, erased ink included"

    - id: V5.13
      scenario: The record's entry has no folder id
      expect: The user's, nothing more asked -- nothing can vouch for a copy whose place is unknown
      layer: unit
      file: src/cloud-send.test.ts
      test: "what an earlier copy of a vault send is now (send spec §3) > is the user's when the record lost its folder, and the tablet is not asked anything more"

    - id: V5.14
      scenario: The record's entry has no name
      expect: The user's, nothing more asked
      layer: unit
      file: src/cloud-send.test.ts
      test: "what an earlier copy of a vault send is now (send spec §3) > is the user's when the record lost its name, and the tablet is not asked anything more"

    - id: V5.15
      scenario: Three earlier copies -- one gone, one untouched, one renamed
      expect: One listing for all of them, answered in the order asked
      layer: unit
      file: src/cloud-send.test.ts
      test: "what an earlier copy of a vault send is now (send spec §3) > is looked at in one listing for several copies, answered in the order asked"

    - id: V5.16
      scenario: The send folder holds a document of the new one's name that the vault did not send from this origin
      expect: Reported as a stranger, never classed, never looked into -- the new one lands beside it
      layer: unit
      file: src/cloud-send.test.ts
      test: "a document of the same name in the send folder that the vault did not send there (send spec §3) > is reported and never classed or looked into"

    - id: V5.17
      scenario: The only same-named document in the folder is this origin's own copy, pinned
      expect: No stranger -- an earlier copy is never one, whatever its state
      layer: unit
      file: src/cloud-send.test.ts
      test: "a document of the same name in the send folder that the vault did not send there (send spec §3) > is never one of this origin's own copies, whatever state they are in"

    - id: V5.32
      scenario: The only same-named document in the folder is a copy the user chose to keep, handed to the look by id only (ticket 25)
      expect: No stranger, and the kept copy is not classed or looked into (P15) -- one listing, nothing more
      layer: unit
      file: src/cloud-send.test.ts
      test: "a document of the same name in the send folder that the vault did not send there (send spec §3) > is never a copy the user chose to keep, which is not looked into either"

    - id: V5.18
      scenario: Same-named documents sit in another folder, in a second folder of the send folder's name, in the trash, and in an account without the folder
      expect: No stranger in any of them -- only the folder the new one goes into counts
      layer: unit
      file: src/cloud-send.test.ts
      test: "a document of the same name in the send folder that the vault did not send there (send spec §3) > is looked for only in the folder the new one goes into"

    - id: V5.19
      scenario: The listing throws
      expect: The whole look rejects; the send (16) goes on and clears nothing (P17)
      layer: unit
      file: src/cloud-send.test.ts
      test: "a look that fails (send spec §3, P17) > rejects as a whole when listItems throws"

    - id: V5.20
      scenario: getContent throws
      expect: The whole look rejects -- never one copy classed and another not
      layer: unit
      file: src/cloud-send.test.ts
      test: "a look that fails (send spec §3, P17) > rejects as a whole when getContent throws"

    - id: V5.21
      scenario: getEntries throws
      expect: The whole look rejects
      layer: unit
      file: src/cloud-send.test.ts
      test: "a look that fails (send spec §3, P17) > rejects as a whole when getEntries throws"

    - id: V5.22
      scenario: An untouched copy is cleared
      expect: One delete with the look's id and hash, the copy's parent is the trash, nothing else called -- no move, no purge
      layer: unit
      file: src/cloud-send.test.ts
      test: "moving an earlier copy to the tablet's trash (ADR 0001) > moves exactly the copy the look listed, by its id and hash, and calls nothing else"

    - id: V5.23
      scenario: The copy changed between the look and the clearing, so rmapi-js answers HashNotFoundError (F11, against the fake)
      expect: Not cleared, and the copy is where it was with its new hash
      layer: unit
      file: src/cloud-send.test.ts
      test: "moving an earlier copy to the tablet's trash (ADR 0001) > leaves a copy that changed since the look where it is, and says it was not cleared"

    - id: V5.24
      scenario: The move fails for another reason
      expect: The error reaches the caller unchanged
      layer: unit
      file: src/cloud-send.test.ts
      test: "moving an earlier copy to the tablet's trash (ADR 0001) > hands every other failure to the caller unchanged"

    - id: V5.25
      scenario: Somebody adds a member to the cloud send's API type -- a move, a purge, a rename
      expect: The type check fails; the type is the upload's three calls, getContent, raw.getEntries and delete, and nothing more
      layer: unit
      file: src/cloud-send.test.ts
      test: "what a send may ask of the cloud > is the upload's three calls, the look's two reads and the trash, and nothing more"

    - id: V5.26
      scenario: A send over SSH goes into a folder that was there, and into one it made
      expect: The answer names that folder's id, as over the cloud
      tier: pro
      layer: unit
      file: src/ssh-send.test.ts
      test: "putting a PDF on the tablet > names the folder it put the document into, whether it was there or made"

    - id: V5.27
      scenario: The SSH transport is asked what it can do for a second send
      expect: Neither a look nor a trash -- over SSH a vault send only adds (05 #12)
      tier: pro
      layer: unit
      file: src/ssh-transport.test.ts
      test: "sending a PDF over SSH > has no look at earlier copies and no trash"

- feature: V6
  name: The tablet a note is printed for, and the guess at it
  code: src/vault-send-settings.ts
  tier: free
  scenarios:
    - id: V6.1
      scenario: The user picked a tablet, and the synced pages declared the other one
      expect: The pick
      layer: unit
      file: src/vault-send-settings.test.ts
      test: "the tablet a note is printed for > is the user's pick, whatever the synced pages said"

    - id: V6.2
      scenario: No pick, a Paper Pro's pages seen
      expect: Paper Pro
      layer: unit
      file: src/vault-send-settings.test.ts
      test: "the tablet a note is printed for > is the screen last seen until the user picks"

    - id: V6.3
      scenario: No pick, nothing seen
      expect: The reMarkable 1, 2 or Paper Pure page (06 #1)
      layer: unit
      file: src/vault-send-settings.test.ts
      test: "the tablet a note is printed for > is the reMarkable 1, 2 or Paper Pure page while nothing has been seen"

    - id: V6.4
      scenario: A document's pages carry scene_info, one of them a reMarkable 2's, one a Paper Pro's screen; its lastModified in milliseconds or ISO
      expect: That tablet, at the document's time as ISO
      layer: unit
      file: src/vault-send-settings.test.ts
      test: "the screen a synced document declares > names the tablet its pages were written on, at the document's last change"

    - id: V6.5
      scenario: Pages without scene_info, a page with none at all, a Paper Pro Move's screen
      expect: Nothing -- the Move stays at 1/2, the entry 06 #1 advises for it
      layer: unit
      file: src/vault-send-settings.test.ts
      test: "the screen a synced document declares > is nothing for pages that declare no screen, or one no known tablet has"

    - id: V6.6
      scenario: A declaring document whose lastModified is missing or unreadable
      expect: Nothing -- a declaration that cannot be placed in time could not be told from an older one
      layer: unit
      file: src/vault-send-settings.test.ts
      test: "the screen a synced document declares > is nothing when the document's time cannot be read"

    - id: V6.7
      scenario: The first declaration arrives
      expect: Remembered as tabletSeen with its time
      layer: unit
      file: src/vault-send-settings.test.ts
      test: "remembering the screen seen > takes the first declaration"

    - id: V6.8
      scenario: A newer document declares the other tablet
      expect: It replaces the one held -- the newest is the device in use (§11 P6)
      layer: unit
      file: src/vault-send-settings.test.ts
      test: "remembering the screen seen > replaces it with a newer document's"

    - id: V6.9
      scenario: An older document declares the other tablet, in either order
      expect: The newer one stays -- two tablets on one account never flip the guess
      layer: unit
      file: src/vault-send-settings.test.ts
      test: "remembering the screen seen > never lets an older document's declaration replace a newer one's"

    - id: V6.10
      scenario: Two declarations at the same time, and a sync that declared nothing
      expect: The one held stays; nothing declared changes nothing (the same object)
      layer: unit
      file: src/vault-send-settings.test.ts
      test: "remembering the screen seen > keeps the one held on a tie, and changes nothing when nothing was declared"

    - id: V6.11
      scenario: No vaultSend block in data.json
      expect: Folder Obsidian, tablet "auto", Normal, toolbar left, nothing seen
      layer: unit
      file: src/vault-send-settings.test.ts
