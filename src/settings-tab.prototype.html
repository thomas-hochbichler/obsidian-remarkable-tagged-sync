<title>Tagged Sync Settings Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  PROTOTYPE, throwaway. Settings-redesign map, ticket 04.
  Three layouts of the whole tab (#a, #b, #c) x three Tag routing variants (1, 2, 3), switchable from
  the floating bar; the hash holds both (e.g. #b2). State lives in memory only. Built only from what
  research ticket 03 says Obsidian 1.13's declarative settings API can draw: groups with headings and
  heading buttons, sub-pages with a value and a warning state, lists with search/+/delete, and
  `render` rows of our own (pill cloud, status lines, filtered table).

<script>
const ICON = {
  chevR: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
  chevL: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  x: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  plus: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
  refresh: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M3 21v-5h5"/></svg>',
  warn: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg>',
};

const FOLDERS = ["/", "Inbox", "Journal", "Journal/reMarkable", "Work", "Work/Meetings", "Work/1on1", "Research", "Research/Papers", "Books", "Projects", "Projects/Garden", "Recipes", "Travel"];
const ALL_TAGS = ["1on1", "book-notes", "bujo", "design", "dev", "draft", "family", "finance", "garden", "german", "health", "ideas", "inbox", "journal", "kids",
  "lecture", "math", "meeting", "obsidian", "paper", "project-alpha", "quotes", "reading", "recipe", "retro", "sketch", "todo", "travel", "weekly-review", "workshop", "zotero"];
const THREE = { journal: "Journal/reMarkable", meeting: "Work/Meetings", paper: "Research/Papers" };
const TWELVE = { ...THREE, "1on1": "Work/1on1", "book-notes": "Books", bujo: "Journal", garden: "Projects/Garden", ideas: "Inbox", "project-alpha": "Projects",
  recipe: "Recipes", travel: "Travel", "weekly-review": "Journal" };
const PRESETS = {
  "pro": { tier: "pro", mapping: THREE, scanned: true },
  "pro-many": { tier: "pro", mapping: TWELVE, scanned: true },
  "pro-noscan": { tier: "pro", mapping: THREE, scanned: false },
  "free": { tier: "free", mapping: { journal: "Journal/reMarkable" }, scanned: true },
  "free-empty": { tier: "free", mapping: {}, scanned: true },
};
const LAYOUTS = { a: "One page", b: "Integrations on pages", c: "Short root page" };
const TRS = { 1: "Pills", 2: "List + dialog", 3: "Filtered table" };
const BACKENDS = [
  { v: "vision", l: "Apple Vision (built into macOS, default)", short: "Apple Vision" },
  { v: "local", l: "Downloaded model (managed by this plugin)", short: "Downloaded model" },
  { v: "ollama", l: "Ollama (your own server)", short: "Ollama" },
  { v: "lmstudio", l: "LM Studio (your own server)", short: "LM Studio" },
  { v: "custom", l: "Custom (any OpenAI-compatible server)", short: "Custom", pro: true },
  { v: "off", l: "Off — no transcription", short: "Off" },
];
const INTERVALS = [["launch", "Only on launch"], ["2", "Every 2 hours"], ["6", "Every 6 hours"], ["12", "Every 12 hours"], ["24", "Every 24 hours"]];
const REMOVAL = "Removing a tag stops syncing it. Notes already in your vault stay where they are.";
const CAP = "The free version syncs one tag. Remove the current mapping to choose a different one, or unlock unlimited tags with Tagged Sync Pro.";
const ISSUES = "https://github.com/thomas-hochbichler/obsidian-remarkable-tagged-sync/issues";

const S = {
  layout: "a", tr: 1, preset: "pro", tier: "pro", mapping: { ...THREE }, scanned: true, scanning: false,
  page: null, pop: null, modal: null, filter: "", listFilter: "", modalFilter: "", mode: "all",
  primary: "cloud", fallback: "none", attachments: "", marginNotes: true, frontmatter: true,
  backend: "vision", autoSync: true, interval: "6", metered: false, consent: false,
  zWeb: true, zKey: true, zLocal: false, zGroups: { "Reading group": true, "Thesis 2026": false },
  writeText: true, addRender: false, zFolder: "", zTag: "", sendOverSsh: false,
  rwPush: true, rwToken: false, info: true,
};

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const pro = () => S.tier === "pro";
const P = (name) => (pro() ? name : `${name} (Pro)`);
const cid = (key) => "c-" + key.replace(/[^a-z0-9-]/gi, "_");
const mappedTags = () => Object.keys(S.mapping).sort();
const unmapped = () => (S.scanned ? ALL_TAGS.filter((t) => !(t in S.mapping)) : []);
const capped = () => !pro() && mappedTags().length >= 1;
const folderLabel = (f) => (f === "/" ? "Vault root" : f);
const folderOpts = (cur) => {
  const o = FOLDERS.map((f) => ({ v: f, l: folderLabel(f) }));
  if (cur && !FOLDERS.includes(cur)) o.push({ v: cur, l: `${cur} (missing)` });
  return o;
};

function item(name, desc, ctl = "", o = {}) {
  return `<div class="si${o.cls ? " " + o.cls : ""}"${o.attrs || ""}><div class="si-info"><div class="si-name">${name}</div>${desc ? `<div class="si-desc">${desc}</div>` : ""}</div>${ctl ? `<div class="si-ctl">${ctl}</div>` : ""}</div>`;
}
function group(head, items, o = {}) {
  const shownHead = head === S.pageTitle ? "" : head;
  const headRow = shownHead || o.extra ? `<div class="sg-head"><h3>${shownHead}</h3>${o.extra ? `<div class="sg-extra">${o.extra}</div>` : ""}</div>` : "";
  return `<section class="sg"${o.id ? ` id="${o.id}"` : ""}>${headRow}<div class="sg-items">${items}</div>${o.foot ? `<div class="sg-foot">${o.foot}</div>` : ""}</section>`;
}
const toggle = (key, on, dis) => `<button class="tg${on ? " on" : ""}" id="${cid(key)}" role="switch" aria-checked="${!!on}" data-act="toggle" data-key="${key}"${dis ? " disabled" : ""}><span></span></button>`;
const select = (key, opts, val, dis) => `<select class="dd" id="${cid(key)}" data-key="${esc(key)}"${dis ? " disabled" : ""}>${opts.map((o) => `<option value="${esc(o.v)}"${o.v === val ? " selected" : ""}${o.dis ? " disabled" : ""}>${esc(o.l)}</option>`).join("")}</select>`;
const btn = (text, act, cls = "", extra = "") => `<button class="btn ${cls}" data-act="${act}" ${extra}>${text}</button>`;
const iconBtn = (act, tag, label, icon = ICON.x) => `<button class="icon-btn" data-act="${act}" data-tag="${esc(tag)}" aria-label="${esc(label)}" title="${esc(label)}">${icon}</button>`;
const pill = (tag, cls = "", act = "") => (act ? `<button class="tag ${cls}" data-act="${act}" data-tag="${esc(tag)}">#${esc(tag)}</button>` : `<span class="tag static ${cls}">#${esc(tag)}</span>`);
const text = (key, val, ph, type = "text") => `<input class="txt" id="${cid(key)}" type="${type}" data-text="${key}" placeholder="${esc(ph)}" value="${esc(val)}">`;
const filterBox = (key, ph) => `<input class="filter" id="${cid(key)}" type="search" data-filter="${key}" placeholder="${esc(ph)}" value="${esc(S[key])}" aria-label="${esc(ph)}">`;
function pageEntry(id, name, display, warn) {
  return item(name, "", `<span class="pv${warn ? " warn" : ""}">${warn ? ICON.warn : ""}${esc(display)}</span><span class="chev">${ICON.chevR}</span>`,
    { cls: "page-entry", attrs: ` data-act="page" data-page="${id}" tabindex="0" role="button"` });
}

/* ---------- groups ---------- */

function gConnection(syncInHeading) {
  const lab = (id) => (id === "ssh" ? "Your reMarkable directly (USB or Wi-Fi)" : "reMarkable cloud");
  const allowed = (id) => id === "cloud" || pro();

    select("primary", ["cloud", "ssh"].map((id) => ({ v: id, l: allowed(id) ? lab(id) : `${lab(id)} (Pro)`, dis: !allowed(id) })), S.primary));
  const other = S.primary === "cloud" ? "ssh" : "cloud";
  items += item("If that is not reachable", "Both sources hand this plugin the same content, so switching between them costs nothing and re-transcribes nothing.",
    select("fallback", [{ v: "none", l: "Stop and say so" }, { v: other, l: `Try ${lab(other)}`, dis: !allowed(other) }], S.fallback));
  if (S.primary === "ssh" || S.fallback === "ssh") items += item("Your reMarkable", "Paired with root@10.11.99.1 · host key pinned", btn("Re-pair", "noop") + btn("Forget device", "noop"));
  items += item("reMarkable cloud account", "Connected.", btn("Disconnect", "noop"));
  return group("reMarkable connection", items, { extra: syncInHeading ? btn(`${ICON.refresh}Sync now`, "sync", "mod-cta") : "" });
}

const scanBtn = () => btn(S.scanning ? "Scanning…" : `${ICON.refresh}Scan for tags`, "scan", "", S.scanning ? "disabled" : "");
const mappedRow = (t) => item(pill(t), "", select(`map:${t}`, folderOpts(S.mapping[t]), S.mapping[t]) + iconBtn("unmap", t, `Stop syncing #${t}`));

function tr1() {

    items += item("Not synced yet", "Scan your reMarkable to see the tags on your notebooks and pages.");

      <div class="block-body">${u.length > 12 ? filterBox("filter", "Filter tags…") : ""}<div class="pills${capped() ? " capped" : ""}">${pills}</div>${popover()}</div></div>`;

function popover() {

/* ---------- render ---------- */

const pane = document.getElementById("pane");
function render(keepScroll = true) {
  const active = document.activeElement;
  const focusId = active && active.id && active !== document.body ? active.id : null;
  const caret = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const top = pane.scrollTop;

  if (S.page && !PAGES[S.page]) S.page = null;
  if (S.page === "tags" && S.layout !== "c") S.page = null;
  const page = S.page ? PAGES[S.page] : null;
  S.pageTitle = page ? page.title : null;
  const crumb = page
    ? `<div class="crumb"><button class="icon-btn" data-act="back" aria-label="Back">${ICON.chevL}</button><button class="root-link" data-act="back">Tagged Sync</button><span class="sep">${ICON.chevR}</span><h2>${page.title}</h2></div>`
    : '<div class="crumb"><h2>Tagged Sync</h2></div>';
  document.getElementById("content").innerHTML = crumb + (page ? page.groups() : rootGroups()).join("");
  document.getElementById("dialog").innerHTML = S.modal === "add" ? addDialog() : "";
  S.pageTitle = null;

  if (keepScroll) pane.scrollTop = top;
  if (focusId) {
    const n = document.getElementById(focusId);
    if (n) { n.focus(); if (caret !== null && n.setSelectionRange) try { n.setSelectionRange(caret, caret); } catch (e) {} }
  }
  renderBar();
}

function renderBar() {
  document.getElementById("lay-label").innerHTML = `<span class="k">Layout</span> ${S.layout.toUpperCase()} · ${LAYOUTS[S.layout]}`;
  document.getElementById("tr-label").innerHTML = `<span class="k">Tag routing</span> ${S.tr} · ${TRS[S.tr]}`;
  document.getElementById("preset").value = S.preset;
  const dark = currentTheme() === "dark";
  document.getElementById("theme-btn").textContent = dark ? "Light" : "Dark";
  const info = document.getElementById("pinfo");
  info.hidden = !S.info;
  if (!S.info) return;
  const LN = {
    a: "Today's tab, re-ordered by ground rule 6, everything on one page. Zotero keeps its six headings; Sync now stays under Actions at the end. Global search finds every row; the longest scroll.",
    b: "Set-up groups stay on the root page. Zotero and Readwise move to sub-pages that show their state on the root (page value and warning, 1.13.1). Sync now moves into the connection heading. Research 03's ranking.",
    c: "A short root page, as large tabs do it (research 02): the connection inline, everything else a page entry showing its current value. Fewest rows on screen; one more click to reach any setting.",
  };
  const TN = {
    1: "Synced tags as rows (tag → folder, × stops it). Unsynced tags as a cloud of tag pills with a filter; click a pill, pick a folder. The pill cloud is one render row of our own: API lists draw rows, never pills.",
    2: "Only synced tags show, as an API list (search, + in the header, × per row). + opens a dialog of unsynced tags with a filter, like Templater's folder templates. Unsynced tags stay out of the tab.",
    3: "All tags in one compact table with a filter and All / Synced / Not synced. Each row has one dropdown whose first entry is Not synced. Today's rows, one line per tag.",
  };
  const map = mappedTags().map((t) => `${esc(t)} → ${esc(S.mapping[t])}`).join(", ") || "empty";
  info.innerHTML = `<button class="close" data-bar="info" aria-label="Close">×</button>
    <h4>Question</h4><p>How should the redesigned tab look: group order and names (ticket 05), and Tag routing for ~30 tags, few synced (ticket 06)?</p>
    <h4>Layout ${S.layout.toUpperCase()} · ${LAYOUTS[S.layout]}</h4><p>${LN[S.layout]}</p>
    <h4>Tag routing ${S.tr} · ${TRS[S.tr]}</h4><p>${TN[S.tr]}</p>
    <h4>State</h4><p>${S.tier === "pro" ? "Pro" : "Free"} · ${S.scanned ? `scanned, ${ALL_TAGS.length} tags found` : "not scanned (found tags are not stored, so each time the tab opens only synced tags are known)"}<br><code>tagFolderMap</code>: ${map}</p>
    <h4>Keys</h4><p>← → layout · Shift+← → Tag routing · the menu sets the vault state.</p>`;
}

/* ---------- actions ---------- */

let noticeTimer;
function notice(msg) {
  const el = document.getElementById("notice");
  el.innerHTML = `<div class="notice" role="status">${esc(msg)}</div>`;
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => (el.innerHTML = ""), 2600);
}
function mapTag(tag, folder) {
  if (!(tag in S.mapping) && capped()) return;
  S.mapping[tag] = folder;
  notice(`#${tag} syncs into ${folderLabel(folder)} from the next sync on.`);
}
function unmapTag(tag) {
  delete S.mapping[tag];
  notice(`#${tag} is no longer synced. Its notes stay where they are.`);
}
function applyPreset(key) {
  const p = PRESETS[key];
  Object.assign(S, { preset: key, tier: p.tier, mapping: { ...p.mapping }, scanned: p.scanned, pop: null, modal: null, filter: "", listFilter: "", modalFilter: "" });
}
function setLayout(l) { S.layout = l; S.page = null; S.pop = null; S.modal = null; syncHash(); render(false); pane.scrollTop = 0; }
function setTr(t) { S.tr = t; S.pop = null; S.modal = null; syncHash(); render(); }
function syncHash() { const h = "#" + S.layout + S.tr; if (location.hash !== h) history.replaceState(null, "", h); }
function currentTheme() { return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
function goPro() {
  S.pop = null; S.modal = null;
  if (S.layout === "c") { S.page = "pro"; render(false); pane.scrollTop = 0; return; }
  S.page = null; render();
  const g = document.getElementById("g-pro"); if (g) g.scrollIntoView({ behavior: "smooth", block: "start" });
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, tag = el.dataset.tag;
  switch (act) {
    case "toggle": {
      const k = el.dataset.key;
      if (k.startsWith("zg:")) S.zGroups[k.slice(3)] = !S.zGroups[k.slice(3)];
      else S[k] = !S[k];
      break;
    }
    case "page": S.page = el.dataset.page; S.pop = null; render(false); pane.scrollTop = 0; return;
    case "back": S.page = null; render(false); pane.scrollTop = 0; return;
    case "scan":
      S.scanning = true; render();
      setTimeout(() => { S.scanning = false; S.scanned = true; if (S.preset === "pro-noscan") S.preset = "pro"; notice(`Found ${ALL_TAGS.length} tags.`); render(); }, 700);
      return;
    case "unmap": unmapTag(tag); break;
    case "pop": S.pop = S.pop === tag ? null : tag; break;
    case "popclose": S.pop = null; break;
    case "gopro": goPro(); return;
    case "add": S.modal = "add"; S.modalFilter = ""; render(); { const f = document.getElementById(cid("modalFilter")); if (f) f.focus(); } return;
    case "bgclose": if (e.target !== el) return; S.modal = null; break;
    case "closedlg": S.modal = null; break;
    case "mode": S.mode = el.dataset.mode; break;
    case "sync": notice("Synced. 4 notebooks updated."); return;
    case "diag": notice("Diagnostics copied to the clipboard."); return;
    case "trial": S.tier = "pro"; notice("Trial started: 14 days of Tagged Sync Pro."); break;
    case "secret": S.rwToken = !S.rwToken; break;
    case "noop": notice("Not part of this prototype."); return;
    default: return;
  }
  render();
});
document.addEventListener("keydown", (e) => {
  const el = e.target.closest && e.target.closest('[data-act="page"]');
  if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); el.click(); return; }
  if (e.key === "Escape" && S.modal) { S.modal = null; render(); return; }
  if (e.target.matches && e.target.matches("input, textarea, select, [contenteditable]")) return;
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const d = e.key === "ArrowRight" ? 1 : -1;
  if (e.shiftKey) setTr(((S.tr - 1 + d + 3) % 3) + 1);
  else { const ks = Object.keys(LAYOUTS); setLayout(ks[(ks.indexOf(S.layout) + d + ks.length) % ks.length]); }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.id === "preset") { applyPreset(el.value); render(); return; }
  const key = el.dataset && el.dataset.key;
  if (!key) return;
  const v = el.value;
  if (key === "primary") { S.primary = v; if (S.fallback === v) S.fallback = "none"; }
  else if (key.startsWith("map:")) S.mapping[key.slice(4)] = v;
  else if (key === "popfolder") { if (!v) return; mapTag(S.pop, v); S.pop = null; }
  else if (key.startsWith("addmap:")) { if (!v) return; mapTag(key.slice(7), v); }
  else if (key.startsWith("t3:")) { const t = key.slice(3); if (v) mapTag(t, v); else unmapTag(t); }
  else S[key] = v;
  render();
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.filter) { S[el.dataset.filter] = el.value; render(); }
  else if (el.dataset && el.dataset.text) {
    if (el.dataset.text === "zKeyText") { const had = S.zKey; S.zKey = el.value !== ""; if (had !== S.zKey) render(); }
    else S[el.dataset.text] = el.value;
  }
});
document.querySelector(".pbar").addEventListener("click", (e) => {
  const b = e.target.closest("[data-bar]");
  if (!b) return;
  const ks = Object.keys(LAYOUTS);
  switch (b.dataset.bar) {
    case "lay-prev": setLayout(ks[(ks.indexOf(S.layout) + 2) % 3]); break;
    case "lay-next": setLayout(ks[(ks.indexOf(S.layout) + 1) % 3]); break;
    case "tr-prev": setTr(((S.tr + 1) % 3) + 1); break;
    case "tr-next": setTr((S.tr % 3) + 1); break;
    case "theme": document.documentElement.dataset.theme = currentTheme() === "dark" ? "light" : "dark"; renderBar(); break;
    case "info": S.info = !S.info; renderBar(); break;
  }
});
document.getElementById("pinfo").addEventListener("click", (e) => { if (e.target.closest("[data-bar='info']")) { S.info = false; renderBar(); } });

function readHash() {
  const m = /^#([abc])([123])$/.exec(location.hash);
  if (m) { S.layout = m[1]; S.tr = Number(m[2]); }
}
addEventListener("hashchange", () => { readHash(); S.page = null; render(false); });
readHash();
render(false);
</script>
